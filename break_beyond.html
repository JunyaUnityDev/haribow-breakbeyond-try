<style>
/* ─────────────────────────────────────────────────────────────
   BREAK BEYOND
   単独公演「Go Beyond」客席プレイ用ブロック崩し プロトタイプ
   1920x1080 論理解像度 / 紗幕プロジェクション前提の単一ビジュアル
   ───────────────────────────────────────────────────────────── */
:root{
  --void:#07080a;        /* 地。紗幕では黒＝透明なので、これが「消えた」状態 */
  --panel:#0d0f13;
  --ink:#f0ece0;         /* クリーム。公式サイト --cream と同値 */
  --dim:#7c8592;
  --faint:#3a414c;
  --teal:#63b6cc;        /* 公式サイト --teal */
  --teal-deep:#1f5b6e;   /* 公式サイト --teal-d */
  --terracotta:#c8433a;  /* 公式サイト --red */
  --line:rgba(240,236,224,.13);

  --font-display:"DIN Condensed","Oswald","Arial Narrow","Helvetica Neue Condensed",
                 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-data:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07080a;overflow:hidden}
body{color:var(--ink);font-family:var(--font-display);-webkit-font-smoothing:antialiased}

/* position:fixed にして、埋め込み先の body 高さに一切依存させない。
   canvas の実寸は JS(fitCanvas) が 16:9 を保って毎回入れる */
#stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#07080a;
}
canvas{display:block;background:#07080a;touch-action:none;cursor:pointer}
canvas:focus-visible{outline:2px solid var(--teal);outline-offset:-4px}
/* フリッキー（導入）。黒は紗幕では透明なので、画面でも screen で重ねて黒を消す */
/* ★2026-09-21：opacity の 0.6秒フェードをやめた（坂田「最初の登場がガタつきすぎている」）。
   **全画面の mix-blend-mode:screen の層に opacity のアニメを掛けると、画面全体を毎コマ
   合成し直すことになる。**しかも溶けて出る動きは iframe の中（シェーダ）が既にやっているので、
   外側で重ねる意味が無く、重さだけが乗っていた。ここは一瞬で切り替える。
   transform（隅へ寄る動き）は面積が変わるだけなので残す。 */
/* ★2026-09-22：iframe をやめてキャンバスにした。
   #flekkybox がゲームの画と同じ16:9の枠。その中でランタイムが 2:1 に収めて中央に置く
   ＝ iframe だった頃とまったく同じ見え方。枠が無いと縦に伸びる（実際に伸びた）。 */
/* ★下に揃える（2026-09-22・坂田「フリッキーが下に行く時まだ画面の中に見えてる」）。
   フリッキーの絵は 2:1、ゲームの枠は 16:9。真ん中に置くと**枠の下に黒い帯が残る**ので、
   沈んでいく途中で「宙で切れた頭」がそこに居座って見えた。
   下端を枠の下端に合わせれば、そのまま画面の外へ抜ける。 */
#flekkybox{position:absolute;pointer-events:none;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center}
#flekky{position:absolute;border:0;pointer-events:none;background:#000;mix-blend-mode:screen;opacity:0;
  transform-origin:0 100%;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
#flekky.on{opacity:1}
/* ★2026-09-21：使っていない間は合成の経路から外す。
   opacity:0 でも mix-blend-mode:screen は画面全体を毎フレーム合成させる＝ゲームがカクつく */
#flekky.asleep{display:none}
/* ★ビネットは CSS の静止した層にする（2026-09-21）。
   いままで**毎コマ 1920×1080 の画像を全画面に重ねて**いた（実測3〜5ms）。
   中身は一度も変わらないのに、60回/秒 描き直していた。
   CSS なら合成器が1回作って使い回す。見た目は同じ。 */
/* ★フリッキーだけの場面で使う字幕（2026-09-21）。
   ここを DOM にしておくと、**ゲームのキャンバスを丸ごと消せる**。
   消せば画面に出ている層はフリッキー1枚だけ＝サンプラー単体とまったく同じ条件になる。 */
#cap{position:absolute;display:none;pointer-events:none;color:#f0ece0;text-align:center;
  font:600 46px/1.42 "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  text-shadow:0 0 7px rgba(7,8,10,.9),0 0 7px rgba(7,8,10,.9),0 2px 3px rgba(7,8,10,.9);
  white-space:pre-line}
#cap.on{display:block}
/* ★落ちたコマの数。**キャンバスを消している間も見える**よう DOM に出す（2026-09-21）。
   O（オペHUD）が出ている時だけ。紗幕には出ない。 */
/* ★ウィンドウの下端に固定する（2026-09-21）。
   映像の枠に合わせて置いたら、窓が縦長の時に字幕と重なった。ここは読めればいい情報なので、
   いつも同じ場所（画面のいちばん下）に出す。 */
#dbg{position:fixed;left:12px;bottom:8px;display:none;pointer-events:none;color:#7c8592;
  font:500 13px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.06em;white-space:pre;
  background:rgba(7,8,10,.72);padding:3px 8px;border-radius:3px}
#dbg.on{display:block}
#vig{position:absolute;pointer-events:none;

#flekky.small{transform:translate(1.5%,-3%) scale(.42)}

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   0. 定数
   ══════════════════════════════════════════════════════════════ */
const W = 1920, H = 1080;
const HUD_H = 96;                 // 上部インストゥルメントバンド
const FIELD_TOP = HUD_H;
const WALL = 40;                  // 左右の壁の内側マージン
const DT = 1 / 120;               // 物理固定ステップ
/* ★6から3へ（2026-09-21）。1コマ重くなると次のコマで6回まで追いつこうとして、
   さらに重くなる（追いつきの悪循環）。3回までなら25msで頭打ちになる。 */
const MAX_STEPS = 3;

const PADDLE_W = 230, PADDLE_H = 20, PADDLE_Y = H - 108;
/* パドルの速さ。端から端まで 1610px。
   1750 だと 0.92秒かかり「重い」と言われた（坂田 2026-09-02）。
   2500 で 0.64秒。球の横速度は最速でも 1324px/s なので、追い越せる余裕は保つ */
const PADDLE_SPEED = 2500;        // px/s
const BALL_R = 13;
const BALL_SPEED_0 = 620;
const BALL_SPEED_MAX = 1500;
const MAX_BOUNCE_ANGLE = 62 * Math.PI / 180;

/* ══ 絶望要塞式の2段構え ═══════════════════════════════════
   富士急「絶望要塞」第4ステージの仕様を踏襲する。
     ① ブロックを壊してコアを露出させる
     ② 露出したコアに規定回数当てる（回数はルーレットで決まる）
   コアは回転するガードが守っていて、10秒で1回転する。
   隙間の開閉が客席から見えるので、1,200人が同時に「今だ」と分かる。
   ＝難度の翻訳（audience-winning-science）が構造でタダで手に入る。

   制限時間で終わるので、プレイ時間は腕前によらず固定される。 */
const CLOCK_SEC   = 240;              // 4分
let   CORE_R      = 76;               // コアの半径（13m投影で客席後方から見える大きさ）
const CORE_X      = W/2, CORE_Y = 397;
/* 以下はオートパイロット（腕前0.5〜0.9 × 3シード）で掃引して決めた値。
   露出率100% / 露出まで平均80秒 / クリア率33%。
   ＝必ずコアが見え、3回に1回は勝てる。勝敗が読めないので賭けが成立する。 */
let   EXPOSE_R    = 160;              // この円内のブロックが消えたら露出
const GUARD_ROT   = 10.0;             // 10秒で1回転（絶望要塞の実測値）
let   GUARD_ARMS  = 2;                // 対向2枚
/* ガードは穴(EXPOSE_R=160)の内側に収める。外にはみ出すと文字の上を掃いてしまう。
   GUARD_R0 + GUARD_LEN <= EXPOSE_R であること */
let   GUARD_LEN   = 76, GUARD_W = 30, GUARD_R0 = 82;
/* パドルを 1750→2500 px/s に上げた分だけ易しくなったので上げ直した。
   32/35/38 なら3〜5分率97%だがクリア率7%。30/33/36 は90%/18%。
   **早期クリアはオペが結果画面で待てる**（CRASHはNキー専用）ので尺を壊さない。
   1本の演目としては「5回に1回勝てる」方が客席が沸くのでこちらを取った */
let   NEED_ROULETTE = [30, 33, 36];   // ルーレットの目
/* コアは削るほど数が増える（坂田指示 2026-08-28）。
   1個のままだと「1発当てて戻る」の繰り返しで、連続して当てる気持ちよさが無い。
   分裂すると内側で往復して連鎖が起きる＝とんとん拍子になる。
   軌道半径＋分身の半径がガード内側(GUARD_R0)を超えないこと。超えると自分のガードに埋まる */
const CORE_SPLIT = [                  // 進行度(0〜1) → 分身の数・半径・軌道半径
  { at:0.00, n:1, r:76, orbit:0  },
  { at:0.25, n:2, r:50, orbit:30 },
  { at:0.52, n:3, r:40, orbit:38 },
];
const CORE_SPIN = 0.55;               // 分身が回る速さ rad/s
const ROLL_T = 2.4;                   // ルーレットが止まるまでの秒
/* 最初からコアを出したことで命中機会が10.8→17.1回に増えたので、必要回数も上げた。
   実測：3〜5分率95% / クリア率15%（前は5〜10%）。当たる瞬間が増えて、なお勝敗が読めない */
const EXPOSE_DEADLINE = 110;          // ここまでに露出しなければ強制的にこじ開ける（本番の安全弁）
/* 観戦の緊張はほぼニアミスで出来ている。
   コアの脇20pxを抜けたのと200px外したのが同じに見えるのは丸損なので、
   かすめたらコアが身をよじる＝「惜しい」を客席から見えるようにする */
const NEAR_MISS = 66;                 // コア表面からこの距離以内を通過したら「かすめた」
/* 残機を使い切った後の落球は時間で払う。合計の上限を切って尺の下振れを止める
   （8秒×6回＝最大48秒。最悪でも 4:00 → 3:12 で3分を割らない） */
/* ★残機。0でゲームオーバー（2026-09-21）。
   ここを増やすと下手な人でも尺が持つ。減らすと締まるが早く終わる。テクリハで決める数字。 */
const BREAK_LIVES = 5;
const LOSS_TIME_PENALTY = 8, LOSS_TIME_MAX = 48;   // ★旧：残機0のあと落とすと時間が減る。廃止
/* 照準の速さ。コアを狙うには±7.5°の精度が要る。速いと運になり、遅いと間延びする。
   0.55rad/s＝31°/s なら振り切りに4秒、7.5°に0.24秒。客席が線の動きを追える速さでもある */
const AIM_SPEED = 0.55;
const BUMP_DUR = 0.15, BUMP_CD = 0.26, BUMP_RISE = 28, BUMP_BOOST = 1.20;

/* ── CRASH（3段目）の尺。現場で触るのはここだけ ─────────────────
   glitch → desktop（無音・不安）→ oldtrack（旧音源が鳴り出す）
   → syserr → years（2026→2021）→ rewind（ロゴ再構築）→ hold（紗幕フライ）→ fade
   ★desktop はオペが N で切り上げられる（客のざわつきを見て決める）。
     押さなければ DESKTOP_MAX で自動的に次へ */
const CRASH_T = {
  glitch: 2.6,
  desktop: 9.0, desktopMax: 14.0,
  oldtrack: 8.0,
  /* ★ここから先は音のキュー sfx/rewind_cue.wav と1本で同期している（2026-09-16）。
     値を変えたら voice_gen/make_rewind_cue.py のタイムラインも同じに直して作り直すこと */
  syserr: 2.2,
  years: 4.2,
  rewind: 7.0,
  implode: 1.1,     // 一点へ吸い込まれる 0.75秒 ＋ 完全な無音 0.35秒
  roar: 1.8,        // 無音の後の一撃で爆ぜ、粒が ROAR の形になる
  hold: 2.6,        // ROAR のまま紗幕フライ
  fade: 1.8
};
const CRASH_IMPLODE_SUCK = 0.75;
const CRASH_YEAR_FROM = 2026, CRASH_YEAR_TO = 2021;   // Roar＝NDDL 2021
/* 年号が出る時刻（years の頭からの秒）。だんだん速く戻り、2021 で止まる */
const CRASH_YEAR_AT = [0.0, 0.85, 1.55, 2.10, 2.55, 2.90];
const CRASH_FINAL_WORD = 'Roar';     // 演目名の表記は「Roar」。ROAR ではない（坂田指摘 2026-09-20）
/* 最後の ROAR は、告知映像と同じタイトルカード（粒子が一筆書きで描く）を焼いた映像を出す。
   作り方: shared_tools/title_card_generator/title_draw.py --canvas 1920x1080 --edge-fade 240
   縁は「ぶつ切り」にせず、ぼんやり消えるマスクを掛けてある（紗幕投影のため・坂田指示 2026-09-20）。
   読めなければ従来の粒子（RoarFX）に落ちる */
const ROAR_VIDEO_SRC = 'media/roar_title.mp4';
/* デスクトップの下地（壁紙・ドック）。AIで生成した実写寄りの画像を使い、
   文字（メニューバー・ファイル名・時計）だけ canvas で描く。
   ★本物のデスクトップは絶対に映さない。ここに映るものは全部こちらで用意したもの（ADR-012） */
/* デスクトップの見せ方
   DESK_PHOTO … 1枚の画面写真をそのまま使う（坂田提供の画像をAIで高解像度化したもの）。
                 メニューバーとドックはその写真のものを使い、伏線のファイル名だけこちらで左に描く
   null にすると、生成した壁紙＋自作ドックの組み立て（DESK_WALL）に戻る */
const DESK_PHOTO = 'media/desk_photo_ai.png';
const DESK_WALL = 'media/desktop_wall_forest.png';
const DeskArt = {
  wall:null, dock:null, photo:null,
  load(){
    /* ?v= はキャッシュ対策。差し替えたのに古い画像が出る事故を防ぐ（実際に起きた 2026-09-20） */
    const V = '?v=20260920e';
    const get = (src)=>{ const i = new Image(); i.src = src + V; return i; };
    if(!this.wall) this.wall = get(DESK_WALL);
    if(!this.dock) this.dock = get('media/desktop_dock_crop.png');   // 生成画像のガラス板＋生成アイコン8個
    if(DESK_PHOTO && !this.photo) this.photo = get(DESK_PHOTO);
  },
  ready(i){ return i && i.complete && i.naturalWidth > 0; }
};

const RoarVideo = {
  el:null, ok:false, started:false,
  /* ★まるごと取ってから渡す。python3 -m http.server は Range に応えないので、
     <video src="...mp4"> のままだと Chrome が読み込みを終えられない（readyState=0 のまま） */
  load(){
    if(this.el) return;
    try{
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'auto';
      v.addEventListener('canplaythrough', ()=>{ this.ok = true; }, {once:true});
      v.addEventListener('error', ()=>{ this.ok = false; OpLink.error('ROAR映像を読めない: ' + ROAR_VIDEO_SRC); });
      this.el = v;
      fetch(ROAR_VIDEO_SRC).then(r=>{ if(!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
        .then(b=>{ v.src = URL.createObjectURL(b); v.load(); })
        .catch(e=>{ this.ok = false; OpLink.error('ROAR映像を読めない: ' + (e.message || e)); });
    }catch(e){ this.el = null; }
  },
  play(){
    if(!this.el || !this.ok) return false;
    try{ this.el.currentTime = 0; const p = this.el.play(); if(p && p.catch) p.catch(()=>{}); this.started = true; return true; }
    catch(e){ return false; }
  },
  stop(){ try{ if(this.el){ this.el.pause(); this.el.currentTime = 0; } }catch(e){} this.started = false; },
  /* 加算で重ねる＝黒は出ない（紗幕と同じ見え方） */
  draw(a){
    if(!this.started || !this.el) return false;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    try{ ctx.drawImage(this.el, 0, 0, W, H); }catch(e){ ctx.restore(); return false; }
    ctx.restore(); ctx.globalAlpha = 1;
    return true;
  }
};

/* ══ 導入：フリッキー（2026-09-16 坂田「フリッキーがAIR FOOTWORKSについてちょっと喋ってから、説明あってから、ゲームに入りたい」）
   0 待機（真っ黒）── N ──▶ ① AIR FOOTWORKS の話（フリッキーが画面いっぱい・字幕あり・最後に拍手の間）
   ──自動──▶ ② ゲームの説明（フリッキーは左下に小さく。奥でゲーム画面を出し、台詞に合わせて該当箇所を光らせる）
   ──自動──▶ フリッキーが溶けて消える ▶ タイトル（PRESS ✕）＝プレイヤーが押せば BREAK 開始
   ★どの段でも N で次へ飛ばせる（押し間違えても戻らない方向にだけ進む）
   台本・音声・字幕・演技は performance/flekky/voice/gen_game_intro.py が作る。
   フリッキーは game/flekky（performance/flekky へのリンク）の editor.html?embed=1 を iframe で置く。
   音はこちらが鳴らし、時刻だけ送る（iframe の自動再生制限を避け、音と口パクをずらさない） */
/* gate … ゲーム2（GATE）の前の解説。奥で GATE の自動実演を流す（坂田「2個目のゲームもフリッキーが解説しようかな」） */
/* rules_a で「手を挙げて」まで喋って**止まる**。オペが挙手を見て N を押すと rules_b（指名＋ルール）。
   rules_b の約40秒のあいだに、スタッフがプレイヤーを操作位置まで案内する（当日の段取りは
   `../客席プレイ_当日の段取り.md`） */
/* ★rules_b は**席番号で二人を指名する版**（2026-09-21）。
   それまで鳴っていた `jp_game_rules_b` は一人二役だった頃の「じゃあ、君。」「係の人が案内します」版で、
   **席番号版を作ったのに繋ぎ替えていなかった。**坂田「君じゃなくて席指定で」。
   組み合わせは **34 ＝ 東京大学D-act（17列10番）と 日本体育大学 乱縄（8列25番）** に固定
   （坂田「乱縄 アクトの二人にしよう」）。候補を変えるならここと段取り書の表を両方直す。 */
const INTRO_PARTS = { afw:'jp_game_afw', rules_a:'jp_game_rules_a',
                      rules_b:'jp_game_rules_b_34',
                      /* ★2026-09-21 坂田「ブロック崩しが終わったら次のNでフリッキー単体が出てきて、
                         その時にお客さんを変えたい。そこで一旦止めて、もう一度Nを押したら説明に入る」
                         GATE の録りを2つに切った（合成し直していないので声は同じ）。
                          handover … 「じゃあ、二人目。交代してください。」大きく単体・実演は出さない
                          gate     … 2行目から。隅に寄って、奥で実演
                          after_gate … 勝負のあと。二人目を席へ戻す間 */
                      handover:'jp_game_handover', gate:'jp_game_gate_body',
                      after_gate:'jp_game_after_gate' };
/* 交代の一言。GATE の残り本数がこれになったら自動で鳴る（顔は出さず、声と字幕だけ）。
   オペはこれを合図にメンバーを通路へ出す。当日の段取りは `../客席プレイ_当日の段取り.md` */
const SWAP_AT_DROPS = 15;      // ★旧：残り本数で合図していた。いまは GATE_SWAP_AT（合計得点）
const SwapCall = {
  raw:null, buf:null, subs:null, src:null, t0:0, done:false, playing:false,
  load(){
    if(this.raw !== null) return;
    this.raw = false;
    fetch('flekky/voice/out/jp_game_swap.mp3'+VOICE_V).then(r=>r.ok?r.arrayBuffer():null).then(ab=>{ this.raw = ab; }).catch(()=>{});
    fetch('flekky/subs/jp_game_swap.json'+VOICE_V).then(r=>r.json()).then(j=>{ this.subs = j; }).catch(()=>{});
  },
  async fire(){
    if(this.done) return; this.done = true;
    const c = Audio_.ctx;
    if(!this.buf && this.raw && c){ try{ this.buf = await c.decodeAudioData(this.raw.slice(0)); }catch(e){} }
    this.t0 = c ? c.currentTime : performance.now()/1000;
    if(this.buf && c && Audio_.comp){
      const src = c.createBufferSource(); src.buffer = this.buf;
      const g = c.createGain(); g.gain.value = 1.15;
      src.connect(g); g.connect(Audio_.comp);
      src.start(this.t0); this.src = src;
      Audio_.duckBefore(0.15, 0.55, 0.4);          // 声の前に周りを下げる
    }
    this.playing = true;
  },
  /* いま出す字幕。鳴り終わったら null */
  line(){
    if(!this.playing || !this.subs) return null;
    const c = Audio_.ctx;
    const t = (c ? c.currentTime : performance.now()/1000) - this.t0;
    if(t > this.subs.duration + 0.3){ this.playing = false; return null; }
    for(const l of this.subs.lines) if(t >= l.t0 - 0.05 && t <= l.t1 + 0.4) return l;
    return null;
  },
  reset(){ this.done = false; this.playing = false; try{ this.src && this.src.stop(); }catch(e){} this.src = null; }
};
/* ══════════════════════════════════════════════════════════════
   React ── ゲーム中のフリッキーのひとこと（2026-09-21）
   坂田「何かある時にフリッキーの声でなんか言って欲しい。めーっちゃたくさんのパターン。
         同じセリフ2回言わないように。でもちゃんと流れのある感じ」

   ・プールごとに順番を混ぜて頭から取る＝**一度出たセリフは二度と出ない**
   ・前のひとことから REACT_GAP 秒は黙る。重なりそうな時は言い直さず**捨てる**
   ・優先度が高いもの（落球・決着・壊れる演出）だけは、間を無視して割り込む
   台本の正典は performance/flekky/voice/lines_JP_reactions.md
   ══════════════════════════════════════════════════════════════ */
/* ★声の素材の版（2026-09-21）。
   **音や字幕を焼き直したら、必ずここを上げる。**
   上げないとブラウザが古いものを掴んだままになる（「直したのに直らない」の原因。過去に2回やっている）。
   op.html の読込数が合っているのに中身が古い、という一番気づきにくい事故になる。 */
const VOICE_V = '?v=20260921e';

/* ══════════════════════════════════════════════════════════════
   Boot ── 開いた瞬間に全部読み終える（坂田 2026-09-21）
   「htmlを開いた瞬間に読み込みを終わらせて、GOできるようになったらバックエンド画面に表示」

   本番は**開演の数分前に立ち上げる**ので、先に全部取ってしまうのが一番確実。
   途中で取ると、必ず「人が押した瞬間」とぶつかる（実際に3か所でぶつかっていた）。
   進み具合と「GOしていいか」を op.html に出す。**準備OK が出るまで N を押さない。**
   ══════════════════════════════════════════════════════════════ */
const Boot = {
  started:false, t0:0, doneAt:0,
  /* 何をいくつ読むか。ここに足したら必ず count() にも足す */
  need(){
    return SFX_NAMES.length + STEM_NAMES.length + LOOP_NAMES.length   // 効果音・曲
         + Object.keys(INTRO_PARTS).length                            // フリッキー6本
         + 3                                                          // 結果3本
         + (React.count() || 109)                                     // ひとこと
         + 3                                                          // デスク画像3枚
         + 1;                                                         // ROAR映像
  },
  have(){
    let n = Samples.loaded + Samples.failed;                          // 無い素材は「済み」扱い（合成音で鳴る）
    for(const k in INTRO_PARTS) if(Intro.bufs[INTRO_PARTS[k]]) n++;
    n += ResultVoice.ready();
    n += React.loaded();
    for(const i of [DeskArt.wall, DeskArt.dock, DeskArt.photo]) if(DeskArt.ready(i)) n++;
    if(RoarVideo.ok) n++;
    return n;
  },
  pct(){ const d = this.need(); return d ? Math.min(100, Math.round(this.have()/d*100)) : 0; },
  /* ★1つ取れないだけで永久に「準備中」にしない（2026-09-21）。
     60秒経ったら**足りないものを名指しして**準備OKにする。
     取れなかったものは合成音・粒子で代替されるので、公演は進む。
     op.html は「何が欠けているか」を出すので、オペがその場で判断できる。 */
  /* ★見切りの秒数。手元（ディスクから）は12秒で十分だが、
     配った先は**ネット越しに28MB**を取るので足りない。
     12秒で「準備OK」にすると、声が半分しか解けていないまま始まって
     フリッキーが無言で口だけ動く（実際になった）。
     localhost 以外は長めに待つ。 */
  TIMEOUT: /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) ? 12000 : 60000,        // ★60秒→12秒。1つ取れないだけで長く待たされるのが苦痛だった
  ready(){ return this.started && (this.have() >= this.need() || (performance.now() - this.t0) > this.TIMEOUT); },

  /* ★「始めるのに要るもの」だけ別に数える（2026-09-21・坂田
     「揃うまで待つでもいいんよ。でも go があったら必要な分だけでいくようにしたい」）。
     全部揃うのは待てばいい。ただし**急ぐ時は GO を出したら進める**ようにしておく。
       これだけ要る … フリッキーの音6本 ＋ 効果音と曲
       あとで間に合う … ひとこと109本（BREAK まで90秒）
                        デスク画像・ROAR映像・CRASH音（CRASH まで8分） */
  coreNeed(){ return Object.keys(INTRO_PARTS).length + SFX_NAMES.length + STEM_NAMES.length + LOOP_NAMES.length; },
  coreHave(){
    let n = Samples.loaded + Samples.failed;
    for(const k in INTRO_PARTS) if(Intro.bufs[INTRO_PARTS[k]]) n++;
    return n;
  },
  canGo(){ return this.started &&
    (this.coreHave() >= this.coreNeed() || (performance.now() - this.t0) > this.TIMEOUT); },
  missing(){
    const m = [];
    if(React.count() && React.loaded() < React.count()) m.push('ゲーム中の声');
    if(ResultVoice.ready() < 3) m.push('結果の声');
    for(const k in INTRO_PARTS) if(!Intro.bufs[INTRO_PARTS[k]]) { m.push('フリッキー(' + k + ')'); break; }
    if(![DeskArt.wall, DeskArt.dock, DeskArt.photo].every(i => DeskArt.ready(i))) m.push('デスク画像');
    if(!RoarVideo.ok) m.push('ROAR映像');
    return m;
  },
  secs(){ return this.doneAt ? (this.doneAt - this.t0)/1000 : (performance.now() - this.t0)/1000; },
  async run(){
    if(this.started) return;
    this.started = true; this.t0 = performance.now();
    try{ Audio_.init(); }catch(e){}
    /* 画に出るもの・音の出口から先に。あとは並行でよい */
    DeskArt.load(); RoarVideo.load();
    React.load(); ResultVoice.load();
    Samples.loadGame(); Samples.loadCrash();
    await Intro.preload('afw');                    // ここだけ待つ（一発目に要る）
    if(Intro.el && Intro.phase === 'standby') Intro.el.classList.add('on');   // 合成の層を先に作る
    /* 残りのフリッキーの音も解いておく（口パクは各段の頭で焼く。70ms 程度） */
    for(const k in INTRO_PARTS){ try{ await Intro.decode(INTRO_PARTS[k]); }catch(e){} }
    React.decodeAll();
    const wait = async ()=>{ for(let i=0;i<600 && !this.ready();i++) await new Promise(r=>setTimeout(r,100)); };
    await wait();
    this.doneAt = performance.now();
    console.log(`[BREAK BEYOND] 準備完了 ${this.secs().toFixed(1)}秒  ${this.have()}/${this.need()}`);
  }
};

const REACT_GAP = 8.0;            // ふつうのひとことの最短間隔（秒）
const React = {
  idx:null, bufs:{}, order:{}, used:{}, loading:false,
  playing:false, pri:-1, src:null, t0:0, dur:0, text:'', lastEnd:-99,
  load(){
    if(this.idx !== null || this.loading) return;
    this.loading = true;
    fetch('flekky/subs/reactions.json'+VOICE_V).then(r=>r.json()).then(j=>{
      this.idx = j;
      for(const k in j.pools){
        if(j.pools[k].dropped) continue;        // 声が違うと判断して落としたプール（drop_pools.py）
        const n = j.pools[k].clips.length;
        const o = [...Array(n).keys()];
        if(!j.pools[k].ordered) for(let i=n-1;i>0;i--){ const r2 = Math.floor(Math.random()*(i+1)); [o[i],o[r2]]=[o[r2],o[i]]; }
        this.order[k] = o; this.used[k] = 0;
      }
      this.prefetch();
    }).catch(()=>{ this.idx = false; });
  },
  /* 本番中に読みに行くと詰まるので、全部先に取って解いておく（123本で約4MB） */
  prefetch(){
    if(!this.idx) return;
    for(const k in this.idx.pools){
      if(this.idx.pools[k].dropped) continue;   // 落としたものは取りに行かない
      for(const c of this.idx.pools[k].clips){
      fetch('flekky/voice/out/' + c.f + VOICE_V).then(r=>r.ok?r.arrayBuffer():null).then(ab=>{
        if(!ab) return;
        const ctx = Audio_.ctx;
        if(ctx) ctx.decodeAudioData(ab.slice(0)).then(b=>{ this.bufs[c.f] = b; }).catch(()=>{});
        else this.bufs[c.f] = ab;             // 音がまだ起きていない＝あとで解く
      }).catch(()=>{});
      }
    }
  },
  /* 音が起きる前に取った分は ArrayBuffer のまま。起きた所でまとめて解く。
     解けていないと最初の数回が黙る（開始直後がいちばん黙ってほしくない） */
  decodeAll(){
    const ctx = Audio_.ctx; if(!ctx) return;
    for(const k in this.bufs){
      const v = this.bufs[k];
      if(v instanceof ArrayBuffer) ctx.decodeAudioData(v.slice(0)).then(b=>{ this.bufs[k] = b; }).catch(()=>{});
    }
  },
  ready(){ return !!this.idx && Object.keys(this.bufs).length > 0; },
  loaded(){ return this.idx ? Object.keys(this.bufs).length : 0; },
  count(){ if(!this.idx) return 0; let n=0;
    for(const k in this.idx.pools) if(!this.idx.pools[k].dropped) n += this.idx.pools[k].clips.length;
    return n; },
  left(k){ const p = this.idx && this.idx.pools[k];
    return (p && !p.dropped) ? p.clips.length - (this.used[k]||0) : 0; },
  speaking(){
    if(!this.playing) return false;
    const t = this.now() - this.t0;
    if(t > this.dur + 0.15){ this.playing = false; this.lastEnd = this.now(); return false; }
    return true;
  },
  now(){ const c = Audio_.ctx; return c ? c.currentTime : performance.now()/1000; },
  /* pri: 0=相づち 1=軽い 2=区切り 3=間を飛ばしてでも言う（落球・決着・壊れる演出）
     ★2026-09-21 坂田「言葉を言ってる途中で別のトリガーでその言葉が上書きされるのは、なし。
       で、時間が巻き戻る演出の時はしょうがない」
     → **喋っている最中は、どんなに優先度が高くても割り込まない。**言いかけの語尾が切れる方が汚い。
       例外は壊れる演出の2本だけ（あそこは画も音も壊れていく所なので構わない） */
  say(pool, pri){
    pri = pri || 0;
    if(!this.idx || !this.idx.pools[pool]) return false;
    if(this.left(pool) <= 0) return false;                 // 言い切った＝黙る（同じものは二度出さない）
    const busy = this.speaking();
    if(busy && pool !== 'c_crash') return false;           // ★言い終わるまで待つ。上書きしない
    if(!busy && pri < 3 && this.now() - this.lastEnd < REACT_GAP) return false;
    const p = this.idx.pools[pool];
    const c = p.clips[this.order[pool][this.used[pool]]];
    const buf = this.bufs[c.f];
    if(!buf) return false;
    const ctx = Audio_.ctx;
    if(buf instanceof ArrayBuffer){                        // まだ解けていない。解いて次の機会に回す
      if(ctx) ctx.decodeAudioData(buf.slice(0)).then(b=>{ this.bufs[c.f] = b; }).catch(()=>{});
      return false;
    }
    this.used[pool]++;
    if(busy){ try{ this.src && this.src.stop(); }catch(e){} }
    if(ctx && Audio_.comp){
      const src = ctx.createBufferSource(); src.buffer = buf;
      const g = ctx.createGain(); g.gain.value = 1.15;
      src.connect(g); g.connect(Audio_.comp);
      this.t0 = ctx.currentTime; src.start(this.t0); this.src = src;
      Audio_.duckBefore(0.10, 0.62, 0.35);                 // 声の前に曲を少し下げる
    } else { this.t0 = this.now(); }
    this.playing = true; this.pri = pri; this.dur = c.dur; this.text = c.ja;
    return true;
  },
  /* いま出す字幕。鳴り終わったら null */
  line(){ return this.speaking() ? this.text : null; },
  /* 言いかけを切る。壊れる演出に入る時だけ使う */
  cut(){ try{ this.src && this.src.stop(); }catch(e){} this.src = null; this.playing = false; this.lastEnd = this.now(); },
  reset(){
    try{ this.src && this.src.stop(); }catch(e){}
    this.src = null; this.playing = false; this.lastEnd = -99; this.pri = -1;
    for(const k in this.used) this.used[k] = 0;            // R でやり直した時は全部戻す
    for(const k in this.order){
      const o = this.order[k];
      if(this.idx && !this.idx.pools[k].ordered)
        for(let i=o.length-1;i>0;i--){ const r2 = Math.floor(Math.random()*(i+1)); [o[i],o[r2]]=[o[r2],o[i]]; }
    }
  }
};

const INTRO_OUTRO = 1.4;          // フリッキーが溶けて消える秒
const Intro = {
  el:null, phase:'standby', kind:'pre', stem:null, dur:0, t0:0, src:null, running:false, clockAudio:false,
  raw:{}, bufs:{}, subs:{}, ready:{}, model:false, lastT:0, outroAt:0, line:null, lineIdx:-1, focus:null, focusT:0, revealT:0,
  baked:null, _asleep:false,
  mount(){
    if(this.el) return;
    /* ★iframe をやめた（2026-09-22・坂田「アイフレームもなくしてゲームに入れ込んじゃおう」）。
       フリッキーは `flekky/flekky_runtime.js` を**このページに直接読み込んで**動かす。
       editor.html と同じファイルなので、片方だけ直して食い違う事故が起きない。
       これで無くなるもの：
         ・別文書ぶんのコマ送り（同じスレッドで順番待ちしていた）
         ・毎コマの postMessage
         ・全画面の screen 合成（層が1枚減る）
       置き場所は今までと同じ #flekky。CSS もキー操作もそのまま使える。 */
    const box = document.createElement('div'); box.id = 'flekkybox';
    const f = document.createElement('canvas');
    f.id = 'flekky'; f.setAttribute('aria-hidden','true');
    box.append(f);
    document.getElementById('stage').append(box);
    this.el = f; this.box = box;
    fitCanvas();                       // ★箱の大きさと位置を決める（これが無いと 0x0 のまま）
    window.FLEKKY_BASE = 'flekky/';
    window.FLEKKY_CANVAS_ID = 'flekky';
    window.FLEKKY_STAGE_ID = 'flekkybox';
    window.FLEKKY_OPTS = { embed:true, res:1, fps:0, vv: VOICE_V.slice(3) };
    if(!window.FlekkyRT){
      const sc = document.createElement('script');
      sc.src = 'flekky/flekky_runtime.js?v=20260922c';
      sc.onload = ()=>{ try{
        window.FlekkyRT.boot().then(ok=>{ this.model = !!ok; });
      }catch(e){ OpLink.error('フリッキー: ' + (e.message||e)); } };
      sc.onerror = ()=>OpLink.error('フリッキーの本体を読めません（flekky_runtime.js）');
      document.head.append(sc);
    } else {
      window.FlekkyRT.boot().then(ok=>{ this.model = !!ok; });
    }
    for(const k in INTRO_PARTS){
      const stem = INTRO_PARTS[k];
      fetch(`flekky/voice/out/${stem}.mp3`+VOICE_V).then(r=>r.ok ? r.arrayBuffer() : null).then(ab=>{ if(ab) this.raw[stem] = ab; }).catch(()=>{});
      fetch(`flekky/subs/${stem}.json`+VOICE_V).then(r=>r.json()).then(j=>{ this.subs[stem] = j; }).catch(()=>{});
    }
  },
  /* いまは外さない（眠らせるだけ）。外すと次に出す時にモデルを読み直して数秒待つ */
  unmount(){ if(this.el){ this.el.remove(); this.el = null; }
             this.model = false; this.ready = {}; this.baked = null; this._asleep = false; },
  /* ★postMessage の代わり。同じページの中なので、直に呼ぶ（2026-09-22）。
     命令の名前は今までと同じにしてある＝呼び出し側を書き換えずに済む。 */
  post(m){
    const R = window.FlekkyRT; if(!R || !m) return;
    try{
      switch(m.cmd){
        case 't':     R.setTime(m.t); break;
        case 'subs':  R.subs(m.on); break;
        case 'hide':  R.hide(); break;
        case 'sleep': R.sleep(); break;
        case 'wake':  R.wake(); break;
        case 'warm':  R.warm(); break;
        case 'load':
          R.load(m.stem, m.keepAppear)
           .then(()=>{ this.ready[m.stem] = true; })
           .catch(err=>OpLink.error('フリッキー: ' + (err && err.message || err)));
          break;
      }
    }catch(e){ OpLink.error('フリッキー: ' + (e.message || e)); }
  },
  onMessage(e){
    const m = e.data || {};
    if(m.src !== 'flekky') return;              // 旧 iframe 用。残しておくだけ
    if(m.evt === 'model') this.model = true;
    if(m.evt === 'ready') this.ready[m.stem] = true;
    if(m.evt === 'error') OpLink.error('フリッキー: ' + m.msg);
  },
  async decode(stem){
    if(this.bufs[stem]) return this.bufs[stem];
    if(!Audio_.ctx || !this.raw[stem]) return null;
    try{ this.bufs[stem] = await Audio_.ctx.decodeAudioData(this.raw[stem].slice(0)); }catch(e){ return null; }
    return this.bufs[stem];
  },
  async start(part){
    const stem = INTRO_PARTS[part];
    this.stop(); this.wake();
    /* 説明に入ったら盤面を動かす。交代の一言の間は止めてある（フリッキー単体で見せる） */
    if(part === 'gate' && G.gate){ G.gate.freeze = false; G.gate.demo = true; }
    /* ★重いものはここから読み始める。フリッキーが喋っている裏で取る */
    /* ★段階読み込みは廃止（2026-09-21）。Boot が開いた瞬間に全部済ませる。
       ここで呼んでも「もう済んでいる」ので素通りするが、**準備OK を待たずに N を押された時**の保険として残す */
    if(part === 'rules_b'){ React.load(); ResultVoice.load(); }
    Audio_.unmuteNow();     // ★温めの無音が残っていたらここで必ず戻す（2026-09-22）
    this.phase = part; this.stem = stem; this.line = null; this.lineIdx = -1; this.focus = null;
    if(part === 'rules_a') this.revealT = 0;
    const j = this.subs[stem]; this.dur = j ? j.duration : 30;
    this.ready[stem] = false;
    // 画面いっぱいで出すもの。gate の説明だけ隅に寄る（奥の実演を見せるため）
    const BIG = ['afw','handover','after_gate'];
    if(this.el) this.el.classList.toggle('small', !BIG.includes(part));
    /* ★待たない（2026-09-21 坂田「焼くのやめる」）。
       以前は「モデル待ち最大3秒 → 口パクを焼く最大1.5秒」を N のあとにやっていたので、
       押してから出るまでが遅く、しかも待っている間に音だけ先に進んで
       **途中からフリッキーが出てくる**ように見えた。
       いまは **N を押した瞬間に出して喋り始める。**口パクは用意できた所から合流する
       （実測 afw 336ms／他 69ms ＝ ほぼ気づかない）。 */
    if(this.baked !== stem) this.post({cmd:'load', stem, keepAppear: part !== 'afw'});
    this.post({cmd:'subs', on: part === 'afw'});       // afw 以外の字幕はゲーム側が大きく出す
    const buf = await this.decode(stem);
    this.baked = stem;
    if(this.stem !== stem || this.phase !== part) return; // 待っている間に N で飛ばされた
    /* 表示は台本を読み終えてから。先に出すと、素の顔が一瞬映って点滅に見える（2026-09-20）。
       ★2026-09-21：出す1コマ前に**層だけ作らせる**。display:none から出すのと
       溶け始めが同じコマに来ると、層の用意と描画がぶつかって頭が飛ぶ。
       中身はまだ消えている（appear=0）ので、何も映らない。 */
    /* ★待たない（2026-09-21）。層は起動時に作ってある（`preload` のあとで `on` にしてある）ので、
       ここで作られることはない。待つ必要が無くなったぶん、N は素通りで出る。 */
    if(this.el){ this.el.classList.remove('asleep'); this.el.classList.add('on'); }
    const c = Audio_.ctx;
    if(buf && c && Audio_.comp){
      if(c.state === 'suspended') c.resume().catch(()=>{});
      const src = c.createBufferSource(); src.buffer = buf;
      const g = c.createGain(); g.gain.value = 1.15;
      src.connect(g); g.connect(Audio_.comp);
      this.t0 = c.currentTime + 0.05; src.start(this.t0); this.src = src; this.clockAudio = true;
    } else {
      this.t0 = performance.now()/1000; this.clockAudio = false;   // 音が無くても絵と字幕は進める
    }
    this.running = true;
  },
  now(){
    if(!this.running) return this.lastT;
    if(this.clockAudio && Audio_.ctx && Audio_.ctx.state === 'running') return Math.max(0, Audio_.ctx.currentTime - this.t0);

  },
  stop(){ try{ if(this.src) this.src.stop(); }catch(e){} this.src = null; this.running = false; },
  update(dt){
    if(this.phase !== 'afw' && this.phase !== 'standby') this.revealT += dt;
    if(this.phase === 'standby' || this.phase === 'blank' || this.phase === 'done') return;
    if(this.phase === 'wait'){
      this.post({cmd:'t', t: this.lastT + (performance.now()/1000 - this.holdAt)});   // 揺れを止めない
      return;
    }
    if(this.phase === 'outro'){
      const e = performance.now()/1000 - this.outroAt;
      this.post({cmd:'t', t:this.lastT + e});
      if(e >= INTRO_OUTRO) this.done();
      return;
    }
    /* ★まだ鳴り始めていない間は字幕を出さない（2026-09-21）。
       start() は音を用意する間 await で待つ。その間 phase と stem は**新しい方**に変わっているのに
       時計（t0）は**前の段のまま**なので、t が大きくなり、
       新しい段の**後ろの方の行**が一瞬だけ出ていた
       （坂田「『手ぇ挙げてもらって』のあと『送ってあげてください』の文字が一瞬でる」）。 */
    if(!this.running){ this.line = null; this.lineIdx = -1; this.post({cmd:'t', t:0}); return; }
    const t = this.now(); this.lastT = t;
    /* ★B（2026-09-22）：時計の送信を**毎コマ→10回/秒**に落とした。
       iframe は自分の時計（extNow）で回っていて、ここから来る値は**寄せ込みにしか使っていない**。
       それを1秒に60回送ると、同じスレッドに60個の処理が並ぶ＝サンプラーの描画が順番待ちする。
       エディタ単体にはこの仕事が無い。ずれたら 0.25秒で合わせ直す仕組みは元からある。 */
    const _n = performance.now();
    if(_n - (this._tAt || 0) >= 100){ this._tAt = _n; this.post({cmd:'t', t}); }
    const j = this.subs[this.stem];
    if(j){
      let idx = -1;
      for(let i=0;i<j.lines.length;i++) if(t >= j.lines[i].t0 - 0.05) idx = i;
      if(idx !== this.lineIdx){
        this.lineIdx = idx;
        const l = j.lines[idx];
        const f = !l ? null : (idx === j.lines.length-1 ? 'all' : l.focus);
        if(f !== this.focus){ this.focus = f; this.focusT = 0; }
      }
      const l = j.lines[this.lineIdx];
      this.line = (l && t <= l.t1 + 0.35) ? l : null;
    }
    this.focusT += dt;
    if(this.running && t > this.dur + 0.15){
      if(this.phase === 'afw') this.start('rules_a');
      else if(this.phase === 'rules_a') this.hold();          // 挙手を待つ。次は N
      /* ★交代の一言で止める。客を入れ替える時間を取るため、次の N まで待つ */
      else if(this.phase === 'handover') this.hold();
      else if(this.phase === 'after_gate') this.hold();       // 席へ戻すあいだ待つ
      else if(this.phase === 'rules_b' || this.phase === 'gate') this.outro();

  },
  /* 「手を挙げて」で止まる。フリッキーは出たまま、ふわふわ揺れて待つ */
  hold(){
    this.stop(); this.phase = 'wait'; this.holdAt = performance.now()/1000; this.line = null;
  },
  /* ★フリッキーが画面を持っている間は true。
     **段を増やしたら必ずここに足す。**忘れると
      ・フリッキーの字幕でなくゲーム中のひとことが出る
      ・N がフリッキーに届かず CRASH へ飛ぶ
     という壊れ方をする（2026-09-21 に handover / after_gate で実際に起きた） */
  busy(){ return ['afw','rules_a','wait','rules_b','handover','gate','after_gate','outro'].includes(this.phase); },
  /* ★開いた直後に、最初の一本だけ焼いておく（2026-09-21）。
     N を押してから「モデル待ち→口パクを焼く→音を解く」をやると、実測で**最大4.5秒**待つ。
     本番の一発目がそれでは使えないので、先に済ませる。画は出ない（隠れたまま焼くだけ）。 */
  async preload(part){
    if(!this.el) this.mount();
    const stem = INTRO_PARTS[part];
    if(this.baked === stem) return;
    const w = performance.now();
    while(!this.model && performance.now() - w < 6000) await new Promise(r=>setTimeout(r, 30));
    if(!this.model) return;
    this.post({cmd:'load', stem, keepAppear: part !== 'afw'});
    await this.decode(stem);
    const w2 = performance.now();
    while(!this.ready[stem] && performance.now() - w2 < 4000) await new Promise(r=>setTimeout(r, 30));
    if(this.ready[stem]) this.baked = stem;
    /* ★隠れているうちに一度だけ本気で描かせる（2026-09-21）。
       初めて見えるコマでシェーダの組み立てとテクスチャ転送が走るのを、ここで前倒しする。 */

  },
  outro(){ this.stop(); this.phase = 'outro'; this.outroAt = performance.now()/1000; this.line = null; this.focus = 'all'; this.post({cmd:'hide'}); },
  /* ★描画ごと止める／再開する（2026-09-21）。ゲーム中に 3D を回し続けない */
  sleep(){ if(!this.el || this._asleep) return; this._asleep = true;
           this.post({cmd:'sleep'}); this.el.classList.remove('on'); this.el.classList.add('asleep'); },
  wake(){ if(!this.el || !this._asleep) return; this._asleep = false;
          this.el.classList.remove('asleep'); this.post({cmd:'wake'}); },
  /* ★次に喋るぶんを、眠っている iframe の中で先に焼いておく（画には出ない）。

     ★2026-09-22 に2つ直した。
     ①**焼く物が違っていた。** 焼いていたのは `gate` だが、ブロック崩しのあと実際に最初に喋るのは
       `handover`（交代の一言）。`start()` は `this.baked = stem` で1本しか持てないので、
       焼いた `gate` は**使われる前に handover に上書きされて捨てられていた**。まるまる無駄。
     ②**焼く時刻が悪かった。** ブロック崩しの**開始4秒後**に走らせていた。
       焼き込みは「mp3を取る→口パクを全コマ分たたき出す→GLを3回本気で描く」で、
       同じスレッドを数百ms 止める。ログでは開始+0〜30秒に荒れが集中していた
       （30秒のうち 14.6秒ぶんのコマが落ちていた）。
       いまは**結果画面に入ってから**焼く。玉はもう動いていないので、止まっても誰も困らない。 */
  prebakeNext(){ setTimeout(()=>{ this.preload('handover').catch(()=>{}); }, 600); },
  done(){
    if(this.kind === 'after'){                   // 席へ戻し終えた → ここで初めて CRASH
      this.stop(); this.phase = 'done'; this.sleep(); startCrash(); return;
    }
    /* ★2026-09-21：外さずに眠らせる。
       外すと次に出す時（GATE の解説）にモデルを読み直し、**最大3秒待たされる**（坂田「ラグえぐい」）。
       眠らせてあれば描画は止まったままで、起こせばすぐ出る */
    this.stop(); this.phase = 'done'; this.sleep();

    G.act = 'break'; G.state = 'title'; G.elapsed = 0;
  },
  /* オペの N。どの段からでも「次」へ */
  next(){

       準備OK の表示を消してから客席に向き合う間を作る。客席には**何も出ていない黒**だけが残る。 */
    if(this.phase === 'standby'){ this.kind = 'pre'; this.phase = 'blank'; return; }
    if(this.phase === 'blank'){ this.start('afw'); return; }
    else if(this.phase === 'afw') this.start('rules_a');
    else if(this.phase === 'rules_a') this.hold();       // 呼びかけを打ち切って挙手待ちへ
    else if(this.phase === 'wait'){
      /* 「待ち」は3か所ある。どこで待っているかで次が変わる */
      if(this.kind === 'gate') this.start('gate');        // 交代が済んだ → 説明へ
      else if(this.kind === 'after') this.done();         // 席へ戻し終えた → 次は CRASH
      else this.start('rules_b');                         // ★指名。ここが本番の「N」
    }
    else if(this.phase === 'handover') this.start('gate');
    else if(this.phase === 'after_gate') this.hold();
    else if(this.phase === 'rules_b' || this.phase === 'gate') this.outro();
    else if(this.phase === 'outro') this.done();
  }
};

/* 実演の操作：落とす → 半分ほど落ちたら1レーンずらす（ロック前） */

  d.actionEdge = false; d.axis = 0; d.cd -= dt;

/* ── GATE（通す）モード ─────────────────────────────────────
   紗幕の奥に演者が立ち、客席の一人が「隙間の位置」と「落とす瞬間」を決める。
   当たり判定は袖の人がキーで出す（カメラ検出は本番で落ちるので使わない）。

     ・詰み  … 9本目以降は3レーン離れると物理的に届かない（猶予1.59秒／必要1.65秒）

   新仕様：**穴は演者の足元に現れ、客がそれを引き剥がす。**
