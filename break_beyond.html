/* 2026 → 2021 */
/* 文字を点で標本化する。カウントダウンエディタ（solo_show/countdown/editor.html）と同じやり方。
   縁からの距離を持たせて、均一に光らせない（teamlab-cg-blender.md：墨の階調） */
const GlyphPts = {
  cache:{},
  get(str, px, step){
    step = step || 1;
    const key = str + '@' + px + '/' + step;
    if(this.cache[key]) return this.cache[key];
    const cv = document.createElement('canvas');
    const g = cv.getContext('2d', {willReadFrequently:true});
    g.font = `700 ${px}px ${FD}`;
    const m = g.measureText(str);
    const w = Math.ceil(m.width) + 40, h = Math.ceil(px*1.4) + 40;
    cv.width = w; cv.height = h;
    g.font = `700 ${px}px ${FD}`; g.fillStyle = '#fff';
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.clearRect(0,0,w,h); g.fillText(str, 20, h/2);
    const im = g.getImageData(0,0,w,h).data;
    const lit = [];
    for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step) if(im[(y*w+x)*4+3] > 128) lit.push([x,y]);
    // 縁らしさ＝8方向のうち外に出る本数
    const pts = [];
    for(const [x,y] of lit){
      let out = 0;
      for(let k=0;k<8;k++){
        const a = k/8*6.283;
        const qx = Math.round(x+Math.cos(a)*6), qy = Math.round(y+Math.sin(a)*6);
        if(qx<0||qy<0||qx>=w||qy>=h || im[(qy*w+qx)*4+3] <= 128) out++;
      }
      pts.push({x: x - w/2, y: y - h/2, edge: out/8});
    }
    for(let i=pts.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pts[i],pts[j]]=[pts[j],pts[i]]; }
    this.cache[key] = pts;
    return pts;
  }
};

/* 年号は文字を置かず、粒子を年号の形へ集める。
   年が変わる瞬間に目標だけ差し替えると、粒が散らずに次の形へ流れ込む。
   割り当ては貪欲最近傍（index順だと交差して汚くなる：teamlab憲章） */
const YearFX = {
  p:[], year:null, t:0,
  retarget(str){
    const pts = GlyphPts.get(str, 300);
    const N = Math.min(2800, pts.length);   // 13m投影で数字として読める密度
    if(!this.p.length){
      for(let i=0;i<N;i++){
        const a = Math.random()*6.283, r = 420 + Math.random()*680;
        this.p.push({ x: W/2 + Math.cos(a)*r, y: H/2 + Math.sin(a)*r*0.6,
                      vx:0, vy:0, tx:0, ty:0, edge:0, s:Math.random() });
      }
    }
    // 貪欲最近傍で割り当てる（粗いグリッドで近い点から取る）
    const pool = pts.slice(0, Math.max(N, this.p.length));
    const used = new Uint8Array(pool.length);
    for(const q of this.p){
      let best=-1, bd=1e18;
      // 全探索は重いので、ランダムに48点見て一番近い未使用を取る
      for(let k=0;k<48;k++){
        const i = (Math.random()*pool.length)|0;
        if(used[i]) continue;
        const dx = (W/2 + pool[i].x) - q.x, dy = (H/2 + pool[i].y) - q.y;
        const d = dx*dx + dy*dy;
        if(d < bd){ bd = d; best = i; }
      }
      if(best < 0){ for(let i=0;i<pool.length;i++) if(!used[i]){ best=i; break; } }
      if(best < 0) best = (Math.random()*pool.length)|0;
      used[best] = 1;
      q.tx = W/2 + pool[best].x; q.ty = H/2 + pool[best].y; q.edge = pool[best].edge;
    }
  },
  step(dt){
    this.t += dt;
    const vf = [0,0,0];
    for(const q of this.p){
      // 流れ場で漂わせつつ、目標へ減衰バネ（＝棒にならない）
      // 年が変わる間隔は約0.53秒。その中で形になる硬さが要る
      curl3(q.x, q.y, 0, this.t, vf);
      q.vx += (vf[0]*150 + (q.tx-q.x)*46) * dt;
      q.vy += (vf[1]*150 + (q.ty-q.y)*46) * dt;
      const d = Math.pow(0.0009, dt);
      q.vx *= d; q.vy *= d;
      q.x += q.vx*dt; q.y += q.vy*dt;
    }
  },
  draw(a, g, k){
    g = g || ctx; k = k || 1;
    g.save();
    if(k !== 1) g.scale(k, k);
    const stepN = Quality.low ? 2 : 1, rk = Quality.low ? 1.35 : 1;
    for(let i=0;i<this.p.length;i+=stepN){
      const q = this.p[i];
      const near = 1 - Math.min(1, Math.hypot(q.tx-q.x, q.ty-q.y)/90);   // 定位置ほど明るい
      const al = a * (0.34 + 0.66*near) * (0.55 + 0.45*q.edge);          // 縁ほど明るい
      const r = (1.1 + 1.9*q.s) * (0.6 + 0.7*near) * rk;
      Batch.dot(q.edge > 0.55 ? C.ink : C.teal, al, q.x, q.y, r);
    }
    Batch.flush(g);
    g.restore(); g.globalAlpha = 1;
  }
};

function yearIndexAt(sec){
  let idx = 0;
  for(let i=0;i<CRASH_YEAR_AT.length;i++) if(sec >= CRASH_YEAR_AT[i]) idx = i;
  return idx;
}
function drawYears(p){
  ctx.fillStyle = C.void; ctx.fillRect(0,0,W,H);
  const sec = p * CRASH_T.years;
  const idx = yearIndexAt(sec);
  const year = String(CRASH_YEAR_FROM - idx);
  const nextAt = CRASH_YEAR_AT[idx+1] != null ? CRASH_YEAR_AT[idx+1] : CRASH_T.years;
  const sub = Math.min(1, (sec - CRASH_YEAR_AT[idx]) / Math.max(0.2, nextAt - CRASH_YEAR_AT[idx]));

  if(YearFX.year !== year){ YearFX.year = year; YearFX.retarget(year); }

  // 年が切り替わった直後は形が崩れているので、そこが一番明るい
  const ya = 0.55 + 0.45*(1-sub);
  // 残像＋ブルームに乗せる。粒が次の年へ流れる軌跡が尾を引く
  FX.extra = (g,k)=>YearFX.draw(ya, g, k);
  FX.render(); FX.composite();
  FX.extra = null;
  YearFX.draw(ya);

  // 下から上へ流れる線（薄く残す）
  ctx.globalAlpha = .10; ctx.fillStyle = C.teal;
  for(let i=0;i<9;i++){
    const y = H - ((G.crash.t*760 + i*140) % (H+220));
    ctx.fillRect(0, y, W, 2);
  }
  ctx.globalAlpha = 1;
}

function startCrash(){
  if(G.act === 'crash') return;
  FX.fade = 0.22;                             // 残像の濃さを既定へ戻す（前の回の設定を引きずらない）
  G.act = 'crash';
  React.cut();                  // 言いかけを切る。壊れる演出は待たない（坂田 2026-09-21「しょうがない」）
  G.crash = { t:0, phase:'glitch', revived:0, held:false, oldStarted:false, sysBeep:false, lastYear:-1,
              said0:false, said1:false };
  YearFX.p.length = 0; YearFX.year = null; YearFX.t = 0;   // 年号の粒をまっさらに
  RoarFX.reset(); if(!RoarFX.pts) RoarFX.prepare();
  RoarVideo.load(); RoarVideo.stop();
  Cue.stop();
  Music.stop(); Audio_.floorOff(0.6); Audio_.motif(1.0); Audio_.duckBefore(0.22, 0.5, 0.6); Audio_.crashDown();
  G.fx.shake = 1; G.comboTier = 0; Music.tier = 0;
}

/* 各フェーズの開始時刻（累積） */
function crashMarks(){
  const T = CRASH_T, c = G.crash;
  const deskLen = c.held ? (c.heldAt - T.glitch) : T.desktop;
  const m = {};
  m.glitch   = 0;
  m.desktop  = T.glitch;
  m.oldtrack = m.desktop + deskLen;
  m.syserr   = m.oldtrack + T.oldtrack;
  m.years    = m.syserr + T.syserr;
  m.rewind   = m.years + T.years;
  m.implode  = m.rewind + T.rewind;
  m.roar     = m.implode + T.implode;
  m.hold     = m.roar + T.roar;
  m.fade     = m.hold + T.hold;
  m.end      = m.fade + T.fade;
  return m;
}

function updateCrash(dt){
  const c = G.crash, T = CRASH_T; c.t += dt;
  /* SYSTEM ERROR 以降は音の時計に従う。絵が遅れても音が先に進んでいれば追いつく */
  if(c.cueAt != null){
    const e = Cue.elapsed();
    if(e != null) c.t = Math.max(c.t - dt, c.cueAt + e);
  }
  const t = c.t, m = crashMarks();

  /* ★フリッキーのひとこと（坂田 2026-09-21）。デスクトップが出た所で1本、
     間を置いてもう1本。SYSTEM ERROR から先は声なし＝音のキューだけで持たせる */
  if(t >= m.desktop && !c.said0){ c.said0 = true; React.say('c_crash', 3); }
  if(t >= m.desktop + 4.2 && !c.said1){ c.said1 = true; React.say('c_crash', 3); }

  if      (t < m.desktop)  c.phase = 'glitch';
  else if (t < m.oldtrack) c.phase = 'desktop';
  else if (t < m.syserr)   c.phase = 'oldtrack';
  else if (t < m.years)    c.phase = 'syserr';
  else if (t < m.rewind)   c.phase = 'years';
  else if (t < m.implode)  c.phase = 'rewind';
  else if (t < m.roar)     c.phase = 'implode';
  else if (t < m.hold)     c.phase = 'roar';
  else if (t < m.fade)     c.phase = 'hold';
  else                     c.phase = 'fade';

  // デスクトップは最大尺で自動的に切り上げる（オペが N を押し忘れても止まらない）
  if(c.phase === 'desktop' && !c.held && (t - T.glitch) >= T.desktopMax){
    c.held = true; c.heldAt = t;
  }

  if(c.phase === 'glitch') G.fx.shake = Math.max(G.fx.shake, .25 + .35*Math.random());

  // デスクトップ＝完全な無音にしない。空調のような低いノイズだけ残す
  if(c.phase === 'desktop') Audio_.roomToneOn();
  else if(c.phase !== 'glitch') Audio_.roomToneOff();

  // 旧音源が鳴り出す（画面は死んだまま。ここが一番効く）
  if(c.phase === 'oldtrack' && !c.oldStarted){ c.oldStarted = true; OldTrack.play(); }

  if(c.phase === 'syserr' && !c.sysBeep){
    c.sysBeep = true;
    OldTrack.tapeStop(0.9);
    if(Cue.start()){ c.cueAt = m.syserr; c.useCue = true; }
    else Samples.play('sys_fail',{send:.40});     // キューが使えない時だけ単発で。合成音は鳴らさない
  }

  if(c.phase === 'years'){
    const sec = t - m.years, idx = yearIndexAt(sec);
    const y = CRASH_YEAR_FROM - idx;
    if(y !== c.lastYear){
      c.lastYear = y;
      const last = (y === CRASH_YEAR_TO);
      if(!c.useCue){
        const nextIn = CRASH_YEAR_AT[idx+1] != null ? CRASH_YEAR_AT[idx+1] - CRASH_YEAR_AT[idx] : 0;
        Audio_.yearTick(idx, nextIn);
      }
      /* ヒットストップは使わない：音の時計と絵がずれる。揺れと明滅だけで打つ */
      CAM.shake = Math.max(CAM.shake, last ? 1.0 : .35 + idx*.08);
      if(last) G.fx.flash = Math.max(G.fx.flash, .22);
    }
    if(YearFX.year !== String(y)){ YearFX.year = String(y); YearFX.retarget(String(y)); }
    YearFX.step(dt);
  }

  if(c.phase === 'rewind'){
    const prog = Math.min(1, (t - m.rewind) / T.rewind);
    /* ★巻き戻しの入口に逆リバーブを1発置く。
       調べた結論：逆再生を「逆だ」と伝えているのは絵ではなく音（TENET / Doctor Strange）。
       ここで時間が吸い込まれる音を先に鳴らしておくと、以降の復活が全部その中で起きる */
    if(!c.swelled){ c.swelled = true; if(!c.useCue) Audio_.rewindSweep(); }
    // 粒子→文字。星雲から HARIBOW の形へ、減衰バネで着地する
    if(!c.seeded){
      c.seeded = true;
      Particles.seedAssemble(G.bricks, 26);  // 各ブロックへ26粒。細かい粒が集まって字になる（2026-09-20）
    }
    Particles.gather = prog*prog*(3-2*prog);   // smoothstep
    const want = Math.floor(G.killCount * (1 - prog));
    let n = 0;
    for(const b of G.bricks){
      if(b.dead && b.killOrder !== undefined && b.killOrder >= want){ b.dead = false; b.hp = b.max; b.hit = .22; }
      if(!b.dead) n++;
    }
    if(n > c.revived){
      const lastB = G.bricks.find(b=>!b.dead && b.killOrder !== undefined && b.killOrder >= want);
      if(!c.useCue) Audio_.rewindTick(n, lastB ? lastB.x + lastB.w/2 : W/2);
      c.revived = n;
    }
  }
  /* 吸い込み → 無音 → ROAR。ロゴはここで粒に戻り、二度と HARIBOW には戻らない */
  if(c.phase === 'implode' || c.phase === 'roar' || c.phase === 'hold' || c.phase === 'fade'){
    if(!c.roarSeeded){
      c.roarSeeded = true;
      FX.fade = 0.07;                         // ここだけ残像を長く残す（坂田指示 2026-09-20）
      for(const b of G.bricks){ b.dead = false; b.hp = b.max; }
      RoarFX.seedFromBricks(G.bricks);
      Particles.init();
    }
    if(c.phase === 'roar' && !c.roarHit){
      c.roarHit = true;
      c.roarVid = RoarVideo.play();          // 映像が使えない時だけ粒子で描く
      RoarFX.explode();
      CAM.shake = 1.0; G.fx.flash = Math.max(G.fx.flash, .75);
      if(!c.useCue) Samples.play('crash', {send:.45});   // 合成音は使わない（キューが読めない時も実素材だけ）
    }
    /* 粒の計算はフレームに1回でいい。更新は1/240秒刻みで4回走るので、ここでは溜めるだけ
       （3万粒×4回＝1フレーム8msの無駄になっていた 2026-09-20） */
    c.roarAcc = (c.roarAcc || 0) + dt;
  }
}

/* ══ ROAR ══════════════════════════════════════════════════════
   巻き戻しで戻った HARIBOW が一点に吸い込まれ、無音のあと爆ぜて ROAR になる。
   粒は年号と同じ描き方（縁ほど明るい・残像とブルームに乗る）で、世界を揃える。
   ・吸い込み … 渦を巻きながら中心へ（接線速度＋加速するバネ）
   ・無音     … 光の点が1つだけ残る
   ・一撃     … 放射状に爆ぜ、減衰バネで字形へ着地する
   ══════════════════════════════════════════════════════════════ */
/* HARIBOW のロゴが粒になり、渦を巻いて一点に吸い込まれる所。
   坂田指示（2026-09-20）：**粒を細かく・数を増やし・残像を長く**。
   1粒ずつオブジェクトで持つと数万粒で重いので、型付き配列にして WebGL へ直接積む。
   数：48,000（タイトルカード生成器（Taichi）の細かさに寄せた） */
const RoarFX = {
  N: 36000, n: 0, pts:null, t:0, cx:W/2, cy:H/2 - 10,
  X:null, Y:null, VX:null, VY:null, TX:null, TY:null, S:null, E:null, CR:null, CG:null, CB:null,
  _alloc(){
    if(this.X && this.X.length === this.N) return;
    const N = this.N;
    for(const k of ['X','Y','VX','VY','TX','TY','S','E','CR','CG','CB']) this[k] = new Float32Array(N);
  },
  reset(){ this.n = 0; this.t = 0; },
  /* 760px の字を1pxで取ると37万点・2.8秒かかり、CRASH の頭で画が固まった。3px刻みで十分 */
  prepare(){ this.pts = GlyphPts.get(CRASH_FINAL_WORD, 760, 3); },
  _rgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
  },
  seedFromBricks(bricks){
    if(!this.pts) this.prepare();
    this._alloc();
    const live = bricks.filter(b => !b.dead);
    const src = live.length ? live : bricks;
    const pal = C.brick.map(c=>this._rgb(c)); const solid = this._rgb(C.solid);
    const pts = this.pts, N = this.N;
    for(let i=0;i<N;i++){
      const b = src[(Math.random()*src.length)|0];
      const q = pts[(i * 7919) % pts.length];
      const col = b.solid ? solid : pal[Math.min(3, b.max-1)];
      this.X[i] = b.x + Math.random()*b.w; this.Y[i] = b.y + Math.random()*b.h;
      this.VX[i] = 0; this.VY[i] = 0;
      this.TX[i] = this.cx + q.x; this.TY[i] = this.cy + q.y;
      this.S[i] = Math.random(); this.E[i] = q.edge;
      this.CR[i] = col[0]; this.CG[i] = col[1]; this.CB[i] = col[2];
    }
    this.n = N;
  },
  explode(){
    for(let i=0;i<this.n;i++){
      const a = Math.random()*6.283, sp = 900 + Math.random()*2600;
      this.X[i] = this.cx + (Math.random()-.5)*6; this.Y[i] = this.cy + (Math.random()-.5)*6;
      this.VX[i] = Math.cos(a)*sp; this.VY[i] = Math.sin(a)*sp*0.72;
    }
    FX.rings.push({ x:0, y:fwy(this.cy), z:PLANE_Z, r:10, v:2600, life:0.9, max:0.9, col:C.ink });
    FX.rings.push({ x:0, y:fwy(this.cy), z:PLANE_Z, r:4, v:1500, life:1.2, max:1.2, col:C.terracotta });
  },
  /* ph: フェーズ名 / e: implode の頭からの秒 */
  step(dt, ph, e){
    this.t += dt;
    const n = this.n; if(!n) return;
    const X=this.X, Y=this.Y, VX=this.VX, VY=this.VY, cx=this.cx, cy=this.cy;
    if(ph === 'implode'){
      const k = Math.min(1, e / CRASH_IMPLODE_SUCK);
      if(k >= 1){ for(let i=0;i<n;i++){ X[i]=cx; Y[i]=cy; VX[i]=0; VY[i]=0; } return; }
      const pull = 6 + 220*k*k*k;                   // 加速していく吸引
      const swirl = 1400*(1-k), damp = Math.pow(0.02, dt), snap = Math.min(1, dt*18);
      const tw = this.t*0.7;
      for(let i=0;i<n;i++){
        const dx = cx - X[i], dy = cy - Y[i];
        const d = Math.sqrt(dx*dx + dy*dy) + 1;
        /* 粒ごとに渦の強さを散らす＝一枚の板でなく、層になって巻き込まれる */
        const sw = swirl * (0.55 + 0.9*this.S[i]);
        VX[i] += (dx*pull + (-dy/d)*sw + Math.sin(tw + this.S[i]*31.4)*40) * dt;
        VY[i] += (dy*pull + ( dx/d)*sw + Math.cos(tw + this.S[i]*17.7)*40) * dt;
        VX[i] *= damp; VY[i] *= damp;
        X[i] += VX[i]*dt; Y[i] += VY[i]*dt;
        if(k > 0.85){ X[i] += (cx - X[i])*snap; Y[i] += (cy - Y[i])*snap; }
      }
      return;
    }
    // roar / hold / fade：字形へ着地し、着地後も流れ場でわずかに息をする（映像が使えない時の代替）
    const since = e - CRASH_T.implode;
    const k = Math.min(1, Math.max(0, (since - 0.06) / 0.30));
    const spring = 90 * k*k, damp = Math.exp(-17 * dt), flow = 220 - 180*k;
    const TX=this.TX, TY=this.TY, vf=[0,0,0];
    for(let i=0;i<n;i++){
      curl3(X[i], Y[i], 0, this.t, vf);
      VX[i] += (vf[0]*flow + (TX[i] - X[i])*spring) * dt;
      VY[i] += (vf[1]*flow + (TY[i] - Y[i])*spring) * dt;
      VX[i] *= damp; VY[i] *= damp;
      X[i] += VX[i]*dt; Y[i] += VY[i]*dt;
    }
  },
  /* stride … 何粒に1つ描くか。残像レイヤー（半分の解像度）は間引いて軽くする */
  draw(a, g, sc, ph, stride){
    const n = this.n; if(!n) return;
    g = g || ctx; sc = sc || 1; stride = stride || 1;
    const landed = ph === 'roar' || ph === 'hold' || ph === 'fade';
    if(GLPoints.ok){
      GLPoints.ensure((n/stride|0) + 8);
      const X=this.X, Y=this.Y, VX=this.VX, VY=this.VY, TX=this.TX, TY=this.TY, S=this.S, E=this.E;
      const ink = this._rgb(C.ink), ter = this._rgb(C.terracotta), warm = this._rgb('#e0a07a');
      for(let i=0;i<n;i+=stride){
        let r, gg, b, al, size;
        if(landed){
          const dx = TX[i]-X[i], dy = TY[i]-Y[i];
          const near = 1 - Math.min(1, Math.sqrt(dx*dx+dy*dy)/120);
          al = a * (0.16 + 0.34*near) * (0.50 + 0.50*E[i]) * stride;
          const c = E[i] > 0.5 ? ink : (S[i] < 0.55 ? ter : warm);
          r=c[0]; gg=c[1]; b=c[2];
          size = (0.9 + 1.3*S[i]) * (0.6 + 0.7*near);
        } else {
          /* 速い粒ほど明るい＝渦が見える。細かく・小さく */
          const sp = Math.sqrt(VX[i]*VX[i] + VY[i]*VY[i]);
          const hot = Math.min(1, sp / 1400);
          /* 粒が多いので1粒は薄く。重なって白い塊にならない濃さ（実測で決めた） */
          al = a * (0.20 + 0.30*hot) * (0.55 + 0.45*S[i]) * stride;
          r = this.CR[i]*(1-hot) + ink[0]*hot;
          gg = this.CG[i]*(1-hot) + ink[1]*hot;
          b = this.CB[i]*(1-hot) + ink[2]*hot;
          size = (0.7 + 1.0*S[i]) * (1 + 0.4*hot);
        }
        if(al < 0.01) continue;
        GLPoints.raw(X[i], Y[i], size, r, gg, b, Math.min(1, al));
      }
      GLPoints.flush(g);
      return;
    }
    // WebGL が使えない環境：数を間引いて 2D で描く
    g.save(); if(sc !== 1) g.scale(sc, sc);
    const stepN = Math.max(1, (n/4000)|0);
    for(let i=0;i<n;i+=stepN){
      const near = landed ? 1 - Math.min(1, Math.hypot(this.TX[i]-this.X[i], this.TY[i]-this.Y[i])/120) : 1;
      Batch.dot(landed ? (this.E[i] > 0.5 ? C.ink : C.terracotta) : C.ink,
                a * (landed ? (0.3+0.7*near) : 0.5), this.X[i], this.Y[i], 1.6);
    }
    Batch.flush(g); g.restore();
  }
};

function drawRoar(){
  const c = G.crash, t = c.t, m = crashMarks();
  if(c.roarAcc > 0){ RoarFX.step(Math.min(c.roarAcc, 0.05), c.phase, t - m.implode); c.roarAcc = 0; }
  ctx.fillStyle = C.void; ctx.fillRect(0,0,W,H);
  const e = t - m.implode, ph = c.phase;
  if(ph === 'implode' && e >= CRASH_IMPLODE_SUCK){
    /* 無音。光の点が1つだけ残る */
    FX.render(); FX.composite();
    const k = Math.min(1, (e - CRASH_IMPLODE_SUCK) / (CRASH_T.implode - CRASH_IMPLODE_SUCK));
    const r = 5 + 3*Math.sin(k*3.14);
    const g = ctx.createRadialGradient(RoarFX.cx, RoarFX.cy, 0, RoarFX.cx, RoarFX.cy, r*9);
    g.addColorStop(0, 'rgba(240,236,224,.95)'); g.addColorStop(0.18, 'rgba(240,236,224,.45)');
    g.addColorStop(1, 'rgba(200,67,58,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(RoarFX.cx, RoarFX.cy, r*9, 0, 7); ctx.fill();
    return;
  }
  // 着地後はゆっくり息をする（拍を刻まない。紗幕フライの間に視線を奪いすぎない）
  let a = 1;
  if(ph === 'hold') a = 0.88 + 0.12*Math.sin((t - m.hold)*2.2);
  if(c.roarVid && RoarVideo.started){
    /* 爆ぜた粒は0.5秒で引かせ、その下からタイトルカードが立ち上がる */
    const since = t - m.roar;
    const pa = Math.max(0, 1 - since/0.5);
    if(pa > 0.02){
      FX.extra = (g,k)=>RoarFX.draw(pa*0.9, g, k, 'implode', 3);
      FX.render(); FX.composite();
      FX.extra = null;
      RoarFX.draw(pa, ctx, 1, 'implode');
    }
    if(!RoarVideo.draw(a)){ c.roarVid = false; }     // 途中で描けなくなったら粒子へ戻す
  } else {
    FX.extra = (g,k)=>RoarFX.draw(a*0.9, g, k, ph, 3);
    FX.render(); FX.composite();
    FX.extra = null;
    RoarFX.draw(a, ctx, 1, ph);
  }
  if(ph === 'fade'){
    ctx.fillStyle = `rgba(7,8,10,${Math.min(1,(t - m.fade)/CRASH_T.fade)})`; ctx.fillRect(0,0,W,H);
  }
}

function drawCrash(){
  const c = G.crash, t = c.t, m = crashMarks();

  if(c.phase === 'glitch'){
    const bands = 11;
    for(let i=0;i<bands;i++){
      if(Math.random() > .55) continue;
      const y = Math.random()*H, h = 10 + Math.random()*70;
      const dx = (Math.random()-.5) * 220 * (0.3 + t/2.6);
      try{ ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }catch(e){}
    }
    ctx.globalAlpha = .10 + .18*Math.random();
    ctx.fillStyle = C.terracotta; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
    return;
  }

  if(c.phase === 'desktop' || c.phase === 'oldtrack'){ drawDesktop(0); return; }
  if(c.phase === 'syserr'){ drawSysErr((t - m.syserr) / CRASH_T.syserr); return; }
  if(c.phase === 'years'){ drawYears((t - m.years) / CRASH_T.years); return; }
  if(c.phase === 'implode' || c.phase === 'roar' || c.phase === 'hold' || c.phase === 'fade'){ drawRoar(); return; }

  if(c.phase === 'rewind'){
    const prog = Math.min(1, (t - m.rewind) / CRASH_T.rewind);
    ctx.fillStyle = C.void; ctx.fillRect(0,0,W,H);
    Particles.drawBehind();
    ctx.globalAlpha = 0.20 + 0.80*prog;   // ブロックは粒子が集まるほど実体化する
    drawBricks();
    ctx.globalAlpha = 1;
    Particles.drawFront();
    ctx.globalAlpha = .16; ctx.fillStyle = C.teal;
    for(let i=0;i<7;i++){
      const y = H - ((t*520 + i*180) % (H+200));
      ctx.fillRect(0, y, W, 3);
    }
    ctx.globalAlpha = 1;
    FX.render(); FX.composite();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`500 19px ${FM}`; ctx.fillStyle=C.faint; ctx.letterSpacing='0.42em';
    ctx.globalAlpha = .30 + .30*Math.sin(t*7);
    ctx.fillText('\u25c0\u25c0', W/2, H-90);
    ctx.globalAlpha = 1; ctx.letterSpacing='0px';
    return;
  }

  ctx.fillStyle = C.void; ctx.fillRect(0,0,W,H);
  Particles.drawBehind();
  drawBricks();
  Particles.drawFront();
  if(c.phase === 'fade'){
    ctx.fillStyle = `rgba(7,8,10,${Math.min(1,(t - m.fade)/CRASH_T.fade)})`; ctx.fillRect(0,0,W,H);
  }
}

/* 導入の絵。① の間は真っ黒（フリッキーだけ）。② でゲーム画面を出し、台詞の focus を光らせる */
function drawIntro(){
  ctx.fillStyle = C.void; ctx.fillRect(0,0,W,H);
  const ph = Intro.phase;
  if(ph === 'blank') return;        // ★真っ黒。何も出さない（上で黒く塗ってある）
  if(ph === 'standby'){
    /* ★準備の進み具合はここにも出す（2026-09-21）。
       op.html を見ていなくても、本体の画だけで「押していいか」が分かる。
       本番モードでも出す（紗幕には出るが、**N を押す前なので客席はまだ見ていない**。
       押した瞬間に消えるので事故にならない）。 */
    const bp = Boot.pct(), bready = Boot.ready();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(!bready){
      const bw = 520, bx = W/2 - bw/2, by = H/2 + 54;
      ctx.font=`500 20px ${FM}`; ctx.fillStyle=C.dim; ctx.letterSpacing='0.16em';
      ctx.fillText('読み込み中  ' + bp + '%   (' + Boot.have() + ' / ' + Boot.need() + ')', W/2, H/2 + 14);
      ctx.letterSpacing='0px';
      ctx.globalAlpha = .25; ctx.fillStyle = C.faint; ctx.fillRect(bx, by, bw, 6);
      ctx.globalAlpha = 1;  ctx.fillStyle = C.teal;  ctx.fillRect(bx, by, bw * bp/100, 6);
    } else {
      ctx.font=`600 22px ${FM}`; ctx.fillStyle=C.teal; ctx.letterSpacing='0.18em';
      ctx.fillText('準備OK  —  N でGO', W/2, H/2 + 14); ctx.letterSpacing='0px';
      const miss = Boot.missing();
      if(miss.length){
        ctx.font=`400 16px ${FM}`; ctx.fillStyle=C.terracotta;
        ctx.fillText('（' + miss.join('・') + ' が読めていません）', W/2, H/2 + 52);
      }
    }
    if(TRY){
      /* 受け取った人にはオペの知識が無い。**押す物を1つだけ**書く */
      ctx.font=`600 30px "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif`;
      ctx.fillStyle=C.teal;
      ctx.fillText('\u30b9\u30da\u30fc\u30b9\u30ad\u30fc\u3067\u306f\u3058\u3081\u308b', W/2, H/2 - 70);
      ctx.font=`500 21px ${FM}`; ctx.fillStyle=C.dim; ctx.letterSpacing='0.14em';
      ctx.fillText('\u2190 \u2192 \u3067\u52d5\u304b\u3059 \uff0f \u30b9\u30da\u30fc\u30b9\u3067\u6253\u3064\u30fb\u9032\u3080', W/2, H/2 - 28);
      ctx.letterSpacing='0px';
    } else if(!SHOW){
      ctx.font=`500 22px ${FM}`; ctx.fillStyle=C.dim; ctx.letterSpacing='0.2em';
      ctx.fillText('N … フリッキーの導入   /   SPACE … 飛ばしてタイトルへ', W/2, H/2 - 40);
      ctx.letterSpacing='0px';
    }
    return;
  }
  if(ph === 'afw') return;

  const reveal = Math.min(1, Intro.revealT / 1.2);
  const f = Intro.focus;
  ctx.save();
  drawFieldFrame(); drawCore(); drawLinks(); drawBricks(); drawGuards(); drawPaddle(); drawHUD();
  ctx.restore(); ctx.globalAlpha = 1;
  // 全体を落とす（最後の「いきます」で全部明るくなる）
  const lit = f === 'all' ? Math.min(1, Intro.focusT/0.6) : 0;
  const dimA = 1 - reveal*(1 - 0.66*(1-lit));
  if(dimA > 0.003){ ctx.fillStyle = `rgba(7,8,10,${dimA})`; ctx.fillRect(0,0,W,H); }

  const k = Math.min(1, Intro.focusT/0.35);          // 光り始め
  const pulse = 0.5 + 0.5*Math.sin(G.elapsed*4.2);
  ctx.save(); ctx.globalAlpha = k;
  if(f === 'logo'){
    drawBricks();
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const b of G.bricks){ if(b.dead) continue; x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.w); y1=Math.max(y1,b.y+b.h); }
    ctx.globalAlpha = k*(0.35+0.4*pulse); ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.strokeRect(x0-22, y0-22, x1-x0+44, y1-y0+44);
  }
  if(f === 'aim'){
    drawCore(); drawPaddle();
    // 実演の球：パドル → コア → パドル（2.2秒で1往復）
    const u = (Intro.focusT % 2.2) / 2.2, up = u < 0.5, v = up ? u*2 : (1-u)*2;
    const e = v*v*(3-2*v);
    const px = G.paddle.x, py = PADDLE_Y - 16, cx = CORE_X + 60, cy = CORE_Y + 70;
    const bx = px + (cx-px)*e, by = py + (cy-py)*e;
    ctx.globalCompositeOperation = 'lighter';
    for(let i=6;i>=0;i--){
      const vv = Math.max(0, v - (up?1:-1)*i*0.025), ee = vv*vv*(3-2*vv);
      ctx.globalAlpha = k*(1 - i/7)*0.6; ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(px+(cx-px)*ee, py+(cy-py)*ee, BALL_R*(1-i*0.08), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = k; ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(bx, by, BALL_R, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = k*(0.3+0.4*pulse); ctx.strokeStyle = C.terracotta; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CORE_X, CORE_Y, 96 + 10*pulse, 0, 7); ctx.stroke();
  }
  if(f === 'guard'){
    drawCore(); drawGuards();
    ctx.globalAlpha = k*(0.25+0.35*pulse); ctx.strokeStyle = C.teal; ctx.lineWidth = 2;
    ctx.setLineDash([10,12]); ctx.beginPath(); ctx.arc(CORE_X, CORE_Y, 150, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  if(f === 'clock'){
    drawHUD();
    ctx.globalAlpha = k*(0.35+0.4*pulse); ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.strokeRect(W/2-150, 10, 300, HUD_H-20);
  }
  ctx.restore(); ctx.globalAlpha = 1;

  drawIntroCaption(752);
}

/* 結果。CRASH には勝手に入らないので、ここでオペの合図を待つ。
   暗転させず、崩れた画をそのまま見せたままにする（客席の余韻を切らない） */
function drawResult(){
  const win = G.result === 'clear';
  const t = G.resultT;
  const a = Math.min(1, t/0.8);

  // 全面は伏せない。下半分だけ静かに落とす
  const g = ctx.createLinearGradient(0, H*0.42, 0, H);
  g.addColorStop(0, 'rgba(7,8,10,0)'); g.addColorStop(1, `rgba(7,8,10,${0.86*a})`);
  ctx.fillStyle = g; ctx.fillRect(0, H*0.42, W, H*0.58);

  ctx.textAlign='center'; ctx.textBaseline='middle';
  const y0 = H*0.63;

  // 見出しは少し遅れて、下から起き上がる
  const ta = Math.min(1, Math.max(0, (t-0.35)/0.7));
  ctx.save();
  ctx.globalAlpha = ta;
  ctx.translate(0, (1-ta)*26);
  ctx.font=`700 116px ${FD}`; ctx.letterSpacing='0.14em';
  ctx.fillStyle = win ? C.ink : C.terracotta;
  ctx.fillText(win ? 'CLEAR' : G.result === 'over' ? 'BALL OUT' : 'TIME UP', W/2, y0);
  ctx.letterSpacing='0px';
  ctx.restore();

  // 内訳
  const sa = Math.min(1, Math.max(0, (t-0.9)/0.7));
  if(sa > 0){
    ctx.globalAlpha = sa;
    ctx.font=`400 22px ${FM}`; ctx.fillStyle=C.dim; ctx.letterSpacing='0.18em';
    const c = G.core;
    const line = win
      ? `CORE ${c.need} / \u6b8b\u308a ${Math.floor(G.clock/60)}:${String(Math.floor(G.clock%60)).padStart(2,'0')}`
      : `CORE ${c.hits} / ${c.need}   \u3042\u3068 ${Math.max(0, c.need - c.hits)} \u56de`;
    ctx.fillText(line, W/2, y0 + 78);
    /* ★落球で時間が減る仕組みは廃止（2026-09-21）。残機0で終わる */
    ctx.font=`300 44px ${FM}`; ctx.fillStyle=C.ink; ctx.letterSpacing='0.06em';
    ctx.fillText(String(G.score).padStart(6,'0'), W/2, y0 + 168);
    ctx.letterSpacing='0px'; ctx.globalAlpha = 1;
  }

  // オペ待ち。客席には見えなくていいので小さく下に置く
  const oa = Math.min(1, Math.max(0, (t-1.8)/0.8));
  if(oa > 0 && G.opHud){
    ctx.globalAlpha = oa * (0.4 + 0.3*Math.abs(Math.sin(t*2.2)));
    ctx.font=`500 15px ${FM}`; ctx.fillStyle=C.faint; ctx.letterSpacing='0.30em';
    ctx.fillText('N \u3067\u6b21\u3078   /   R \u3067\u3084\u308a\u76f4\u3057', W/2, H - 52);
    ctx.letterSpacing='0px'; ctx.globalAlpha = 1;
  }
}

/* バーが砕ける。通した時は左右へ払われ、当たった時は穴の位置で爆ぜる。
   BREAK のブロックと同じ粒子系に乗せるので、質感が揃う */
function gateShatter(b, kind){
  const y = b.y, col = kind==='hit' ? C.terracotta : (BAR_TYPES[b.type] ? BAR_TYPES[b.type].col : C.teal);
  const gwH = GATE_LW*(b.gw!=null?b.gw:1)/2;
  const holes = [[b.drawX-gwH, b.drawX+gwH]];
  if(b.lane2 != null){ const h2=laneX(b.lane2); holes.push([h2-gwH, h2+gwH]); }
  if(kind === 'hit'){
    // 穴の中心で爆ぜる＝当たった場所が分かる
    for(const [a0,a1] of holes){
      const cx=(a0+a1)/2;
      for(let i=0;i<70 && Particles.p.length<PF.MAX;i++){
        const ang=Math.random()*6.283, el=(Math.random()-.5)*1.5, sp=180+Math.random()*520;
        Particles.p.push({ x:fwx(cx), y:fwy(y), z:PLANE_Z+(Math.random()-.5)*90,
          vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp*0.7, vz:el*180,
          px:fwx(cx), py:fwy(y), pz:PLANE_Z, tx:null,ty:null,tz:null,
          life:0.5+Math.random()*0.5, max:1.0, sz:2.0+Math.random()*3.0,
          col:i%3?col:C.ink, s:Math.random() });
      }
    }
  } else {
    // 板が左右へ払われる＝割って抜けた
    let cur = WALL;
    const segs=[]; for(const [a0,a1] of holes){ segs.push([cur,a0]); cur=a1; } segs.push([cur, W-WALL]);
    for(const [xa,xb] of segs){
      if(xb-xa<=0) continue;
      const dir = ((xa+xb)/2 < W/2) ? -1 : 1;
      const n = Math.min(46, Math.round((xb-xa)/34));
      for(let i=0;i<n && Particles.p.length<PF.MAX;i++){
        const px = xa + (xb-xa)*Math.random();
        Particles.p.push({ x:fwx(px), y:fwy(y+(Math.random()-.5)*GATE_BAR_H),
          z:PLANE_Z+(Math.random()-.5)*GATE_BAR_D,
          vx:dir*(140+Math.random()*420), vy:(Math.random()-.5)*160, vz:(Math.random()-.5)*140,
          px:fwx(px), py:fwy(y), pz:PLANE_Z, tx:null,ty:null,tz:null,
          life:0.4+Math.random()*0.5, max:0.9, sz:1.6+Math.random()*2.6,
          col:i%4?col:C.ink, s:Math.random() });
      }
    }
  }
}

/* GATEの説明。文字を読ませるのではなく、動く図で分からせる。
   1,200人が2秒で理解できないと、この後ずっと置いていかれる */
function drawGateIntro(p){
  ctx.save();
  const fade = p < 0.92 ? 1 : (1 - (p-0.92)/0.08);
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(7,8,10,.97)'; ctx.fillRect(0,0,W,H);

  const cx = W/2, midY = 470;
  // 図：バーが落ちてきて、人が光の中へ歩く
  const t = Math.min(1, p/0.62);
  const barY = 180 + t*(midY-180);
  const holeX = cx + 150;
  const manX  = cx - 150 + Math.min(1, Math.max(0,(t-0.35)/0.5)) * 300;

  // 光の柱
  const lg = ctx.createLinearGradient(0, barY, 0, midY+180);
  lg.addColorStop(0, rgba(C.teal,.26)); lg.addColorStop(1, rgba(C.teal,.03));
  ctx.fillStyle = lg; ctx.fillRect(holeX-70, barY, 140, midY+180-barY);
  // バー
  ctx.fillStyle = C.teal;
  ctx.fillRect(cx-460, barY-24, (holeX-70)-(cx-460), 48);
  ctx.fillRect(holeX+70, barY-24, (cx+460)-(holeX+70), 48);
  // 床
  ctx.strokeStyle='rgba(240,236,224,.30)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cx-460, midY+180); ctx.lineTo(cx+460, midY+180); ctx.stroke();
  // 人
  ctx.fillStyle = 'rgba(240,236,224,.80)';
  ctx.beginPath(); ctx.arc(manX, midY+112, 17, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(manX-19, midY+180); ctx.lineTo(manX-9, midY+134);
  ctx.lineTo(manX+9, midY+134); ctx.lineTo(manX+19, midY+180); ctx.closePath(); ctx.fill();

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`700 84px ${FD}`; ctx.fillStyle=C.ink; ctx.letterSpacing='0.18em';
  ctx.fillText('GATE', cx, 120); ctx.letterSpacing='0px';

  const lines = [
    ['\u5ba2\u5e2d\u306e\u4e00\u4eba\u304c\u3001\u58c1\u3092\u843d\u3068\u3059\u3002', 0.10],
    ['\u6f14\u8005\u306f\u3001\u7a74\u306e\u5149\u306e\u4e2d\u306b\u5165\u308c\u3070\u907f\u3051\u3089\u308c\u308b\u3002', 0.34],
    ['\u7a74\u306f\u843d\u3061\u306a\u304c\u3089\u52d5\u304f\u3002\u9014\u4e2d\u3067\u56fa\u307e\u308b\u3002', 0.58],
    // ★勝ち負けの条件を最初に言う（2026-09-20）。目的が無いと客席は何を見ていいか分からない
    ['\u5f53\u3066\u305f\u3089\u3042\u306a\u305f\u306b1\u70b9\u3001\u907f\u3051\u3089\u308c\u305f\u3089 HARIBOW \u306b1\u70b9\u3002', 0.74],
    ['\u5148\u306b ' + GATE_MATCH + ' \u70b9\u3002', 0.88],
  ];
  lines.forEach(function(L, i){
    const a = Math.min(1, Math.max(0, (p - L[1])/0.12));
    if(a <= 0) return;
    const last = (i === lines.length-1);      // ★「先に7点。」だけ大きく明るく＝これが目的だと分かる
    ctx.globalAlpha = fade * a;
    ctx.font = last ? `700 44px ${FD}` : `500 30px ${FM}`;
    ctx.fillStyle = last ? C.ink : C.dim;
    if(last) ctx.letterSpacing='0.14em';
    ctx.fillText(L[0], cx, midY + 272 + i*48 + (last?10:0));
    ctx.letterSpacing='0px';
  });
  ctx.restore(); ctx.globalAlpha = 1;
}

/* op.html に渡す状態。表示用なので重い計算はしない */
function opStatus(){
  const st = { t:Date.now(), show:SHOW, act:G.act, mode:G.mode, state:G.state, opHud:G.opHud,
    fps: fpsBuf.length ? 1000/(fpsBuf.reduce((a,b)=>a+b,0)/fpsBuf.length) : 0,
    pad:{ seen:Input.padSeen, name:Input.padName, blocked:Input.padBlocked, connected:(()=>{
      try{ return [...navigator.getGamepads()].some(p=>p&&p.connected); }catch(e){ return false; } })() },
    audio:{ on:!!Audio_.on, ctx: Audio_.ctx ? Audio_.ctx.state : 'none',
            enabled:!!Samples.enabled, loaded:Samples.loaded, failed:Samples.failed, oldtrack:!!OldTrack.ok },
    drops: Drops.count(), dropWorst: Math.round(Drops.worst),
    wake: !!WakeLock_.lock, low: Quality.low, forced: Quality.forced, cap: Quality.cap,
    q: Quality.name(), qlv: Quality.level,
    /* ★GATE の難易度を数字で見せる（テクリハ用・2026-09-22）。
       「いま何レーンまで届くか」が 4.0 を下回ると、端に置かれた時点で演者は詰む */
    gateReach: (()=>{ try{
        const v = (G.gate ? G.gate.speed : GATE_V0);
        return +(((GATE_FALL/v) - GATE_REACT) * GATE_PERF_V / GATE_LW).toFixed(2);
      }catch(e){ return 0; } })(),
    gateV: (G.gate ? Math.round(G.gate.speed) : GATE_V0),
    gl: GLPoints.ok, focus: document.hasFocus(), fullscreen: !!document.fullscreenElement,
    errors: OpLink.errors, lastErr: OpLink.lastErr,
    clock: G.clock, result: G.result, score: G.score,
    intro: { phase: Intro.phase, t: Intro.lastT, dur: Intro.dur, line: Intro.line ? Intro.line.ja : null,
             model: Intro.model, voice: Object.keys(Intro.raw).length },
    boot: { ready: Boot.ready(), canGo: Boot.canGo(), pct: Boot.pct(),
            have: Boot.have(), need: Boot.need(),
            secs: +Boot.secs().toFixed(1), missing: Boot.missing() },
    react: { loaded: React.loaded(), total: React.count(), line: React.line(),
             result: ResultVoice.ready(), resultLine: (ResultVoice.line()||{}).ja || null },
    roarVideo: RoarVideo.ok };
  if(G.core) st.core = { hits:G.core.hits, need:G.core.need, needFixed:!!G.core.needFixed };
  if(G.gate){
    const g = G.gate;
    st.gate = { dropsLeft:g.dropsLeft, total:GATE_DROPS, cleared:g.cleared, hits:g.hits,
      you:g.you, them:g.them, match:GATE_MATCH, matchPoint:g.matchPoint, winner:g.winner,
      auto:g.auto, done:g.done,
      arm: g.bars.some(b => b.judging && !b.verdict), hit: g.bars.some(b => b.hit && !b.verdict),
      swapAt: GATE_SWAP_AT, swapLeft: Math.max(0, GATE_SWAP_AT - (g.you+g.them)), swapDone: SwapCall.done };
  }
  if(G.crash){
    const m = crashMarks(), t = G.crash.t;
    st.crash = { phase:G.crash.phase, t, held:!!G.crash.held,
      deskLeft: G.crash.phase === 'desktop' ? Math.max(0, CRASH_T.desktopMax - (t - CRASH_T.glitch)) : null,
      toFly: Math.max(0, m.hold - t), toEnd: Math.max(0, m.end - t) };
  }
  return st;
}

/* オペ用の1行。本番は O キーで消す */
function drawOpHud(){
  let crashLine = '3/3  CRASH';
  if(G.crash){
    const m = crashMarks(), t = G.crash.t, ph = G.crash.phase;
    crashLine += '   ' + ph.toUpperCase();
    if(ph === 'desktop') crashLine += '   \u2192  N \u2026 \u65e7\u97f3\u6e90\u3078\uff08\u62bc\u3055\u306a\u3051\u308c\u3070 ' + Math.max(0,(CRASH_T.desktopMax-(t-CRASH_T.glitch))).toFixed(0) + 's \u3067\u81ea\u52d5\uff09';
    else if(t < m.hold) crashLine += '   \u7d17\u5e55\u30d5\u30e9\u30a4\u307e\u3067 ' + (m.hold - t).toFixed(1) + 's';
    else if(t < m.fade) crashLine += '   \u2605\u7d17\u5e55\u30d5\u30e9\u30a4\u30a2\u30a6\u30c8';
  }
  const map = { intro:'0/3  INTRO  ' + Intro.phase.toUpperCase() + '   \u2192  N \u2026 \u6b21\u3078',
                break:'1/3  BREAK   \u2192  N \u2026 GATE\u3078',
                gate: '2/3  GATE    \u2192  N \u2026 CRASH\u3078',
                crash: crashLine };
  ctx.save();
  ctx.font=`500 16px ${FM}`; ctx.fillStyle=C.faint;
  ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.letterSpacing='0.14em';
  ctx.fillText('ACT ' + (map[G.act]||''), WALL, H-14);
  ctx.letterSpacing='0px'; ctx.restore();
}

function drawTitle(){

  ctx.strokeStyle=C.line; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(W/2-300,H/2-28); ctx.lineTo(W/2+300,H/2-28); ctx.stroke();

  ctx.font=`500 21px ${FM}`; ctx.fillStyle=C.teal; ctx.letterSpacing='0.34em';
  ctx.fillText(SHOW ? 'PRESS  \u2715' : 'CLICK OR PRESS ANY KEY', W/2, H/2+22);
  ctx.globalAlpha=1; ctx.letterSpacing='0px';
  if(SHOW) return;     // 本番：キー一覧・パッド状態は紗幕に出さない（op.html に出る）

  ctx.font=`400 18px ${FM}`; ctx.fillStyle=C.dim; ctx.letterSpacing='0.10em';
  [ 'GOAL \u2026 4:00 \u4ee5\u5185\u306b\u30b3\u30a2\u3092\u58ca\u305b',
    'MOVE / AIM     \u2190 \u2192   /   A D   /   LEFT STICK',
    'SERVE / DROP   SPACE   /   \u2715',
    'M  \u2026 SWITCH MODE   BREAK \u21c4 GATE',
    'X  \u2026 JUDGE : CONTACT      G \u2026 GHOST ON/OFF',
    'P PAUSE      F FULLSCREEN      I DIAGNOSTICS'
  ].forEach((t,i)=>ctx.fillText(t, W/2, H/2+104+i*30));

/* ══════════════════════════════════════════════════════════════
   8. ループ ─ 固定タイムステップ（描画と物理を分離＝遅延を一定に保つ）
   ══════════════════════════════════════════════════════════════ */
let acc = 0, prev = performance.now(), running = false;
let DRAW_SKIP = false;

/* ★落ちたコマを数える（2026-09-21）。
   「カクカクする」を数字にするための物差し。**JS が速くても画が飛ぶこと**はある
   （合成・vsync・他のアプリ）。ここは rAF の実間隔を見ているので、原因が何であれ拾える。
   op.html に「直近10秒で落ちたコマ」として出す。 */
const Drops = {
  hist:[], worst:0, worstAt:0,
  sample(now, raw){
    /* ★10Hz に落としている間は「100msごと」が正常なので、落ちたとは数えない（2026-09-22）。
       これを数えると **自分で作った間隔を自分でコマ落ちとして報告する**ことになり、
       画面の「落ちたコマ」が嘘になる（実際に嘘になっていた）。 */
    if(LOOP_SLOW && raw < 1000/SLOW_HZ + 60) return;
    if(raw > 20 && raw < 2000){ this.hist.push(now); if(raw > this.worst){ this.worst = raw; this.worstAt = now; }
                                try{ Prof.drop(now, raw); }catch(e){} }
    while(this.hist.length && now - this.hist[0] > 10000) this.hist.shift();
    if(now - this.worstAt > 10000) this.worst = 0;
  },
  count(){ return this.hist.length; }
};

/* ★A（2026-09-22・坂田「なんでエディタのフリッキーは普通に動くの？」）。
   ──答え：**エディタではスレッドにサンプラーしか乗っていない。**
   同じサイトの iframe は親と**同じ1本のスレッド**で動くので、ゲームの中では1コマごとに
     ①ゲームのループ（入力・音・字幕・draw）→ ②postMessage の処理 → ③サンプラーの描画
   が順番待ちする。フリッキーだけが映っている場面でも、①はずっと 60回/秒 動いていた。
   キャンバスは画面から外してあるのに、**ループは止めていなかった**。

   ここでは、フリッキーだけの場面は **rAF をやめて 10回/秒 のタイマー**に落とす。
   その間ゲームがやることは「字幕を出す」「喋り終わりを見て次の段へ送る」だけで、
   どちらも 60回/秒 は要らない（字幕の切り替わりが最大0.1秒ずれるだけ）。
   これで、その場面のスレッドはほぼサンプラー専用＝エディタ単体と同じ条件になる。

   N（キーボード）はここと無関係のハンドラで受けるので、遅れない。 */
const SLOW_HZ = 10;
let LOOP_SLOW = false, _slowTimer = 0;
function setLoopMode(slow){
  if(slow === LOOP_SLOW) return;
  LOOP_SLOW = slow;
  if(slow){
    _slowTimer = setInterval(()=>{ try{ frame(performance.now()); }catch(e){} }, 1000/SLOW_HZ);
  } else {
    if(_slowTimer){ clearInterval(_slowTimer); _slowTimer = 0; }
    requestAnimationFrame(frame);
  }
}

function frame(now){
  if(!LOOP_SLOW) requestAnimationFrame(frame);
  const raw = now - prev; prev = now;
  Drops.sample(now, raw);          // ★直前のコマの中身（Prof.last）を使って記録する
  Prof.begin();
  fpsBuf.push(raw); if(fpsBuf.length > 30) fpsBuf.shift();
  Quality.sample(raw);
  if(!running || !G) return;
  try{
    frameBody(raw, Quality.skipDraw(now));
    Prof.end();
    /* ★10Hz に落としている間は「100msごと」が正常なので、間隔を見ても意味が無い。
       代わりに**その1回の中で実際に働いた時間**を見る。本来1ms も掛からない所で
       坂田の環境では 94〜127ms 掛かっていた（こちらでは 0.3ms）。中身を残す。 */
    if(LOOP_SLOW){ const w = Prof.work(); if(w > 25){ try{ Prof.drop(now, Math.round(w)); }catch(e){} } }
    OpLink.streak = 0;
  }catch(err){
    OpLink.error((err && err.message) || err);
    try{ ctx.restore(); }catch(e){}
    ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    /* 1回なら次のフレームで立ち直る。1.5秒続いたら本物の故障として赤く出す */
    if(++OpLink.streak >= 90){ running = false; paintFatal((err && err.message) || err); }
  }
  /* フリッキーだけの場面かどうかで、ループの速さを切り替える */
  try{ setLoopMode(!!flekkyOnly()); }catch(e){}
  OpLink.post(now);
}

/* ★一発目の重さを、誰も見ていない所で済ませる。
   形の用意・色の作り置き・GLの下ごしらえ・日本語の字形。ぜんぶ**初回だけ**走る処理で、
   放っておくと「ブロック崩しの1コマ目」に固まって出る（実測 1446ms・2026-09-22 のログ）。

   ★2026-09-22：置き場所を**タイトル → 待機中**へ移した。
   タイトルなら止まっても平気、と思っていたが、ブロック崩しのタイトルは
   **フリッキーが消えて盤面が出る、まさにその瞬間**だった（坂田「ブロック崩しの出だしが重い」）。
   待機中はキャンバスを画面から外してあるので、ここで固まっても誰にも見えない。 */
function warmUp(){
  if(G._warmed) return;
  G._warmed = true;
  const q = f => { try{ f(); }catch(e){} };

  /* ── ① 絵。**初めて描くものは必ず遅い**（形の用意・色の作り置き・GLの組み立て・字形）。
     坂田 2026-09-22「何かが出現する瞬間は遅くなるね。UIも、フリッキーもだし」。
     だから「出るかもしれないもの」を、ここで一度ぜんぶ出しておく。 */
  const save = { powerups:G.powerups, lasers:G.lasers, msg:G.msg, msgT:G.msgT,
                 banner:G.banner, bannerT:G.bannerT, tier:G.comboTier,
                 timers:G.timers, guard:G.guard, scorePop:G.scorePop, aimHeldT:G.aimHeldT };
  q(()=>{
    // 出うるもので画面を埋める：アイテム11種・レーザー・帯・見出し・全部のタイマー表示
    G.powerups = Object.keys(POWERS).map((k,i)=>({ k, x:180+i*140, y:240+ (i%3)*90, vy:90, t:0.4 }));
    G.lasers   = [{x:640,y:520,vy:-1500},{x:1280,y:540,vy:-1500}];
    G.msg = '準備あいうえお漢字カナ'; G.msgT = 1.2;
    G.banner = '準備あいうえお漢字カナ'; G.bannerT = 1.2;
    G.timers = { expand:3, narrow:3, slow:3, fast:3, reverse:3, tiny:3, laser:3, catch:3 };
    G.guard = 1; G.scorePop = 1; G.aimHeldT = 1;
  });
  /* 段（コンボ）ごとに色と大きさが変わる＝段の数だけ描いておく */
  for(let tier=0; tier<=4; tier++){
    G.comboTier = tier;
    q(drawFieldFrame); q(drawComboBig); q(drawCore); q(drawLinks); q(drawBricks);
    q(drawGuards); q(drawAim); q(drawPowerups); q(drawLasers); q(drawBalls); q(drawPaddle);
    q(drawHUD); q(drawOverlays);
  }
  q(()=>drawScoreNum(200, 200, 44));
  q(()=>drawCaptionLines('準備あいうえお漢字カナ0123', 400, 1, W/2));
  q(drawTitle);
  q(()=>{ G.powerups = save.powerups; G.lasers = save.lasers; G.msg = save.msg; G.msgT = save.msgT;
          G.banner = save.banner; G.bannerT = save.bannerT; G.comboTier = save.tier;
          G.timers = save.timers; G.guard = save.guard; G.scorePop = save.scorePop;
          G.aimHeldT = save.aimHeldT; });

  /* ② 粒子と残像。実際に飛ばして描く（GLの組み立てと色の作り置き） */
  q(()=>{
    for(let i=0;i<3;i++){
      Particles.shatter({x:W/2,y:H/2,w:60,h:60}, 0, -1, 1.4, C.teal);
      FX.ring({x:W/2,y:H/2,w:60,h:60}, C.teal);
    }
    for(let i=0;i<4;i++){
      Particles.step(1/60); FX.step(1/60);
      Particles.drawBehind(); Particles.drawFront();
      FX.render(); FX.composite();
    }
    Particles.init(); FX.rings.length = 0;
  });

  /* ③ 素材。Boot が起動時に済ませている。ここは保険（準備OK 前に進められた時用） */
  q(()=>{ DeskArt.load(); RoarVideo.load(); Samples.loadCrash(); });

  /* ④ 字形。日本語は1文字ずつ形を作るので、初出の字が出るコマで固まる */
  q(()=>{
    ctx.save(); ctx.globalAlpha = 0;
    const FONTS = [
      `600 46px "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif`,
      `500 22px ${FM}`, `600 22px ${FM}`, `500 20px ${FM}`, `400 16px ${FM}`, `500 15px ${FM}`,
      `700 116px ${FD}`, `700 64px ${FD}`, `600 34px ${FD}`
    ];
    const SAMP = '準備あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほ'
               + 'まみむめもやゆよらりるれろわをん漢字カナ残機時間点数一二三四五六七八九十'
               + '席番列本目回勝負君二人壊崩落球確変GATE BREAK CLEAR TIME UP LIVES CORE REMAINING 0123456789';
    for(const f of FONTS){ ctx.font = f; ctx.fillText(SAMP, 0, 0); }
    ctx.restore(); ctx.globalAlpha = 1;
  });

  /* ⑤ 音。**初めて鳴らす音も遅い**（ノードの組み立て・サンプルの初回参照）。
     出音を 0 に落として全部ひと通り鳴らす。2.5秒後に戻す（N を押されたらその場で戻す）。 */
  q(()=>Audio_.warmSounds());
}

function frameBody(raw, skip){
  DRAW_SKIP = !!skip;                 // 描かないコマ。物理・音・進行はそのまま進む
  Prof.k('頭');
  Dbg.update();                       // ★落ちたコマの数（DOM。キャンバスを消していても見える）
  Prof.k('読み出し');
  let _e = Prof.t('パッド'); Input.poll(); _e();
  Prof.k('パッド');
  _e = Prof.t('結果の声'); ResultVoice.update(Math.min(raw/1000, 0.1)); _e();
  Prof.k('結果の声');

  if(G.act === 'gate' && Intro.busy()){
    _e = Prof.t('フリッキー更新'); Intro.update(Math.min(raw/1000, 0.1)); _e();
    if(TRY && Input.actionEdge){
      const _n = performance.now();
      if(_n - (G._lastN || 0) > 700){ G._lastN = _n; armAudio(); Intro.next(); }
      Input.actionEdge = false;
    }
  }
  if(G.act === 'intro'){
    const dt = Math.min(raw/1000, 0.1);
    /* eslint-disable no-unused-vars */
    G.elapsed += dt;
    if(G.core) G.core.gAng += (Math.PI*2 / GUARD_ROT) * dt;   // 説明中も壁は回す
    _e = Prof.t('フリッキー更新'); Intro.update(dt); _e();
    Prof.k('フリッキー');
    /* ★待機中（客席に何も出ていない間）に一発目の重さを済ませる。
       準備OK を待ってから。読み込みと同時にやると、どちらも遅くなる */
    if(!G._warmed && Intro.phase === 'standby' && Boot.ready()){ warmUp(); Prof.k('温め'); }
    /* 稽古：待機中に SPACE/✕ で導入を飛ばしてタイトルへ（本番は N だけで進む）
       試遊：SPACE が「次へ」を兼ねる（オペがいないので） */
    if(TRY && Input.actionEdge){
      const _n = performance.now();
      if(_n - (G._lastN || 0) > 700){ G._lastN = _n; armAudio(); Intro.next(); }
      Input.actionEdge = false;
    }
    else if(!SHOW && Intro.phase === 'standby' && Input.actionEdge){ Intro.done(); Input.actionEdge = false; }
    draw();
    Prof.k('導入の画');
    return;
  }

  // タイトル：最初の入力で音を起こしてサーブへ
  if(G.state === 'title'){
    G.elapsed += raw/1000;
    /* ★一発目の重さをここで済ませる（2026-09-21・坂田「ブロック崩しの一発目 重すぎる」）。
       プレイの1コマ目は、形の用意・色の作り置き・GLの下ごしらえが一度に来て 13ms かかっていた。
       タイトルは**人が✕を押すまで止まっている画**なので、ここで先にやっておけば本番で来ない。 */
    warmUp();      // ★ふつうは待機中に済んでいる。ここは保険
    /* ★向きのキーでは始めない（2026-09-22）。パドルを動かそうとしただけで
       サーブに入ってしまい、構える間が消える。始めるのは決定キーだけ。 */
    const _dir = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS'];
    const _any = [...Input.keys].some(k => !_dir.includes(k));
    if(Input.actionEdge || _any){
      armAudio();
      G.state = 'serve';
      const st = STAGES[G.stage % STAGES.length];
      G.banner = G.stageName; G.bannerT = st.noBanner ? 0 : 1.6;
    }
    draw();
    return;
  }

  if(Input.pauseEdge){
    if(G.state === 'pause') G.state = G._resume || 'play';
    else if(G.state !== 'over'){ G._resume = G.state; G.state = 'pause'; }
  }
  if(G.state === 'over' && (Input.actionEdge || Input.keys.has('KeyR'))) newGame();

  if(G.state !== 'pause' && G.state !== 'over'){
    /* ヒットストップ：世界だけ止める。描画とカメラの揺れは続くので画は死なない */
    const real = Math.min(raw/1000, 0.25);
    const flow = HitStop.consume(real);
    if(flow === 0){
      CAM.update(real);                       // 止まっている間も揺れは進む＝衝撃が伸びる
      G.fx.flash = Math.max(0, G.fx.flash - real*2.2);
      movePaddleOnly(real);                   // ★止めても操作は殺さない。手が効かない感じを作らない
    }
    acc += flow;
    let steps = 0;
    _e = Prof.t('物理');
    while(acc >= DT && steps < MAX_STEPS){ update(DT); acc -= DT; steps++; }
    _e();
    if(steps >= MAX_STEPS) acc = 0;
  } else {
    if(G.fx.flash > 0) G.fx.flash = Math.max(0, G.fx.flash - raw/1000*3);
  }
  Prof.k('物理おわり');
  _e = Prof.t('描画'); draw(); _e();
  Prof.k('尻');
}

/* ── 表示サイズ ─ 埋め込み先に依存せず 16:9 を保つ ───────────── */
function fitCanvas(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width  = Math.max(1, Math.floor(W * s)) + 'px';
  cv.style.height = Math.max(1, Math.floor(H * s)) + 'px';
  const cp = document.getElementById('cap');
  if(cp){
    const w = Math.floor(W*s), h = Math.floor(H*s);
    cp.style.width = w+'px';
    cp.style.left = Math.floor((innerWidth-w)/2)+'px';
    cp.style.fontSize = Math.round(46*s)+'px';
    cp.dataset.h = h; cp.dataset.top = Math.floor((innerHeight-h)/2);
    cp.dataset.scale = s;
  }
  const v = document.getElementById('vig');
  if(v){
    const w = Math.floor(W*s), h = Math.floor(H*s);
    v.style.width = w+'px'; v.style.height = h+'px';
    v.style.left = Math.floor((innerWidth-w)/2)+'px'; v.style.top = Math.floor((innerHeight-h)/2)+'px';
  }
  /* ★フリッキーは「箱」を置くだけ。中のキャンバスの大きさはランタイムが決める（2:1） */
  const fb = document.getElementById('flekkybox');
  if(fb){
    const w = Math.floor(W*s), h = Math.floor(H*s);
    fb.style.width = w+'px'; fb.style.height = h+'px';
    fb.style.left = Math.floor((innerWidth-w)/2)+'px'; fb.style.top = Math.floor((innerHeight-h)/2)+'px';
    if(window.FlekkyRT) try{ window.FlekkyRT.resize(); }catch(e){}
  }
}
addEventListener('resize', fitCanvas);

/* ── 致命的エラーは黒画面にせず、画面に出す ───────────────────── */
function paintFatal(msg){
  try{
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = C.void; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = `700 58px ${FD}`; ctx.fillStyle = C.terracotta;
    ctx.letterSpacing='0.14em'; ctx.fillText('SCRIPT ERROR', W/2, H/2-90); ctx.letterSpacing='0px';
    ctx.font = `400 21px ${FM}`; ctx.fillStyle = C.ink;
    const lines = String(msg).slice(0,320).match(/.{1,60}/g) || [];
    lines.forEach((l,i)=>ctx.fillText(l, W/2, H/2 - 10 + i*30));
    ctx.font = `400 17px ${FM}`; ctx.fillStyle = C.dim;
    ctx.fillText('この文字が出たら、この行をそのまま伝えてください', W/2, H/2 + 130);
  }catch(e){}
}
/* フレーム外（音のタイマー・読み込み等）の例外は記録だけする。
   旧：どこで起きても running=false にしていたので、音の一過性エラーで画面ごと止まった。
   描画・更新の中で続く故障は frame() 側が 1.5秒で SCRIPT ERROR に切り替える */
addEventListener('error', e => {
  OpLink.error((e.message||e)+'  @'+(e.lineno||'?'));
  if(!running) paintFatal((e.message||e)+'  @'+(e.lineno||'?'));
});
addEventListener('unhandledrejection', e => { OpLink.error(e.reason); });

/* ── 音は「鳴らせたら鳴らす」。失敗してもゲームは絶対に止めない ── */
function armAudio(){
  WakeLock_.request();
  try{
    Audio_.init();
    if(Audio_.ctx && Audio_.ctx.state === 'suspended') Audio_.ctx.resume();
    /* ★ここでは取りに行かない（2026-09-21）。armAudio は**最初の N でも走る**ので、
       押した瞬間に 7.5MB の取得と解凍が始まり、フリッキーの登場とぶつかっていた。
       音の出口（AudioContext）だけ用意する。素材は下の3か所で段階的に取る。 */
    /* ★ここで React.load() を呼ばない（2026-09-21）。
       armAudio は**最初の N でも走る**ので、押した瞬間に109本の取得が始まり、
       そのままフリッキーの登場とぶつかっていた。取得は指名の台詞に入ってから。
       ここは「すでに取れているものを解く」だけ。 */
    React.decodeAll();
  }catch(err){
    Audio_.on = false;
    console.warn('[BREAK BEYOND] audio unavailable:', err);
  }
}

/* ── 起動 ───────────────────────────────────────────────────────
   ゲームは読み込み時点で走らせる。最初の入力でやるのは
   「音を起こす」ことと「タイトルを抜ける」ことだけ。
   ここで例外が出てもフィールドは描かれ続ける。 */
if(SHOW){
  /* カーソルは画面のどこにあっても消す（canvas の外に出ると出てしまっていた） */
  cv.style.cursor = 'none'; document.body.style.cursor = 'none';
  document.documentElement.style.cursor = 'none';
  document.title = 'BREAK BEYOND — SHOW';
}
OpLink.init();
Prof.initTasks();      // ★「ブラウザが詰まった事象」を拾い始める（どこが詰めたかまで出る）
GLPoints.init();
try{
  Input.init();
  OldTrack.init();
  Particles.init(); FX.init();
  Quality.apply();                 // ★段に応じた色の出方をキャンバスへ
  fitCanvas();
  newGame();
  G.state = 'title';
  G.act = 'intro'; Intro.mount();
  G.bannerT = 0;
  running = true;
  /* ROAR の字形は重いので、開いた直後に作っておく（本番の CRASH で固まらせない） */
  setTimeout(()=>{ try{
    /* ★開いた瞬間に全部読み終える（坂田 2026-09-21）。
       「htmlを開いた瞬間に読み込みを終わらせて、GOできるようになったらバックエンド画面に表示」。
       途中で読むと必ず「人が押した瞬間」とぶつかる（実際に3か所でぶつかっていた）。
       本番は開演の数分前に立ち上げるので、先に全部済ませる。
       進み具合と「GO していいか」は op.html の帯に出る。**準備OK が出るまで N を押さない。** */
    RoarFX.prepare();
    for(let y=CRASH_YEAR_TO; y<=CRASH_YEAR_FROM; y++) GlyphPts.get(String(y), 300);   // 年が変わる瞬間に80ms止まっていた
    Boot.run();
  }catch(e){ OpLink.error('boot: ' + ((e && e.message) || e)); } }, 300);
}catch(err){
  paintFatal((err && err.message) || err);
}

addEventListener('keydown', e=>{
  if(!G) return;
  if(e.code === 'KeyF'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  if(e.code === 'KeyI') G.diag = !G.diag;
  if(e.code === 'KeyM' && G.act !== 'intro'){ armAudio(); setMode(G.mode === 'gate' ? 'break' : 'gate'); G.act = G.mode; }
  if(e.code === 'KeyO') G.opHud = !G.opHud;
  /* ★N の誤爆よけ（2026-09-21）。1秒以内の2度押しは捨てる。
     連打すると「交代の一言 → 待ち → CRASH」まで一気に飛び、**客が操作位置にいるまま幕が上がる**。
     押し直したい時は1秒待てば効く＝オペの意図は殺さない。 */
  if(e.code === 'KeyN'){
    const now = performance.now();
    if(now - (G._lastN || 0) < 1000){ toast('N は連打しない（1秒待つ）'); return; }
    G._lastN = now;
  }
  /* ★準備が終わる前に N を押したら、1回だけ止めて知らせる（2026-09-21）。
     止めるのは1回だけ。**もう一度押せば進む**＝オペの判断を殺さない。 */
  if(e.code === 'KeyN' && !Boot.canGo() && !G._bootWarned){
    G._bootWarned = true;
    toast('まだ読み込み中（' + Boot.pct() + '%）— もう一度押せば進む');
    return;
  }
  if(e.code === 'KeyN' && G.act === 'intro'){ armAudio(); Intro.next(); return; }
  if(e.code === 'KeyN' && G.act === 'gate' && Intro.busy()){ armAudio(); Intro.next(); return; }   // 解説・交代を送る
  /* ★勝負がついたら、次の N は CRASH ではなく**フリッキー単体**（二人目を席へ戻す間・2026-09-21） */
  if(e.code === 'KeyN' && G.act === 'gate' && G.gate && G.gate.done && Intro.phase === 'done'){
    armAudio(); startAfterGate(); return;
  }
  if(e.code === 'KeyN' && G.act === 'break'){ armAudio(); startGateTalk(); return; }
  if(e.code === 'KeyN'){                       // ★オペのキュー送り
    armAudio();
    if(G.act === 'break'){ setMode('gate'); G.act = 'gate'; }
    else if(G.act === 'gate'){ startCrash(); }
    else if(G.act === 'crash' && G.crash.phase === 'desktop' && !G.crash.held){
      G.crash.held = true; G.crash.heldAt = G.crash.t;      // デスクトップを切り上げる
    }
    else if(G.act === 'crash' && G.crash.phase === 'fade'){   // 完走後：頭から
      G.act = 'break'; G.crash = null; G.killCount = 0;
      OldTrack.stop(); Cue.stop(); RoarFX.reset(); RoarVideo.stop(); FX.fade = 0.22; Particles.init(); FX.init(); setMode('break'); G.state = 'serve';
    }
  }
  if(e.code === 'KeyG' && G.gate) G.gate.ghost = !G.gate.ghost;
  if(e.code === 'KeyJ' && G.gate){ G.gate.auto = !G.gate.auto; toast(G.gate.auto ? '\u81ea\u52d5\u5224\u5b9a' : '\u4eba\u304c\u5224\u5b9a\uff08X\uff09'); }
  if(e.code === 'KeyR' && G.mode === 'gate'){ newGate(); G.state = 'play'; React.reset(); }
  /* ★カクつきの切り分け（2026-09-21）。本番中でも押せる。押した内容は画面に出る。
     B … フリッキーの重ね方を screen ⇄ normal で切り替える
          screen は**画面全体を毎コマ合成し直す**。normal なら普通の重ね方になる。
          導入の間ゲームの画は真っ黒なので、**normal でも見た目は変わらない**。
          これで滑らかになるなら、原因は音でも描画でもなく**合成**。
     V … フリッキーの絵を止める（時計だけ進める）。
          止めて滑らかなら原因はフリッキー側、止めてもカクつくならゲーム側。 */
  if(e.code === 'KeyB' && Intro.el){
    const cur = Intro.el.style.mixBlendMode || 'screen';
    const next = cur === 'screen' ? 'normal' : 'screen';
    Intro.el.dataset.blendManual = '1';        // ★以降は自動で触らない
    Intro.el.style.mixBlendMode = next;
    toast('フリッキーの重ね方：' + next + (next === 'normal' ? '（合成が軽い）' : '（紗幕用）'));
  }
  /* C … 音を止めたまま絵だけ出す。**坂田「原因は音なのか？」を1発で確かめる。**
       音を止めて滑らかなら原因は音（時計・デコード・WebAudio）。変わらなければ音ではない。 */
  if(e.code === 'KeyC'){
    G._muteTest = !G._muteTest;
    try{ if(Audio_.master) Audio_.master.gain.value = G._muteTest ? 0 : 0.72; }catch(err){}
    toast(G._muteTest ? '音を止めた（Cで戻す）— 絵だけで確かめる' : '音を戻した');
  }
  if(e.code === 'KeyV' && Intro.el){
    Intro._frozen = !Intro._frozen;
    Intro.post({cmd: Intro._frozen ? 'sleep' : 'wake'});
    toast(Intro._frozen ? 'フリッキーの絵を止めた（Vで戻す）' : 'フリッキーの絵を戻した');
  }
  /* ★軽量／コマ数の上限（2026-09-21）。本番中でも押せる */
  /* ★U … コマ落ちの記録を画面に出す（坂田案 2026-09-21）。紗幕には出さない（オペHUDと同じ） */
  if(e.code === 'KeyU'){ Prof.show = !Prof.show; if(!Prof.show) Dbg.hideLog(); }
  /* K … 段0（かるい）に手で固定する／解除する。解除すると、また自動で登り始める */
  if(e.code === 'KeyK'){ Quality.setForced(!Quality.forced);
    toast(Quality.forced ? '絵の段：かるい に固定' : '絵の段：自動にもどす'); }
  /* ★段を手で上げ下げする（2026-09-22）。稽古で「どこまで行けるか」を試すため。
     上げた時は蓋も一緒に開ける（一度失敗した段にも上がれるようにする） */
  if(e.code === 'BracketRight'){ Quality.forced = false; Quality.ceiling = Q_MAX;
    Quality.set(Quality.level + 1, '手で上げた'); toast('絵の段：' + Quality.name()); }
  if(e.code === 'BracketLeft'){ Quality.forced = false;
    Quality.set(Quality.level - 1, '手で下げた'); toast('絵の段：' + Quality.name()); }
  /* ★GATE の落下をその場で遅く／速くする（テクリハ用・2026-09-22）。
     演者の実際の足の速さは人によって違う。「届く距離」を見ながら合わせる。
     4.0 を下回ると、端に置かれた時点で演者は物理的に詰む */
  /* Y … 狙いを見せる／隠すの切替（稽古で見比べるため・2026-09-22） */
  if(e.code === 'KeyY'){
    GATE_HIDE_AIM = !GATE_HIDE_AIM;
    toast(GATE_HIDE_AIM ? '狙いは隠す（落ちて初めて分かる）' : '狙いを見せる（演者は落ちるまで動かない約束）');
  }
  if(e.code === 'Comma' || e.code === 'Period'){
    const d = e.code === 'Comma' ? -12 : 12;
    GATE_V0 = Math.max(120, Math.min(560, GATE_V0 + d));
    GATE_VMAX = Math.max(GATE_V0 + 40, GATE_VMAX + d);
    if(G.gate) G.gate.speed = Math.max(GATE_V0, Math.min(GATE_VMAX, G.gate.speed + d));
    const v = G.gate ? G.gate.speed : GATE_V0;
    const reach = ((GATE_FALL/v) - GATE_REACT) * GATE_PERF_V / GATE_LW;
    toast('落下 ' + Math.round(v) + '　届く距離 ' + reach.toFixed(2) + ' レーン'
          + (reach < GATE_LANES-1 ? '（端は届かない）' : '（端まで届く）'));
  }
  if(e.code === 'KeyL'){ Quality.cap = Quality.cap === 30 ? 0 : 30; toast(Quality.cap ? '30fps に固定' : 'コマ数の上限なし'); }
});
requestAnimationFrame(frame);
</script>
