const OpLink = {
  ch:null, lastT:0, errors:0, lastErr:'', streak:0,
  init(){
    try{
      this.ch = new BroadcastChannel('break_beyond_op');
      /* op.html 側で押したキーをこちらに流す。フォーカスがオペ画面にあっても進行が止まらない */
      this.ch.onmessage = e => {
        const m = e.data || {};
        if(m.type === 'key' && typeof m.code === 'string'){
          dispatchEvent(new KeyboardEvent(m.down ? 'keydown' : 'keyup', { code:m.code }));
        }
      };
    }catch(err){ this.ch = null; }
  },
  error(msg){
    this.errors++; this.lastErr = String(msg).slice(0,200);
    try{ console.warn('[BREAK BEYOND]', msg); }catch(e){}
  },
  post(now){
    if(!this.ch || !G || now - this.lastT < 100) return;
    this.lastT = now;
    try{ this.ch.postMessage(opStatus()); }catch(e){}
  }
};

const WakeLock_ = {
  lock:null,
  async request(){
    try{
      if(this.lock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
      this.lock = await navigator.wakeLock.request('screen');
      this.lock.addEventListener('release', ()=>{ this.lock = null; });
    }catch(e){ this.lock = null; }
  }
};
document.addEventListener('visibilitychange', ()=>WakeLock_.request());

/* ══════════════════════════════════════════════════════════════
   1. オーディオ ─ 合成のみ（外部ファイルなし＝CSPに触れない）
   ══════════════════════════════════════════════════════════════ */
const Audio_ = {
  ctx:null, on:false,
  master:null, comp:null, limiter:null, busMusic:null, busSfx:null, duck:null, conv:null,
  room:null,

  /* ホールの残響ではなく「音に厚みを足すため」の短い部屋。
     会場自体に残響があるので長くしない（濁る） */
  _makeIR(dur, decay){
    const rate = this.ctx.sampleRate, len = Math.floor(rate*dur);
    const buf = this.ctx.createBuffer(2, len, rate);
    for(let ch=0; ch<2; ch++){
      const d = buf.getChannelData(ch);
      let lp = 0;
      const pre = Math.floor(rate*0.018);          // プリディレイ
      for(let i=0;i<len;i++){
        if(i < pre){ d[i] = 0; continue; }
        const n = Math.random()*2-1;
        lp += (n - lp) * 0.32;                     // 一極ローパス＝暗い残響
        d[i] = lp * Math.pow(1 - i/len, decay);
      }
    }
    return buf;
  },

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    const c = this.ctx;

    /* 出口から組む：… → comp（まとめる）→ limiter（保険）→ master → 出力
       1,200席で音量を上げても割れないように、必ずリミッターを通す */
    this.master = c.createGain(); this.master.gain.value = 0.72;
    this.limiter = c.createDynamicsCompressor();
    this.limiter.threshold.value = -3; this.limiter.knee.value = 0;
    this.limiter.ratio.value = 20; this.limiter.attack.value = 0.002; this.limiter.release.value = 0.08;
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -17; this.comp.knee.value = 9;
    this.comp.ratio.value = 3.2; this.comp.attack.value = 0.006; this.comp.release.value = 0.13;
    this.comp.connect(this.limiter); this.limiter.connect(this.master); this.master.connect(c.destination);

    this.conv = c.createConvolver(); this.conv.buffer = this._makeIR(1.5, 3.0);
    const wet = c.createGain(); wet.gain.value = 0.30;
    this.conv.connect(wet); wet.connect(this.comp);

    this.busSfx = c.createGain(); this.busSfx.gain.value = 1.05; this.busSfx.connect(this.comp);

    /* ★重低音は専用バス。ここの1行で公演全体の"重さ"を調整する。
       会場備え付けPAの低域はリハで確認すること（決定No.17の注記） */
    this.subLP = c.createBiquadFilter(); this.subLP.type='lowpass';
    this.subLP.frequency.value = 120; this.subLP.Q.value = 0.7;
    this.busSub = c.createGain(); this.busSub.gain.value = 1.0;
    this.busSub.connect(this.subLP); this.subLP.connect(this.comp);
    this.duck = c.createGain(); this.duck.gain.value = 1;
    this.busMusic = c.createGain(); this.busMusic.gain.value = 1.18;
    this.busMusic.connect(this.duck); this.duck.connect(this.comp);

    this.on = true;
  },

  /* 画面のX座標を定位に変換。18mの画面で音が全部センターから出ると絵と合わない */
  panFor(x){
    if(x == null) return 0;
    return Math.max(-0.85, Math.min(0.85, (x - W/2) / (W/2) * 0.85));
  },

  /* すべての音の共通口。フィルターエンベロープと定位とセンドを持つ */
  v(p){
    if(!this.on) return;
    const _a = performance.now();                      // ★音にどれだけ食われているか（2026-09-22）
    const c = this.ctx, t = (p.t != null ? p.t : c.currentTime), dur = p.dur;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), pn = c.createStereoPanner();
    o.type = p.type || 'square';
    o.frequency.setValueAtTime(p.freq, t);
    if(p.slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, p.slide), t + (p.slideT || dur));
    if(p.detune) o.detune.value = p.detune;
    f.type = p.ft || 'lowpass'; f.Q.value = p.q || 0.8;
    f.frequency.setValueAtTime(p.cut || 16000, t);
    if(p.cutEnd) f.frequency.exponentialRampToValueAtTime(Math.max(60, p.cutEnd), t + (p.cutT || dur));
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(p.vol, t + (p.atk || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    pn.pan.value = p.pan || 0;
    o.connect(f); f.connect(g); g.connect(pn);
    pn.connect(p.bus || this.busSfx);
    if(p.send){ const sg = c.createGain(); sg.gain.value = p.send; pn.connect(sg); sg.connect(this.conv); }
    o.start(t); o.stop(t + dur + 0.06);
    Prof.cur['音'] = (Prof.cur['音'] || 0) + (performance.now() - _a);
  },

  /* ★白ノイズは**起動時に1本だけ作って使い回す**（2026-09-22）。

     旧：音を鳴らすたびに `createBuffer` して、**1サンプルずつ Math.random と Math.pow を回していた**。
       ・ハイハットは8分ごとに鳴る（曲が鳴っている間ずっと）
       ・壊した音は 0.32秒＝48kHz で15,000サンプル
       ・逆再生の溜めは 7.4秒＝**35万サンプル**
       これが**物理の計算の途中で**走っていた。コマ落ちログの
       「物理 1191ms」「ゴミ 1.9MB/コマ」の出どころがここ。
     新：4秒のノイズを1本だけ作り、毎回ちがう位置から読む（音は毎回ちがう）。
       減衰は波形に焼かず、**音量の曲線（32点）**でつける。耳には同じ。 */
  _noise:null,
  noiseBuf(){
    const c = this.ctx;
    if(this._noise && this._noise.sampleRate === c.sampleRate) return this._noise;
    const len = Math.floor(c.sampleRate * 4);
    const b = c.createBuffer(1, len, c.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this._noise = b; return b;
  },
  n(p){
    if(!this.on) return;
    const _a = performance.now();
    const c = this.ctx, t = (p.t != null ? p.t : c.currentTime), dur = p.dur;
    const buf = this.noiseBuf();
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = p.ft || 'highpass';
    f.Q.value = p.q || 0.7;
    f.frequency.setValueAtTime(p.cut || 800, t);
    if(p.cutEnd) f.frequency.exponentialRampToValueAtTime(Math.max(60, p.cutEnd), t + dur);
    const g = c.createGain();
    /* 旧コードの pow(1 - i/len, curve) と同じ形を、32点の曲線で描く */
    const N = 32, cv = new Float32Array(N), k = p.curve || 1, vol = (p.vol == null ? 0.3 : p.vol);
    for(let i=0;i<N;i++) cv[i] = vol * Math.pow(1 - i/(N-1), k);
    /* 過去の時刻や自動化の重なりで例外が出ることがある。落ちるより鈍る方がマシ */
    try{ g.gain.setValueCurveAtTime(cv, Math.max(t, c.currentTime), Math.max(0.005, dur)); }
    catch(e){ g.gain.setValueAtTime(vol, t); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
    const pn = c.createStereoPanner(); pn.pan.value = p.pan || 0;
    src.connect(f); f.connect(g); g.connect(pn); pn.connect(p.bus || this.busSfx);
    if(p.send){ const sg = c.createGain(); sg.gain.value = p.send; pn.connect(sg); sg.connect(this.conv); }
    src.start(t, Math.random() * (buf.duration - 0.1));
    src.stop(t + dur + 0.02);              // ★loop なので必ず止める
    Prof.cur['音'] = (Prof.cur['音'] || 0) + (performance.now() - _a);
  },

  /* キックで音楽側を一瞬下げる（サイドチェイン）。低域が整理されて確変感が出る */
  duckAt(t){
    if(!this.on) return;
    const g = this.duck.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(1, t);
    g.linearRampToValueAtTime(0.44, t + 0.014);
    g.linearRampToValueAtTime(1, t + 0.20);
  },

  /* ── シネマティックの部品 ─────────────────────────
     重低音・逆再生の溜め・巨大な着弾。全部ここから組む */

  /* 30〜55Hz の芯。体で聴く帯域 */
  sub(o){
    if(!this.on || !this.ctx) return;
    const c = this.ctx, t = (o.t != null ? o.t : c.currentTime), dur = o.dur || 1.2;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(o.freq || 52, t);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(18, o.to), t + dur*0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.9, t + (o.atk || 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.busSub);
    osc.start(t); osc.stop(t + dur + 0.1);
  },

  /* 逆再生の溜め。着弾時刻 tHit に向かって開いていく（当てる前の"吸う"音） */
  reverseSwell(tHit, len, vol){
    if(!this.on || !this.ctx) return;
    const t = Math.max(this.ctx.currentTime, tHit - len);
    this.n({t, dur:len, vol:(vol||0.22), cut:180, cutEnd:6500, curve:0.22, send:0.55});
    this.v({freq:70, t, dur:len, type:'sawtooth', vol:(vol||0.22)*0.55, slide:520,
            q:3, cut:200, cutEnd:2600, send:0.45});
  },

  /* 巨大な着弾。逆再生の溜め → 芯（サブ）＋胴（低中域）＋当たり（高域） */
  cineHit(o){
    if(!this.on || !this.ctx) return;
    o = o || {};
    const c = this.ctx, t = (o.t != null ? o.t : c.currentTime), p = o.pan || 0;
    if(o.swell !== false) this.reverseSwell(t, o.swellLen || 1.1, o.swellVol || 0.20);
    this.sub({t, freq:o.subFrom || 62, to:o.subTo || 28, dur:o.subDur || 1.8, vol:o.subVol || 1.0});
    this.v({freq:o.bodyF || 96, t, dur:o.bodyDur || 0.9, type:'sawtooth', vol:o.bodyVol || 0.34,
            slide:(o.bodyF || 96)*0.42, q:5, cut:1400, cutEnd:180, pan:p, send:0.45});
    this.n({t, dur:0.18, vol:o.tickVol || 0.20, cut:2200, cutEnd:9000, curve:1.6, pan:p, send:0.30});
  },

  /* ── 音楽の音色 ─────────────────────────────── */
  kickAt(t){
    this.sub({t, freq:58, to:34, dur:0.42, vol:0.85, atk:0.006});   // 芯
    this.v({freq:160, t, dur:0.19, type:'sine', vol:0.85, slide:44, slideT:0.10,
            cut:2200, bus:this.busMusic});
    this.n({t, dur:0.014, vol:0.30, cut:2600, bus:this.busMusic});
    this.duckAt(t);
  },
  bassAt(m, t){
    const f = mtof(m);
    this.v({freq:f, t, dur:0.20, type:'sawtooth', vol:0.42, cut:2400, cutEnd:340, cutT:0.18,
            q:5, bus:this.busMusic, pan:0});
    this.v({freq:f/2, t, dur:0.20, type:'sine', vol:0.32, cut:400, bus:this.busMusic});
  },
  arpAt(m, t, dur, vol, pan){
    this.v({freq:mtof(m), t, dur, type:'square', vol, q:9,
            cut:5200, cutEnd:900, cutT:dur*0.9, bus:this.busMusic, pan, send:0.22});
  },
  leadAt(m, t){
    this.v({freq:mtof(m), t, dur:0.26, type:'sawtooth', vol:0.16, q:4,
            cut:7000, cutEnd:1600, bus:this.busMusic, pan:-0.2, send:0.35});
    this.v({freq:mtof(m), t, dur:0.26, type:'sawtooth', vol:0.16, detune:11, q:4,
            cut:7000, cutEnd:1600, bus:this.busMusic, pan:0.2, send:0.35});
  },
  hatAt(t, v, pan){ this.n({t, dur:0.038, vol:v, cut:7600, curve:2.2, bus:this.busMusic, pan:pan||0}); },

  /* ── 効果音（すべて画面の位置で定位する） ───────── */
  paddle(x){ if(Samples.play('paddle',{pan:this.panFor(x),send:.10})) return;
             this.v({freq:210, dur:0.09, type:'square', vol:0.34, slide:320, cut:2600, cutEnd:700,
                     pan:this.panFor(x), send:0.10}); },
  bump(x){   if(Samples.play('bump',{pan:this.panFor(x),send:.16})) return;
             this.v({freq:160, dur:0.13, type:'sawtooth', vol:0.34, slide:440, cut:3400, cutEnd:900,
                     q:3, pan:this.panFor(x), send:0.16}); },
  brick(combo, x){
    const p = this.panFor(x);
    if(Samples.play('brick',{pan:p,send:.20,rate:1+Math.min(combo,16)*0.022})) return;
    this.v({freq:330 + Math.min(combo,16)*36, dur:0.07, type:'triangle', vol:0.40,
            cut:9000, cutEnd:2600, pan:p, send:0.20});
    this.n({dur:0.024, vol:0.14, cut:3600, pan:p});
    this.sub({freq:70, to:44, dur:0.16, vol:0.16 + Math.min(combo,20)*0.012});
  },
  shatter(x){ if(Samples.play('shatter',{pan:this.panFor(x),send:.28})) return;
              this.n({dur:0.13, vol:0.26, cut:1500, cutEnd:5200, curve:1.4,
                      pan:this.panFor(x), send:0.28}); },
  /* ── GATE の4音 ─────────────────────────────
     落とす／穴を1つ動かす／ロック（もう動かせない）／演者が通した */
  gateDrop(x){
    if(Samples.play('gate_drop',{pan:this.panFor(x),send:.24})) return;
    this.n({dur:0.20, vol:0.30, cut:1800, cutEnd:260, curve:1.6, pan:this.panFor(x), send:.24});
    this.sub({freq:90, to:48, dur:0.5, vol:0.45});
  },
  gateMove(x){
    // 短いクリック。動かすたびに鳴るので、うるさくならない量にする
    if(Samples.play('gate_move',{pan:this.panFor(x), vol:0.45, send:.10})) return;
    if(!this.on || !this.ctx) return;
    this.v({freq:1250, dur:0.035, type:'square', vol:0.10, cut:6000, pan:this.panFor(x), send:.10});
    this.n({dur:0.030, vol:0.07, cut:3200, cutEnd:900, pan:this.panFor(x)});
  },
  gateLock(x){
    if(Samples.play('gate_lock',{pan:this.panFor(x),send:.30})) return;
    this.v({freq:220, dur:0.10, type:'square', vol:0.26, slide:110, cut:2400, pan:this.panFor(x), send:.30});
    this.sub({freq:66, to:44, dur:0.55, vol:0.42, atk:0.004});
  },
  /* ルーレットの刻み。速いうちは高く軽く、遅くなるほど低く重く。
     「止まりそうで止まらない」を音で作る＝予期が一番伸びる所 */
  /* きわどく拾った音。k が高いほど（端で拾ったほど）鋭く高く、息を呑む感じにする。
     コアのニアミスと対になる ── あちらは「惜しい」、こちらは「危なかった」 */
  paddleSave(x, k){
    if(!this.on || !this.ctx) return;
    const p = this.panFor(x), t = this.ctx.currentTime;
    this.n({t, dur:0.10+0.06*k, vol:0.10+0.16*k, cut:1200+3400*k, cutEnd:400,
            curve:2.0, pan:p, send:0.34});
    this.v({freq:520+680*k, t, dur:0.09, type:'sine', vol:0.07+0.11*k,
            slide:260, cut:6000, pan:p, send:0.30});
    this.sub({t, freq:70, to:44, dur:0.34, vol:0.28+0.30*k, atk:0.003});
  },
  rollTick(speed){
    if(!this.on || !this.ctx) return;
    this.v({freq: 900 + speed*900, dur:0.035, type:'square', vol:0.10 + 0.10*(1-speed),
            cut:8000, send:0.14});
  },
  rollLand(){
    if(!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    this.reverseSwell(t, 0.28, 0.16);
    this.sub({t, freq:88, to:40, dur:1.5, vol:0.95, atk:0.004});
    this.v({freq:180, t, dur:0.5, type:'sawtooth', vol:0.34, slide:70, q:5,
            cut:1800, cutEnd:200, send:0.42});
    this.n({t, dur:0.22, vol:0.22, cut:2400, cutEnd:9000, curve:1.6, send:0.34});
  },
  /* 「あと1回」の帯。切れ目なく鳴り続けて、決まると止まる。
     予期を持続させる装置。鳴っている間ずっと客席が張りつめる */
  lastOneOn(){
    if(!this.on || !this.ctx || this._lastOsc) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=110; f.type='bandpass'; f.frequency.value=440; f.Q.value=6;
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.055, c.currentTime+0.6);
    o.connect(f); f.connect(g); g.connect(this.busMusic); o.start();
    this._lastOsc=o; this._lastGain=g;
  },
  lastOneOff(){
    if(!this._lastOsc) return;
    const t=this.ctx.currentTime;
    try{ this._lastGain.gain.cancelScheduledValues(t);
         this._lastGain.gain.setValueAtTime(this._lastGain.gain.value, t);
         this._lastGain.gain.linearRampToValueAtTime(0.0001, t+0.25);
         this._lastOsc.stop(t+0.3); }catch(e){}
    this._lastOsc=null; this._lastGain=null;
  },
  gateJudge(x){
    // 判定者が押した合図。客席には目立たせず、袖の人にだけ確実に返す
    if(!this.on || !this.ctx) return;
    this.v({freq:1500, dur:0.05, type:'square', vol:0.16, cut:7000, pan:this.panFor(x)});
    this.n({dur:0.06, vol:0.12, cut:4200, cutEnd:1200, pan:this.panFor(x)});
  },
  /* ★演者に当たった音（2026-09-25 坂田「演者に当たった時のエフェクトや効果音など欲しい」）。
     いままでは玉を落とした時と同じ `die()` を流用していた。
     **この演目でいちばん大きい瞬間**なので、専用に組む。
       ・腹に来る重低音（下へ落ちる）＝当たった質量
       ・金属がひしゃげる音（低い帯のノイズ）
       ・その上に短い高域の破裂＝バーが割れた粒
     鳴らす場所は穴の位置で振る（どこで当たったか耳で分かる）。 */
  gateHit(x){
    if(!this.on || !this.ctx) return;
    const p = this.panFor(x), t = this.ctx.currentTime;
    if(Samples.play('gate_hit', {pan:p, send:.45})){ this.duckBefore(0.05, 0.42, 0.55); return; }
    this.sub({ t, freq:96, to:26, dur:1.05, vol:1.0, atk:0.006 });          // 腹に来る芯
    this.n({ t, dur:0.42, vol:0.34, cut:420, cutEnd:90, curve:1.5, pan:p, send:.40 });   // ひしゃげ
    this.n({ t, dur:0.12, vol:0.26, cut:2600, cutEnd:7200, curve:2.4, pan:p, send:.30 });// 割れた粒
    this.v({ t, freq:210, dur:0.30, type:'sawtooth', vol:0.30, slide:58, q:5,
             cut:1800, cutEnd:200, pan:p, send:.35 });
    this.v({ t: t+0.045, freq:1180, dur:0.09, type:'square', vol:0.12,
             cut:6000, pan:p, send:.25 });
    this.duckBefore(0.05, 0.42, 0.55);
  },
  gatePass(x){
    if(Samples.play('gate_pass',{pan:this.panFor(x),send:.40})) return;
    this.n({dur:0.32, vol:0.16, cut:600, cutEnd:5200, curve:1.2, pan:this.panFor(x), send:.40});
    this.v({freq:880, dur:0.30, type:'sine', vol:0.10, cut:6000, pan:this.panFor(x), send:.45});
  },

  /* かすめた音。惜しさ k(0〜1) が高いほど近く・高く・鋭く鳴る。
     ニアミスは音の方が絵より先に客席へ届くので、ここは必ず鳴らす */
  nearMiss(x, k){
    if(!this.on || !this.ctx) return;
    this.n({ dur:0.13 + 0.05*k, vol:0.10 + 0.16*k,
             cut: 900 + 2600*k, cutEnd: 260, curve:2.2,
             pan:this.panFor(x), send:0.30 });
    this.v({ freq: 620 + 520*k, dur:0.07, type:'sine', vol:0.05 + 0.09*k,
             slide: 220, cut: 5200, pan:this.panFor(x), send:0.22 });
  },
  wall(x){ if(Samples.play('wall',{pan:this.panFor(x),send:.08})) return;
           this.v({freq:170, dur:0.05, type:'sine', vol:0.24, cut:900, pan:this.panFor(x)}); },
  good(x){
    const p = this.panFor(x);
    if(Samples.play('power_good',{pan:p,send:.30})) return;
    this.v({freq:523, dur:0.10, type:'triangle', vol:0.40, cut:9000, pan:p, send:0.30});
    if(this.ctx) this.v({freq:784, dur:0.16, type:'triangle', vol:0.38, cut:11000, pan:p, send:0.34,
                         t:this.ctx.currentTime + 0.07});
  },
  bad(x){ if(Samples.play('power_bad',{pan:this.panFor(x),send:.20})) return;
          this.v({freq:300, dur:0.24, type:'sawtooth', vol:0.42, slide:105, q:6,
                  cut:2400, cutEnd:300, pan:this.panFor(x), send:0.20}); },
  laser(x){ if(Samples.play('laser',{pan:this.panFor(x)})) return;
            this.v({freq:1250, dur:0.06, type:'square', vol:0.20, slide:640,
                    cut:9000, pan:this.panFor(x)}); },
  die(){
    if(Samples.play('die',{send:.42})) return;
    this.cineHit({swell:false, subFrom:78, subTo:26, subDur:1.6, subVol:0.85,
                  bodyF:190, bodyVol:0.30, tickVol:0.14});
    this.v({freq:270, dur:0.7, type:'sawtooth', vol:0.34, slide:44, q:8,
            cut:2600, cutEnd:140, send:0.50});
  },
  /* ★残機が減ってきた時のブザー（坂田 2026-09-21「のこり残機が少なくなったらブザーの音出したりしよう」）。
     2回鳴る低い警告音。残り2で1回、残り1でもう一段低く強く。
     落球の音（die）とぶつからないよう、**0.45秒あとに**鳴らす */
  buzzer(level){                        // level: 1=残り2　2=残り1
    if(Samples.play('buzzer',{send:.35, rate: level === 2 ? 0.82 : 1.0})) return;
    const base = level === 2 ? 138 : 174;
    for(let i=0;i<2;i++){
      const at = i * 0.30;
      setTimeout(()=>{
        this.v({freq:base, dur:0.22, type:'square', vol: level===2 ? 0.34 : 0.26,
                q:3, cut:900, cutEnd:420, send:0.30});
        this.v({freq:base*2, dur:0.20, type:'sawtooth', vol: level===2 ? 0.16 : 0.11,
                q:5, cut:1800, cutEnd:700, send:0.24});
      }, at*1000);
    }
  },
  riser(tier){
    if(Samples.play('riser',{send:.40,rate:0.88+tier*0.09})) return;
    this.v({freq:300 + tier*90, dur:0.26, type:'sawtooth', vol:0.32, slide:1100 + tier*280,
            q:7, cut:1200, cutEnd:9000, send:0.40});
  },
  powerDown(){
    if(Samples.play('powerdown',{send:.45})) return;
    this.v({freq:780, dur:0.62, type:'sawtooth', vol:0.42, slide:66, q:9,
            cut:6000, cutEnd:180, send:0.45});
    this.n({dur:0.34, vol:0.18, cut:1400, cutEnd:150, send:0.40});
  },
  clear(){
    if(Samples.play('clear',{send:.42})) return;
    if(!this.on || !this.ctx) return;
    this.sub({freq:44, to:62, dur:2.4, vol:0.7, atk:0.5});
    this.reverseSwell(this.ctx.currentTime + 0.5, 0.5, 0.16);
    [523,659,784,1046].forEach((f,i)=>
    this.v({freq:f, dur:0.34, type:'triangle', vol:0.36, cut:11000,
            pan:(i-1.5)*0.35, send:0.42, t:this.ctx.currentTime + i*0.095})); },
  over(){ if(Samples.play('over',{send:.40})) return;
          if(!this.on || !this.ctx) return;
          [392,330,262,196].forEach((f,i)=>
    this.v({freq:f, dur:0.46, type:'sawtooth', vol:0.34, q:4, cut:2600, cutEnd:400,
            send:0.40, t:this.ctx.currentTime + i*0.175})); },

  /* ══ 映画寄せ（2026-09-20 坂田了承）════════════════════════
     ① 低域の床 … 何も起きていない時間にも鳴っている圧。状況で開いていく
     ② 一撃の直前に全部を下げる … 大きくするより、周りを引く方が大きく聞こえる
     ③ 予兆／節目の音型 … 山の2秒前から登り、節目では毎回同じ2音
     いずれも実素材（sfx/subfloor・preroll・motif）。合成音は使わない */
  floor:null,
  floorOn(){
    if(!this.on || this.floor || !Samples.buf['subfloor']) return;
    const c = this.ctx;
    const src = c.createBufferSource(); src.buffer = Samples.buf['subfloor']; src.loop = true;
    const g = c.createGain(); g.gain.value = 0.0001;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 130;
    src.connect(lp); lp.connect(g); g.connect(this.busSub || this.comp);
    src.start();
    this.floor = {src, g};
  },
  /* 0＝無音 / 1＝最大。ゆっくり動かす（気づかれないのが正しい） */
  floorSet(v, sec){
    if(!this.floor || !this.ctx) return;
    const g = this.floor.g, t = this.ctx.currentTime;
    const x = Math.max(0.0001, Math.min(1, v) * 0.85);
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), t);
    g.gain.exponentialRampToValueAtTime(x, t + (sec || 1.2));
  },
  floorOff(sec){ this.floorSet(0, sec || 0.8); },
  /* 一撃の直前に周りを下げる。lead 秒前から depth まで落ち、hit の後 rel 秒で戻る */
  duckBefore(lead, depth, rel){
    if(!this.on || !this.ctx || !this.master) return;
    const t = this.ctx.currentTime, g = this.master.gain, base = 0.72;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(base * (depth == null ? 0.42 : depth), t + Math.max(0.02, lead || 0.25));
    g.linearRampToValueAtTime(base, t + Math.max(0.05, lead || 0.25) + (rel || 0.5));
  },
  preroll(vol){ Samples.play('preroll', {vol: vol == null ? 0.8 : vol, send:.35}); },

  /* ★音をひと通り「無音で」鳴らしておく（2026-09-22・坂田「何かが出現する瞬間は遅くなる」）。
     初めて鳴らす音は、ノードの組み立てとサンプルの初回参照でコマを食う。
     プレイ中に初めて鳴る音（残機ブザー・確変のリフト・落球・壊す音…）が
     **まさにその瞬間に**固まっていた。ここで先に済ませる。
     出音は 0 に落とすので聞こえない。2.5秒後に戻す（N が来たらその場で戻す）。 */
  warmSounds(){
    if(!this.on || !this.ctx || !this.master) return;
    this._muted = true;
    try{ this.master.gain.cancelScheduledValues(this.ctx.currentTime);
         this.master.gain.value = 0; }catch(e){}
    const q = f => { try{ f(); }catch(e){} };
    const X = [W*0.3, W*0.7];
    q(()=>{ for(const x of X){ this.wall(x); this.paddle(x); this.bump(x); this.laser(x);
                               this.shatter(x); this.good(x); this.bad(x);
                               this.nearMiss(x, 0.6); this.paddleSave(x, 0.6); } });
    q(()=>{ for(let cb=0; cb<=4; cb++) this.brick(cb*12, W/2); });
    q(()=>{ this.die(); this.clear(); this.over(); this.powerDown(); });
    q(()=>{ this.buzzer(1); this.buzzer(2); });
    q(()=>{ for(let t=1;t<=4;t++) this.riser(t); });
    q(()=>{ this.rollTick(0.5); this.rollLand(); this.preroll(0.7);
            this.lastOneOn(); this.lastOneOff(); });
    q(()=>{ this.duckBefore(0.1, 0.6, 0.35); });
    /* 録った実音も一度ぜんぶ触る（初回参照のぶんを前倒し） */
    q(()=>{ for(const k in Samples.buf) Samples.play(k, {vol:0.0001}); });
    this._unmuteAt = setTimeout(()=>this.unmuteNow(), 2500);
  },
  unmuteNow(){
    if(!this._muted) return;
    this._muted = false;
    if(this._unmuteAt){ clearTimeout(this._unmuteAt); this._unmuteAt = 0; }
    try{ this.master.gain.cancelScheduledValues(this.ctx.currentTime);
         this.master.gain.value = 0.72; }catch(e){}
  },
  motif(vol){ Samples.play('motif', {vol: vol == null ? 0.9 : vol, send:.40}); },

  /* ── 崩壊 ───────────────────────────────────── */
  crashDown(){
    if(Samples.play('crash',{send:.50})) return;
    // 公演で一番大きい音。溜め → 落下 → 尾を引く
    this.cineHit({swell:true, swellLen:0.9, swellVol:0.26,
                  subFrom:70, subTo:22, subDur:3.2, subVol:1.15,
                  bodyF:180, bodyDur:1.6, bodyVol:0.40, tickVol:0.24});
    this.v({freq:430, dur:2.2, type:'sawtooth', vol:0.34, slide:32, q:11,
            cut:5000, cutEnd:110, send:0.55});
    this.n({dur:1.8, vol:0.20, cut:2400, cutEnd:90, send:0.50});
  },
  /* デスクトップ中の「空調の音」。完全な無音より、生きているのに何も起きない方が怖い */
  roomToneOn(){
    if(!this.on || this.room) return;
    const c = this.ctx;
    if(Samples.buf['roomtone']){
      const src = c.createBufferSource(); src.buffer = Samples.buf['roomtone']; src.loop = true;
      const g = c.createGain(); g.gain.value = 0;
      g.gain.linearRampToValueAtTime(0.5, c.currentTime + 0.5);
      src.connect(g); g.connect(this.comp); src.start();
      this.room = {src, g}; return;
    }
    const len = Math.floor(c.sampleRate*2);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0); let lp = 0;
    for(let i=0;i<len;i++){ lp += ((Math.random()*2-1) - lp)*0.02; d[i] = lp*3.2; }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 380;
    const g = c.createGain(); g.gain.value = 0.0;
    g.gain.linearRampToValueAtTime(0.16, c.currentTime + 0.5);
    src.connect(f); f.connect(g); g.connect(this.comp);
    src.start(); this.room = {src, g};
  },
  roomToneOff(){
    if(!this.room) return;
    const {src, g} = this.room; this.room = null;
    try{
      g.gain.cancelScheduledValues(this.ctx.currentTime);
      g.gain.setValueAtTime(g.gain.value, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.4);
      src.stop(this.ctx.currentTime + 0.5);
    }catch(e){}
  },
  /* 年号が1つ戻るたび。戻るほど低く・重くする＝時間の底へ落ちていく感じ。
     素の矩形波だと安っぽいので実素材を使い、無い場合だけ合成に落ちる */
  /* 年が1つ戻る音。TENET / Doctor Strange の逆再生シークエンスの作りに倣う。
     調べた結論：**逆再生を「逆だ」と伝えているのは絵ではなく音**。
     核は逆リバーブ ── 余韻が着弾の「前」に膨らむ。時間が吸い込まれる感じが出る。
     ここでは「膨らみ → 着弾 → 吸い込み（逆再生の打点）」の3層で組む。 */
  yearTick(step, nextIn){
    if(!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const r = 1.0 - Math.min(5, step)*0.085;         // 戻るほど低く
    // ① 着弾（実素材）
    if(!Samples.play('year_tick',{send:.38, rate:r, vol:1.0})){
      this.v({freq:(300 - step*34), dur:0.22, type:'triangle', vol:0.30,
              slide:(180 - step*20), cut:2600, cutEnd:600, send:0.38});
    }
    // ② 芯
    this.sub({freq: 74 - step*6, to: 40 - step*3, dur: 0.9, vol: 0.55, atk:0.004});
    // ③ 次の年へ向かう「吸い込み」＝逆リバーブ。次の着弾の前に膨らませる
    if(nextIn > 0.12) this.reverseSwell(t + nextIn, Math.min(nextIn*0.92, 1.0), 0.18 + step*0.02);
  },
  rewindTick(i, x){
    if(Samples.play('rewind_tick',{pan:this.panFor(x),send:.34,rate:0.9+(i%9)*0.045})) return;
    this.v({freq:320 + (i%9)*74, dur:0.06, type:'triangle', vol:0.20,
            cut:9000, pan:this.panFor(x), send:0.34});
  },
  rewindSweep(){
    if(Samples.play('rewind_sweep',{send:.45})) return;
    if(!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    // 7.5秒かけて開いていく逆再生の溜め。下から持ち上がる重低音を敷く
    this.n({t, dur:7.4, vol:0.20, cut:80, cutEnd:6200, curve:0.28, send:0.55});
    this.v({freq:46, t, dur:7.4, type:'sawtooth', vol:0.20, slide:600, q:7,
            cut:180, cutEnd:3400, send:0.45});
    this.sub({t, freq:26, to:58, dur:7.4, vol:0.85, atk:2.2});
    // 着地の瞬間に芯が来る
    this.sub({t:t+7.2, freq:60, to:30, dur:2.6, vol:1.0, atk:0.02});
  },

  /* 旧API（時刻指定・直接）。OldTrack の合成フォールバックが使う */
  at(freq, t, dur, type='square', vol=.4, slideTo=null){
    this.v({freq, t, dur, type, vol, slide:slideTo, send:0.22});
  },
  noiseAt(t, dur, vol, hp){ this.n({t, dur, vol, cut:hp}); },
  tone(freq, dur, type='square', vol=.5, slideTo=null){
    this.v({freq, dur, type, vol, slide:slideTo, send:0.15});
  },
  noise(dur, vol=.4, hp=800){ this.n({dur, vol, cut:hp}); }
};

/* ══════════════════════════════════════════════════════════════
   1a1. サンプル ── sfx/ と music/ に実ファイルがあればそれを鳴らす。
        無ければ従来の合成音にそのまま落ちる（1個ずつ差し替えていける）
   ★file:// では fetch がブロックされるのでサンプルは無効になる。
     本番は localhost で配信して開くこと（start.command）。
     localhost ならゲームパッドもサンプルも Web MIDI も全部動く。
   ══════════════════════════════════════════════════════════════ */
const SFX_NAMES = ['subfloor','motif','preroll',
  'year_tick','sys_fail','glitch','gate_lock','gate_pass',
  'brick','paddle','bump','wall','shatter','power_good','power_bad',
                   'laser','die','riser','powerdown','clear','over','crash',
                   'rewind_tick','rewind_sweep','gate_drop','gate_move','roomtone','rewind_cue'];
const LOOP_NAMES = ['music_base','music_kakuhen'];
const STEM_NAMES = ['stem1_kick_bass','stem2_arp','stem3_hat','stem4_lead'];

const Samples = {
  enabled: location.protocol !== 'file:',
  buf: {}, loaded: 0, failed: 0, done: false, doneGame: false, doneCrash: false,

  async _one(dir, name){
    for(const ext of ['wav','mp3','m4a']){
      try{
        const res = await fetch(`${dir}/${name}.${ext}`, {cache:'no-store'});
        if(!res.ok) continue;
        const ab = await res.arrayBuffer();
        this.buf[name] = await Audio_.ctx.decodeAudioData(ab);
        this.loaded++; return true;
      }catch(e){}
    }
    this.failed++; return false;
  },
  /* ★2026-09-21：まとめて取るのをやめた（坂田「最初のNを押した時が重い」）。
     `sfx/` と `music/` は **合計7.5MB**。うち `rewind_cue.wav` だけで 3.5MB あり、
     **CRASH まで8分使わない**のに、最初の N（armAudio）で一緒に取って解凍していた。
     取り込みと解凍が、フリッキーの登場の描画とぶつかる。
     使う手前で段階的に取る。取れていなければ合成音に落ちるので、間に合わなくても鳴らなくはならない。 */
  async loadAll(){ return this.loadGame(); },      // 旧名の受け皿
  async loadGame(){
    if(!this.enabled || !Audio_.on || this.doneGame) return;
    this.doneGame = true;
    const heavy = new Set(['rewind_cue']);          // CRASH 用は後回し
    await Promise.all([
      ...SFX_NAMES.filter(n => !heavy.has(n)).map(n => this._one('sfx', n)),
      ...STEM_NAMES.map(n => this._one('music', n)),
      ...LOOP_NAMES.map(n => this._one('music', n))
    ]);
    console.log(`[BREAK BEYOND] samples(game): ${this.loaded} loaded / ${this.failed} missing`);
  },
  async loadCrash(){
    if(!this.enabled || !Audio_.on || this.doneCrash) return;
    this.doneCrash = true;
    await Promise.all(['rewind_cue'].map(n => this._one('sfx', n)));
    console.log(`[BREAK BEYOND] samples(crash): ${this.loaded} loaded`);
  },
  /* 鳴らせたら true。false なら呼び出し側が合成音に落ちる */
  play(name, o){
    o = o || {};
    const b = this.buf[name];
    if(!b || !Audio_.on) return false;
    const _a = performance.now();          // ★実音の再生にどれだけ食われているか（2026-09-22）
    const c = Audio_.ctx, t = (o.t != null ? o.t : c.currentTime);
    const src = c.createBufferSource(); src.buffer = b;
    if(o.rate) src.playbackRate.value = o.rate;
    const g = c.createGain(); g.gain.value = (o.vol == null ? 1 : o.vol);
    const pn = c.createStereoPanner(); pn.pan.value = o.pan || 0;
    src.connect(g); g.connect(pn); pn.connect(o.bus || Audio_.busSfx);
    if(o.send){ const sg = c.createGain(); sg.gain.value = o.send; pn.connect(sg); sg.connect(Audio_.conv); }
    src.start(t);
    Prof.cur['音'] = (Prof.cur['音'] || 0) + (performance.now() - _a);
    return true;
  }
};

/* ── 音楽のステム ────────────────────────────────────────────
   4本を同じ長さ・同じテンポで作り、段に応じてゲインを開閉する。
   これで「生の音源の質」と「リアルタイムの段階変化」が両立する。
   ★テンポ変化は捨てる（テンポ別に作ると16本になって管理が破綻するため）。
     段の表現は層と音量で行う。 */
/* 実ファイルのループ再生。music/music_base.mp3 と music_kakuhen.mp3 を
   同時に走らせておき、ゲイン0.4秒で入れ替える。
   途中で止めて掛け直すと拍がズレるので、両方鳴らしっぱなしで音量だけ振る */
const Loop = {
  src:{}, gain:{}, playing:false, cur:null,
  /* 曲ごとに独立して判定する。BASEだけ実ファイルがあってもいい。
     その場合 確変は合成音のまま鳴る */
  has(which){ return !!Samples.buf['music_' + which]; },
  play(which){
    if(!Audio_.on) return false;
    const c = Audio_.ctx;
    // 裏タブ等で止まっていると currentTime が進まず、クロスフェードのランプが完了しない
    if(c.state === 'suspended') c.resume().catch(()=>{});
    const t = c.currentTime;
    // 実ファイルがある曲だけを走らせておき、音量で切り替える（拍がズレない）
    for(const n of LOOP_NAMES){
      if(!Samples.buf[n] || this.src[n]) continue;
      const sc = c.createBufferSource(); sc.buffer = Samples.buf[n]; sc.loop = true;
      const g = c.createGain(); g.gain.value = 0;
      sc.connect(g); g.connect(Audio_.busMusic); sc.start(t + 0.03);
      this.src[n] = sc; this.gain[n] = g; this.playing = true;
    }
    this.cur = which;
    for(const n of LOOP_NAMES){
      if(!this.gain[n]) continue;
      const on = (n === 'music_' + which);
      const g = this.gain[n].gain;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(on ? 1 : 0, t + 0.40);
    }
    return this.has(which);          // その曲に実ファイルがあれば true
  },
  stop(){
    if(!this.playing) return;
    const t = Audio_.ctx.currentTime;
    for(const n of LOOP_NAMES){
      if(!this.gain[n]) continue;
      try{ this.gain[n].gain.cancelScheduledValues(t);
           this.gain[n].gain.linearRampToValueAtTime(0, t+0.25);
           this.src[n].stop(t + 0.30); }catch(e){}
    }
    this.playing = false; this.cur = null; this.src = {}; this.gain = {};
  }
};

const Stems = {
  src: [], gain: [], playing: false,
  ready(){ return STEM_NAMES.every(n => Samples.buf[n]); },
  start(){
    if(this.playing || !this.ready() || !Audio_.on) return false;
    const c = Audio_.ctx, t = c.currentTime + 0.03;
    this.src = []; this.gain = [];
    for(const n of STEM_NAMES){
      const s = c.createBufferSource(); s.buffer = Samples.buf[n]; s.loop = true;
      const g = c.createGain(); g.gain.value = 0;
      s.connect(g); g.connect(Audio_.busMusic);
      s.start(t); this.src.push(s); this.gain.push(g);
    }
    this.playing = true;
    this.setTier(Music.tier);
    return true;
  },
  setTier(n){
    if(!this.playing || !Audio_.on) return;
    const t = Audio_.ctx.currentTime;
    this.gain.forEach((g,i)=>{
      const v = (i < n) ? 1 : 0;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(v, t + 0.14);
    });
  },
  stop(){
    if(!this.playing) return;
    const c = Audio_.ctx, t = c.currentTime;
    this.gain.forEach(g=>{ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
                           g.gain.linearRampToValueAtTime(0, t + 0.07); });
    this.src.forEach(s=>{ try{ s.stop(t + 0.12); }catch(e){} });
    this.src = []; this.gain = []; this.playing = false;
  }
};

/* ══════════════════════════════════════════════════════════════
   1a2. 旧音源（Roar 2021）── 実ファイルがあれば鳴らし、無ければ合成で代替
   ══════════════════════════════════════════════════════════════ */
const OldTrack = {
  el:null, ok:false, synth:[],
  init(){
    try{
      const a = new Audio();
      a.preload = 'auto'; a.volume = 0.85;
      a.addEventListener('canplaythrough', ()=>{ this.ok = true; }, {once:true});
      a.addEventListener('error', ()=>{ this._next(); });
      this.el = a; this.srcIdx = -1; this._next();
    }catch(e){ this.el = null; }
  },
  _next(){
    this.ok = false;
    this.srcIdx++;
    if(!this.el || this.srcIdx >= OLDTRACK_SRCS.length){
      OpLink.error('旧音源が1つも読めない: ' + OLDTRACK_SRCS.join(' / '));
      return;
    }
    this.el.src = OLDTRACK_SRCS[this.srcIdx];
    try{ this.el.load(); }catch(e){}
  },
  play(){
    if(this.el){                                  // ok を待たずに鳴らしにいく（読み込みの合図が遅れる環境がある）
      try{ this.el.currentTime = 0; const pr = this.el.play();
           if(pr && pr.catch) pr.catch(e=>OpLink.error('旧音源を鳴らせない: ' + e));
           return; }catch(e){ OpLink.error('旧音源を鳴らせない: ' + e); }
    }
    OpLink.error('旧音源が用意できていない（無音で進む）');   // 合成音は使わない
  },
  /* ★使わない（2026-09-20）。この演出では合成音を鳴らさないと決めたので、どこからも呼んでいない */
  _synth(){
    if(!Audio_.on) return;
    const t = Audio_.ctx.currentTime;
    [110, 110.6, 164.8, 220].forEach((f,i)=>{
      Audio_.at(f, t + i*0.02, 7.0, 'sawtooth', 0.10);
    });
    for(let i=0;i<14;i++) Audio_.noiseAt(t + i*0.5, 0.16, 0.05, 300);
    this.synth.push(t);
  },
  stop(){ try{ if(this.el){ this.el.pause(); this.el.currentTime = 0; this.el.playbackRate = 1; } }catch(e){} },
  /* SYSTEM ERROR の瞬間、テープが止まるように音程ごと落として消す */
  tapeStop(dur){
    const a = this.el; if(!a || a.paused) return;
    try{ a.preservesPitch = false; a.mozPreservesPitch = false; a.webkitPreservesPitch = false; }catch(e){}
    const t0 = performance.now(), v0 = a.volume;
    const iv = setInterval(()=>{
      const k = Math.min(1, (performance.now() - t0) / (dur*1000));
      try{ a.playbackRate = Math.max(0.0625, 1 - k*k*0.94); a.volume = v0 * (1 - k*k); }catch(e){}
      if(k >= 1){ clearInterval(iv); try{ a.pause(); a.playbackRate = 1; a.volume = v0; }catch(e){} }
    }, 16);
  }
};

/* 巻き戻し〜ROAR の音。1本にミックス済みのキューを鳴らし、絵はこの音の時計に合わせる。
   フレーム落ちやヒットストップで絵と音がずれない（映画の音と同じ作り方） */
const Cue = {
  src:null, t0:0,
  start(){
    if(!Audio_.on || !Audio_.ctx || !Samples.buf['rewind_cue']) return false;
    const c = Audio_.ctx;
    if(c.state === 'suspended') c.resume().catch(()=>{});
    const src = c.createBufferSource(); src.buffer = Samples.buf['rewind_cue'];
    const g = c.createGain(); g.gain.value = 1.0;
    src.connect(g); g.connect(Audio_.comp);           // 残響は焼き込み済み。センドしない
    this.t0 = c.currentTime + 0.02; src.start(this.t0);
    this.src = src; return true;
  },
  /* 再生開始からの秒。鳴っていなければ null */
  elapsed(){
    /* 音が止まっている（suspended 等）なら同期しない。絵を音に縛って固まらせない */
    if(!this.src || !Audio_.ctx || Audio_.ctx.state !== 'running') return null;
    return Math.max(0, Audio_.ctx.currentTime - this.t0);
  },
  stop(){ try{ this.src && this.src.stop(); }catch(e){} this.src = null; }
};

/* ══════════════════════════════════════════════════════════════
   1b. 連続演出の音楽 ─ コンボが続いている間だけ鳴り、切れた瞬間に止まる
       段が上がるほど層とテンポが増える。王道進行 F→G→Em→Am。
       スケジューリングはオーディオ時計で先読みする（rAFだとヨレる）
   ══════════════════════════════════════════════════════════════ */
const mtof = m => 440 * Math.pow(2, (m-69)/12);
/* ══ 音楽 ═══════════════════════════════════════════════════
   2曲構成（坂田指示 2026-08-28）。
     BASE   … サーブした瞬間から鳴り、ずっとループする。遅く・疎で・張りつめた曲
     確変   … コンボが乗ったら BASE と入れ替わる「別の曲」。速く・密で・押し切る曲
   段が上がるごとに層が増えるのは確変の中だけの話で、BASEとは別の曲にしてある。
   music/ に music_base.mp3 / music_kakuhen.mp3 を置けばそちらを優先して鳴らす
   （その場合は0.4秒でクロスフェードする）。無ければ下の合成シーケンサで鳴らす。 */
const Music = {
  playing:false, tier:0, step:0, nextT:0, timer:null, mode:null,
  PROG:[[53,57,60],[55,59,62],[52,55,59],[57,60,64]],   // 確変：F / G / Em / Am
  PROG_B:[[50,53,57],[46,50,53],[48,52,55],[45,48,52]], // BASE：Dm / B♭ / C / Am（解決しない）
  BPM:[0,138,154,174,194],
  BPM_BASE: 84,

  bpm(){ return this.mode === 'base' ? this.BPM_BASE : this.BPM[Math.max(1, Math.min(4, this.tier))]; },

  /* サーブした瞬間に呼ぶ */
  start(){
    if(this.playing || !Audio_.on) return;
    this.mode = 'base';
    if(Loop.play('base')){ this.playing = true; return; }
    this.playing = true; this.step = 0;
    this.nextT = Audio_.ctx.currentTime + 0.06;
    this.timer = setInterval(()=>this._pump(), 25);
  },
  /* 段が 0→1 で確変へ、1→0 で BASE へ戻る。
     ただし短時間で往復すると曲がしゃくり上げるので、最低2.5秒は居座らせる */
  setTier(n){
    this.tier = n;
    const want = n > 0 ? 'kakuhen' : 'base';
    if(!this.playing){ if(n > 0) this.start(); }
    if(this.mode === want){ Stems.setTier(n); return; }
    const now = Audio_.ctx ? Audio_.ctx.currentTime : 0;
    if(this._switchedAt != null && now - this._switchedAt < 2.5){ Stems.setTier(n); return; }
    this._switchedAt = now;
    this.mode = want;
    this.step = 0;                                     // 曲が変わるので頭から
    if(Loop.play(want)) { Stems.setTier(n); return; }
    if(Audio_.ctx) this.nextT = Audio_.ctx.currentTime + 0.02;
    Stems.setTier(n);
  },
  stop(){
    if(!this.playing) return;
    this.playing = false; this.mode = null;
    Loop.stop(); Stems.stop();
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
  },
  _pump(){
    if(!this.playing || !Audio_.on || Stems.playing) return;
    if(Loop.has(this.mode)) return;      // その曲は実ファイルが鳴っているので合成しない
    const now = Audio_.ctx.currentTime;
    const s16 = (60 / this.bpm()) / 4;                 // 16分音符の長さ
    let guard = 0;
    while(this.nextT < now + 0.22 && guard++ < 64){   // 先読み0.22秒。短いと処理が詰まった時に音が途切れる
      if(this.mode === 'base') this._stepBase(this.step, this.nextT);
      else                     this._step(this.step, this.nextT);
      this.nextT += s16; this.step++;
    }
    if(this.nextT < now) this.nextT = now + 0.02;      // 復帰時の暴走防止
  },

  /* BASE：張りつめて待つ曲。低い脈・薄いパッド・まばらな鐘だけ。
     ここで音を詰めると確変に切り替わったときの落差が消える */
  _stepBase(step, t){
    const bar = Math.floor(step/16) % 4;
    const k = step % 16;
    const ch = this.PROG_B[bar];
    if(k === 0){
      Audio_.sub({t, freq: mtof(ch[0]-24), to: mtof(ch[0]-24)*0.94, dur: 1.9, vol: 0.42, atk: 0.05});
      for(const m of ch)
        Audio_.v({freq: mtof(m), t, dur: 2.4, type:'triangle', vol: 0.030, q:1,
                  cut: 820, cutEnd: 460, cutT: 2.0, bus: Audio_.busMusic, send: 0.55,
                  pan: (m % 3 - 1) * 0.35});
    }
    if(k === 8 && bar % 2 === 0)
      Audio_.v({freq: mtof(ch[1]+12), t, dur: 1.4, type:'sine', vol: 0.048,
                cut: 4200, bus: Audio_.busMusic, send: 0.62, pan: 0.34});
    if(k === 6 && bar === 3)
      Audio_.v({freq: mtof(ch[2]+19), t, dur: 1.8, type:'sine', vol: 0.040,
                cut: 5000, bus: Audio_.busMusic, send: 0.66, pan: -0.30});
    if(step % 64 === 44)
      Audio_.n({t, dur: 1.1, vol: 0.038, cut: 380, cutEnd: 2400, curve: 1.5,
                bus: Audio_.busMusic, send: 0.58});
  },

  _step(step, t){
    const tier = Math.max(1, Math.min(4, this.tier));
    const bar = Math.floor(step/16) % 4;
    const k = step % 16;
    const ch = this.PROG[bar];

    if(k % 4 === 0){ Audio_.kickAt(t); Audio_.bassAt(ch[0]-24, t); }   // 4つ打ち＋ベース

    if(tier >= 2){
      const every = tier >= 3 ? 1 : 2;
      if(k % every === 0){
        const i = Math.floor(k/every) % 8;
        const seq = [0,1,2,0,1,2,1,0], oct = [0,0,0,12,12,12,12,12];
        const pan = [-0.5,-0.2,0.1,0.4,0.5,0.2,-0.1,-0.4][i];   // 左右に散らす
        Audio_.arpAt(ch[seq[i]] + oct[i], t, tier>=4?.11:.09, tier>=4?.20:.15, pan);
      }
    }
    if(tier >= 3 && k % 2 === 1) Audio_.hatAt(t, .09, (k%4===1)?-0.35:0.35);
    if(tier >= 4){
      if(k % 8 === 0) Audio_.leadAt(ch[2]+24, t);
      if(k % 16 === 8) Audio_.n({t, dur:.14, vol:.10, cut:2200, cutEnd:9000, send:.4});
    }
  }
};

/* ゲームの終わり。CRASH には入らない（CRASH はオペの N キーだけが出す合図）。
   紗幕がフライアウトする合図なので、裏で Roar の5人が配置につく前に自動で出てはいけない */
function finishRun(kind){
  if(G.state === 'result') return;
  G.result = kind; G.resultT = 0; G.state = 'result';
  if(!Intro.el) Intro.mount();
  G.cleared = (kind === 'clear');
  G.shatterQueue = [];
  Audio_.lastOneOff();
  if(kind === 'clear'){
    Audio_.clear();
    CAM.shake = 1; G.fx.flash = Math.max(G.fx.flash, .34);
    // 残っているブロックを下から順に崩す。演者に返す前の「壊しきった」画
    G.shatterQueue = G.bricks.filter(b => !b.dead && !b.solid)
                             .sort((a,b) => (b.y - a.y) || (a.x - b.x));
    if(G.core) for(let i=0;i<G.core.parts.length;i++){
      const pp=[0,0]; const pr = corePartPos(G.core, i, pp);
      for(let k=0;k<70;k++) sparkAt(pp[0], pp[1], k%3 ? C.terracotta : C.ink, 1);
    }
  } else {
    Audio_.over(); Audio_.powerDown();
    CAM.shake = .55;
  }
  Music.setTier(0);
  /* ★玉が止まった。ここから先は見せるだけなので、次に喋るぶんをいま焼く（2026-09-22） */
  if(G.act === 'break') Intro.prebakeNext();
  /* ★2026-09-21：結果のひとことを鳴らす。**ここまで一度も配線されていなかった**ので、
     「一人目、ありがとうございました。気をつけて席に戻してあげてください。」が
     本番で一度も流れないところだった（坂田「お客さんを席に返す指示が出なかった」）。
     音と画が落ち着いてから喋らせたいので 1.4 秒待つ。 */
  ResultVoice.fire(kind);
}

/* BREAK が終わった時のフリッキー。クリア／時間切れ／玉切れ の3種。
   交代の一言（SwapCall）と同じ作り＝顔は出さず、声と字幕だけ */
const ResultVoice = {
  STEM: { clear:'jp_game_result_clear', timeup:'jp_game_result_timeup', over:'jp_game_result_over' },
  raw:{}, buf:{}, subs:{}, t0:0, playing:false, kind:null, waitT:0, pending:null,
  load(){
    for(const k in this.STEM){
      if(this.raw[k] !== undefined) continue;
      const stem = this.STEM[k]; this.raw[k] = null;
      fetch('flekky/voice/out/' + stem + '.mp3' + VOICE_V).then(r=>r.ok?r.arrayBuffer():null)
        .then(ab=>{ this.raw[k] = ab; }).catch(()=>{});
      fetch('flekky/subs/' + stem + '.json' + VOICE_V).then(r=>r.json()).then(j=>{ this.subs[k] = j; }).catch(()=>{});
    }
  },
  ready(){ let n=0; for(const k in this.STEM) if(this.raw[k]) n++; return n; },
  fire(kind){
    if(!this.STEM[kind]) kind = 'timeup';
    this.pending = kind; this.waitT = 1.4;         // 音と画が落ち着いてから
  },
  async start(kind){
    const c = Audio_.ctx;
    if(!this.buf[kind] && this.raw[kind] && c){
      try{ this.buf[kind] = await c.decodeAudioData(this.raw[kind].slice(0)); }catch(e){}
    }
    this.kind = kind; this.t0 = c ? c.currentTime : performance.now()/1000;
    if(this.buf[kind] && c && Audio_.comp){
      const src = c.createBufferSource(); src.buffer = this.buf[kind];
      const g = c.createGain(); g.gain.value = 1.15;
      src.connect(g); g.connect(Audio_.comp);
      src.start(this.t0); this.src = src;
      Audio_.duckBefore(0.15, 0.55, 0.4);
    }
    this.playing = true;
  },
  update(dt){
    if(this.waitT > 0){
      this.waitT -= dt;
      if(this.waitT <= 0 && this.pending){ const k = this.pending; this.pending = null; this.start(k); }
    }
  },
  line(){
    if(!this.playing || !this.subs[this.kind]) return null;
    const c = Audio_.ctx;
    const t = (c ? c.currentTime : performance.now()/1000) - this.t0;
    const S = this.subs[this.kind];
    if(t > S.duration + 0.3){ this.playing = false; return null; }
    for(const l of S.lines) if(t >= l.t0 - 0.05 && t <= l.t1 + 0.4) return l;
    return null;
  },
  reset(){ try{ this.src && this.src.stop(); }catch(e){} this.src=null;
           this.playing=false; this.pending=null; this.waitT=0; }
};

/* 段の境目。数字でなく「音が増えた」で分かるようにする */
/* パドルで切れなくなったのでコンボは伸びる（実測：最小28／中央67／最大101）。
   旧しきい値 3/7/12/20 のままだと20超えで延々と段4になり、
   段4の「白く脈打つ」が効かなくなる（慣れる）。分布に合わせて引き直した。
   段1は低く＝確変にはすぐ入る。段4(100)は中央値109にほぼ届く高さ＝終盤の上澄みだけ */
/* 節目の音型。BREAK の段・GATE の段・CRASH の入口で毎回同じものを鳴らす */
/* ★曲の段の下限（2026-09-22/25）。
   コンボで上下する段とは別に、「ここぞ」の場面では**下がらない確変**にしておきたい。
     ・ブロック崩し … 壁が全部落ちてコアだけになった時
     ・GATE        … どちらかが6点（マッチポイント）
   コンボ由来の段がこれを下回っても、この下限までは必ず上げる。 */
function musicTier(t){
  const floor = (G && G.tierFloor) || 0;
  const n = Math.max(t, floor);
  G.comboTier = n; Music.setTier(n);
  return n;
}
function setTierFloor(n, why){
  if(!G || (G.tierFloor || 0) >= n) return;
  G.tierFloor = n;
  musicTier(G.comboTier || 0);
  markTier(n);
  Audio_.riser(4); Audio_.duckBefore(0.28, 0.5, 0.75);
  G.fx.flash = Math.max(G.fx.flash, .26);
  CAM.shake = Math.max(CAM.shake, .7);
  if(why) toast(why);
}

function markTier(t){
  if(t <= 0) return;
  Audio_.motif(0.55 + 0.12*t);
  Audio_.duckBefore(0.18, 0.55, 0.45);
}

function comboTier(c){ return c>=160 ? 4 : c>=135 ? 3 : c>=100 ? 2 : c>=65 ? 1 : 0; }
const TIER_COL = ['#63b6cc','#63b6cc','#c7a01d','#bd2e1e','#f0ece0'];
function rgba(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ══════════════════════════════════════════════════════════════
   1c. パーティクル場
   公式KVのエディタ（haribow-go-beyond/lab/particles.html）と同じ物理を持ってくる。
     ・中心への 1/r² 重力（近いほど急加速）
     ・ケプラーの接線速度 v = sqrt(G/r)（内側ほど速い）
     ・ゆるやかな回転(swirl)と流れ場(flow)で漂わせる
     ・ターゲットへは減衰バネで着地（gather を 0→1 で上げる）
   ★固定リングのような非物理な動きは使わない。爆発は 1/r²、着地はバネ。
   色も同じ：ティール(0.30,0.62,0.74) → クリーム(0.86,0.83,0.72) の加算合成。
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   3D空間 ── カメラと透視投影
   ゲームの当たり判定は今まで通り 1920x1080 の平面座標で行い、
   描画だけを3Dに持ち上げる。z が増える＝奥。
   深度キュー（近い=大/明るい、遠い=小/淡い）＋カメラのゆっくりした移動で
   立体に見える。静止画では分からず、動きで立体になる。
   ══════════════════════════════════════════════════════════════ */
const CAM = {
  F: 1400, Z0: 1400,
  x:0, y:0, z:0, t:0, shake:0,
  update(dt){
    this.t += dt;
    const t = this.t;
    /* カメラは漂わせない（坂田指示 2026-08-28）。
       実測：ドリフト最悪時に左壁ぎわのボールが画面外 -105px まで出ていた。
       ゲームとして球が見えなくなるのは論外なので、平行移動もズームもしない。
       立体感はブロックの側面と粒子の奥行きが担う。 */
    this.x = 0; this.y = 0; this.z = 0;
    if(this.shake > 0){
      this.shake = Math.max(0, this.shake - dt*3.2);
      const k = this.shake*this.shake;
      // 揺れは衝撃の手応え。ただし球が壁際でも切れない範囲に抑える
      this.x += (Math.random()-.5)*22*k;
      this.y += (Math.random()-.5)*20*k;
    }
  },
  /* 世界座標 → 画面。戻り値は縮尺（0以下なら描かない） */
  proj(wx, wy, wz, out){
    const dz = wz - this.z;
    if(dz < 90) return 0;
    const s = this.F / dz;
    out[0] = W/2 + (wx - this.x) * s;
    out[1] = H/2 - (wy - this.y) * s;
    return s;
  },
  /* 奥ほど霞む */
  fog(wz){ return Math.max(0.10, Math.min(1, Math.exp(-(wz - this.Z0*0.55) * 0.00072))); }
};
/* 平面座標 → 世界座標 */
const fwx = fx => fx - W/2;
const fwy = fy => -(fy - H/2);
const BRICK_D = 46;                 // ブロックの厚み
const PLANE_Z = CAM.Z0;             // ロゴが乗る面

/* 3Dの発散ゼロ流れ場（ベクトルポテンシャルの curl）。
   cos 6回だけで渦を巻く立体的な流れになる */
function curl3(x, y, z, t, out){
  const k1 = 0.0021, k2 = 0.0047, A1 = 1.0, A2 = 0.42;
  out[0] = -(A1*k1*Math.cos(z*k1 + t*0.23) + A2*k2*Math.cos(z*k2 - t*0.41));
  out[1] = -(A1*k1*Math.cos(x*k1 - t*0.19) + A2*k2*Math.cos(x*k2 + t*0.37));
  out[2] = -(A1*k1*Math.cos(y*k1 + t*0.17) + A2*k2*Math.cos(y*k2 - t*0.33));
}

/* ══ まとめ描き（2026-09-16 坂田「重すぎで見れない」）════════════
   粒を1個ずつ globalAlpha → beginPath → arc → fill すると、
   ROAR 4,600粒×2層だけで1フレーム1万回近い描画命令になり、GPU側で詰まっていた。
   「色 × 明るさ8段階」ごとに1本のパスへ積んで、1回で塗る（加算合成なので順番は関係ない）。 */
/* 粒の点描は WebGL で描く。Canvas 2D だと 3,600粒の円で約8ms、
   WebGL の点スプライトなら1ms未満。描いた結果は 2D 側へ drawImage で加算合成する（見た目の重なり順は従来どおり）。
   WebGL が使えない環境では Batch（2D のまとめ描き）に落ちる */
/* 軽量モード。本番PCがこのMacより非力でも止まって見えないための安全弁。
   実フレーム間隔が 22ms（45fps）を超える状態が合計0.8秒続いたら入り、その回の公演中は戻さない
   （途中で行ったり来たりすると見た目が揺れる）。入ったら：ブルームのぼかしを省く／粒を半分描く／破片の尾を省く */
/* ★2026-09-21 坂田「fpsもっと下げていいかも カクカク。表示も重ければ多少軽量化しよう」
   ・`cap` … 描くコマ数の上限。**ばらつく55fpsより、揃った30fpsの方が滑らかに見える。**
     物理は上限と関係なく進むので、当たり判定や尺は変わらない（描く回数だけ減らす）
   ・`forced` … 自動を待たずに手で軽量へ（K キー／op画面から）
   本番で迷わないよう、どちらも op.html に出す */
/* ══════════════════════════════════════════════════════════════
   Quality ── 絵の段（坂田 2026-09-22
   「軽量化モードをデフォにして、行ける範囲で描写をよくしていこう」）

   これまでは**重い方から始めて、追いつかなければ安くする**作りだった。
   その判定が読み込み中にも働いて、客が何か見る前に勝手に安い絵へ落ち、
   しかも一度落ちたら戻らなかった。つまり「いちばん重い設定で作って、事故ったら劣化」。

   ここからは逆にする。**いちばん軽い段から始めて、余裕がある分だけ足していく。**
   足して保てなければ1段戻り、その段には二度と上がらない（行ったり来たりさせない）。
   どこで落ち着いたかは記録に残るので、本番当日の実機で何段まで行けるか分かる。

     段0 かるい  … 粒子の尾なし／リング簡略／CRASHのグリッチ粗め   ← 既定
     段1 ふつう  … 粒子の尾あり／リング本来の描き方
     段2 リッチ  … ＋ 残像とぼかし（坂田が「仕方ねえ」と落としたやつ）

   判定するのは**客が遊んでいる間だけ**。読み込み中・待機中・フリッキーの段では触らない。
   ══════════════════════════════════════════════════════════════ */
const Q_MAX = 2;
const Q_NAME = ['かるい', 'ふつう', 'くっきり'];
/* ★段2の中身（2026-09-22・坂田「紗幕に映るので色は少しまあまあはっきり写っててもいいかも。
   滲みなどはなしで」）。
   紗幕は光が散るので、モニタで見た通りの色は**必ず眠くなる**。そこで彩度と明暗差を上げる。
   逆に**滲み（ブルーム）は足さない**。散る布の上でにじませると、形そのものが溶ける。
   だから段2は「残像＋ぼかし」ではなく「色を濃く・輪郭を立てる」に置き換えた。 */
const Q_FILTER = ['', '', 'saturate(1.28) contrast(1.10)'];
const Quality = {
  /* ★既定を段2にした（2026-09-22・坂田「最初から段2にしてみようかな」）。
     追いつかなければ勝手に下がる＝安全弁はそのまま効く。 */
  level:Q_MAX, ceiling:Q_MAX,      // ceiling ＝ 一度保てなかった段より下に蓋をする
  slow:0, fast:0, forced:false, cap:0, lastDraw:0,   // cap 0=上限なし／30 なら30fps
  get low(){  return this.level < 1; },              // 既存の呼び出しと互換
  get rich(){ return this.level >= 2; },             // 残像とぼかし
  set(n, why){
    n = Math.max(0, Math.min(this.ceiling, n));
    if(n === this.level) return;
    this.level = n; this.slow = 0; this.fast = 0;
    this.apply();
    console.info('[BREAK BEYOND] 絵の段 → ' + Q_NAME[n] + '（' + why + '）');
  },
  /* 色の出方はキャンバスに掛ける（描き方を段ごとに書き分けない＝事故らない） */
  apply(){
    try{ const c = document.getElementById('cv');
         if(c) c.style.filter = Q_FILTER[this.level] || ''; }catch(e){}
  },
  sample(ms){
    if(this.forced) return;                          // K キーで手動固定している時は触らない
    if(document.visibilityState !== 'visible' || ms > 250) return;
    if(LOOP_SLOW) return;                            // 10Hz は「遅い」のではなく、そうしている
    if(!G || G.act === 'intro' || G.state !== 'play') return;   // 遊んでいる間だけ見る
    if(ms > 22){ this.slow += ms/1000; this.fast = 0; }
    else if(ms < 18){ this.fast += ms/1000; this.slow = Math.max(0, this.slow - ms/4000); }
    /* 保てなかった → 1段戻して、その段に蓋をする */
    if(this.slow > 0.8 && this.level > 0){
      this.ceiling = this.level - 1;
      this.set(this.level - 1, '追いつかなかった');
    }
    /* 5秒ずっと余裕がある → 1段足してみる */
    else if(this.fast > 5 && this.level < this.ceiling){
      this.set(this.level + 1, '余裕があった');
    }
  },
  setForced(v){ this.forced = v; this.level = v ? 0 : this.level; this.slow = 0; this.fast = 0; },
  name(){ return Q_NAME[this.level] + (this.forced ? '(手動固定)' : '')
                + (this.ceiling < Q_MAX ? ' 上限' + Q_NAME[this.ceiling] : ''); },
  /* 上限を超えて描こうとしていないか。true なら今回は描かない */
  skipDraw(now){
    if(!this.cap) return false;
    const need = 1000/this.cap - 1.5;                   // 1.5ms の余裕＝取りこぼさない
    if(now - this.lastDraw < need) return true;
    this.lastDraw = now; return false;
  }
};

const GLPoints = {
  ok:false, cv:null, gl:null, buf:null, data:null, n:0, cap:0, loc:null, colCache:new Map(),
  init(){
    try{
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const gl = cv.getContext('webgl', { alpha:true, premultipliedAlpha:true, antialias:false, preserveDrawingBuffer:true });
      if(!gl) return;
      const sh = (type, src)=>{ const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
        if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER,
        'attribute vec2 p; attribute float s; attribute vec4 c; varying vec4 vc;' +
        'void main(){ gl_Position = vec4(p.x/' + W + '.0*2.0-1.0, 1.0-p.y/' + H + '.0*2.0, 0.0, 1.0);' +
        ' gl_PointSize = max(1.0, s); vc = c; }'));
      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER,
        'precision mediump float; varying vec4 vc;' +
        'void main(){ float r = length(gl_PointCoord - 0.5) * 2.0; float a = vc.a * (1.0 - smoothstep(0.55, 1.0, r));' +
        ' gl_FragColor = vec4(vc.rgb * a, a); }'));
      gl.linkProgram(pr);
      if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
      gl.useProgram(pr);
      this.loc = { p:gl.getAttribLocation(pr,'p'), s:gl.getAttribLocation(pr,'s'), c:gl.getAttribLocation(pr,'c') };
      this.buf = gl.createBuffer();
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);      // 加算
      gl.viewport(0, 0, W, H);
      this.cv = cv; this.gl = gl; this._grow(8192); this.ok = true;
    }catch(e){ this.ok = false; OpLink.error('WebGL points off: ' + (e.message || e)); }
  },
  _grow(cap){ const d = new Float32Array(cap*7); if(this.data) d.set(this.data.subarray(0, this.n*7)); this.data = d; this.cap = cap; },
  _rgb(col){
    let v = this.colCache.get(col);
    if(!v){
      let m;
      if((m = /^#([0-9a-f]{6})$/i.exec(col))) v = [0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)/255);
      else if((m = /^#([0-9a-f]{3})$/i.exec(col))) v = [0,1,2].map(i=>parseInt(m[1][i]+m[1][i],16)/255);
      else if((m = /rgba?\(([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i.exec(col))) v = [m[1]/255, m[2]/255, m[3]/255];
      else v = [0.94, 0.93, 0.88];                       // 読めない色はクリームにしておく（消えるよりまし）
      this.colCache.set(col, v);
    }
    return v;
  },
  /* 数万粒を一気に積む用。色は [r,g,b]（0-1）で渡す。Map も文字列も通らない */
  ensure(extra){ if(this.n + extra > this.cap) this._grow(Math.max(this.cap*2, this.n + extra)); },
  raw(x, y, size, r, g, b, a){
    const d = this.data, i = this.n*7;
    d[i]=x; d[i+1]=y; d[i+2]=size; d[i+3]=r; d[i+4]=g; d[i+5]=b; d[i+6]=a;
    this.n++;
  },
  dot(col, a, x, y, r){
    if(a < 0.012) return;
    if(this.n >= this.cap) this._grow(this.cap*2);
    const c = this._rgb(col), d = this.data, i = this.n*7;
    d[i]=x; d[i+1]=y; d[i+2]=r*2; d[i+3]=c[0]; d[i+4]=c[1]; d[i+5]=c[2]; d[i+6]=Math.min(1,a);
    this.n++;
  },
  /* 積んだ点を描いて g に加算で貼る。g に掛かっている変換（FX層の縮小）はそのまま効く */
  flush(g){
    if(!this.n) return;
    const gl = this.gl, L = this.loc;
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.subarray(0, this.n*7), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(L.p); gl.vertexAttribPointer(L.p, 2, gl.FLOAT, false, 28, 0);
    gl.enableVertexAttribArray(L.s); gl.vertexAttribPointer(L.s, 1, gl.FLOAT, false, 28, 8);
    gl.enableVertexAttribArray(L.c); gl.vertexAttribPointer(L.c, 4, gl.FLOAT, false, 28, 12);
    gl.drawArrays(gl.POINTS, 0, this.n);
    this.n = 0;
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 1;
    g.drawImage(this.cv, 0, 0, W, H);
    g.restore();
  }
};

const Batch = {
  LV: 8, dots: new Map(), lines: new Map(),
  _get(map, key){ let a = map.get(key); if(!a){ a = []; map.set(key, a); } return a; },
  dot(col, a, x, y, r){
    if(GLPoints.ok){ GLPoints.dot(col, a, x, y, r); return; }
    if(a < 0.012) return;
    const lv = Math.min(this.LV-1, (Math.min(1,a)*this.LV)|0);
    const arr = this._get(this.dots, col + '|' + lv); arr.push(x, y, r);
  },
  line(col, a, x0, y0, x1, y1, w){
    if(a < 0.012) return;
    const lv = Math.min(this.LV-1, (Math.min(1,a)*this.LV)|0);
    const wb = w < 2 ? 1 : w < 4 ? 3 : 5;          // 線幅も3段にまとめる
    const arr = this._get(this.lines, col + '|' + lv + '|' + wb); arr.push(x0, y0, x1, y1);
  },
  flush(g){
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    if(GLPoints.ok){ g.restore(); this._flushLines(g); GLPoints.flush(g); return; }
    for(const [key, arr] of this.lines){
      if(!arr.length) continue;
      const [col, lv, wb] = key.split('|');
      g.globalAlpha = (+lv + 0.5) / this.LV; g.strokeStyle = col; g.lineWidth = +wb;
      g.beginPath();
      for(let i=0;i<arr.length;i+=4){ g.moveTo(arr[i], arr[i+1]); g.lineTo(arr[i+2], arr[i+3]); }
      g.stroke(); arr.length = 0;
    }
    this._drawDots(g);
    g.restore(); g.globalAlpha = 1;
  },
  _flushLines(g){
    let any = false;
    for(const arr of this.lines.values()) if(arr.length){ any = true; break; }
    if(!any) return;
    g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
    for(const [key, arr] of this.lines){
      if(!arr.length) continue;
      const [col, lv, wb] = key.split('|');
      g.globalAlpha = (+lv + 0.5) / this.LV; g.strokeStyle = col; g.lineWidth = +wb;
      g.beginPath();
      for(let i=0;i<arr.length;i+=4){ g.moveTo(arr[i], arr[i+1]); g.lineTo(arr[i+2], arr[i+3]); }
      g.stroke(); arr.length = 0;
    }
    g.restore(); g.globalAlpha = 1;
  },
  _drawDots(g){
    for(const [key, arr] of this.dots){
      if(!arr.length) continue;
      const i0 = key.indexOf('|');
      g.globalAlpha = (+key.slice(i0+1) + 0.5) / this.LV; g.fillStyle = key.slice(0, i0);
      g.beginPath();
      for(let i=0;i<arr.length;i+=3){
        const x = arr[i], y = arr[i+1], r = arr[i+2];
        if(r < 1.6) g.rect(x - r, y - r, r*2, r*2);          // 小さい粒は四角で十分（円より軽い）
        else { g.moveTo(x + r, y); g.arc(x, y, r, 0, 6.2832); }
      }
      g.fill(); arr.length = 0;
    }
  }
};

/* ══════════════════════════════════════════════════════════════
   粒子 ── 背景には置かない。ブロックそのものが砕けて粒子になる。
   壊れる＝dissolve（ブロックの体積から発生して流れ場に散る）
   巻き戻し＝assemble（元の位置へ減衰バネで戻る）
   ══════════════════════════════════════════════════════════════ */
/* MAX は同時に持てる粒の数。WebGL で描くようになったので増やした（巻き戻しで字が組み上がる所のため） */
const PF = { FLOW: 210, RELAX: 1.5, DAMP: 0.988, SPRING: 7.2, MAX: 9000 };

const Particles = {
  p: [], gather: 0, t: 0, _c: [0,0,0], _o: [0,0],

  init(){ this.p.length = 0; this.gather = 0; },
  count(){ return this.p.length; },

  /* ブロックが砕ける。ブロックの体積の中から発生し、
     当たった向きへ飛び、流れ場に馴染んでいく */
  shatter(b, nx, ny, power, col){
    const n = Math.min(46, Math.max(14, Math.round(26 * (power||1))));
    const cx = fwx(b.x + b.w/2), cy = fwy(b.y + b.h/2);
    for(let i=0;i<n && this.p.length<PF.MAX;i++){
      const ox = (Math.random()-.5)*b.w, oy = (Math.random()-.5)*b.h,
            oz = (Math.random()-.5)*BRICK_D;
      const sp = (140 + Math.random()*330) * (power||1);
      const a = Math.random()*6.283, el = (Math.random()-.5)*1.5;
      this.p.push({
        x: cx+ox, y: cy+oy, z: PLANE_Z+oz,
        vx: Math.cos(a)*Math.cos(el)*sp + (nx||0)*sp*0.7,
        vy: Math.sin(a)*Math.cos(el)*sp - (ny||0)*sp*0.7,
        vz: Math.sin(el)*sp*1.15 - 90,          // 少し手前に飛ばす＝立体が出る
        px: cx+ox, py: cy+oy, pz: PLANE_Z+oz,
        tx:null, ty:null, tz:null,
        life: 1.5 + Math.random()*1.6, max: 3.1,
        sz: 3.4 + Math.random()*5.2,
        col: col || C.brick[0],
        s: Math.random()
      });
    }
  },

  /* 巻き戻し：壊れたブロックの位置へ戻す。近い点どうしを組む */
  seedAssemble(bricks, per){
    this.p.length = 0;
    for(const b of bricks){
      const cx = fwx(b.x + b.w/2), cy = fwy(b.y + b.h/2);
      for(let i=0;i<per && this.p.length<PF.MAX;i++){
        const a = Math.random()*6.283, el=(Math.random()-.5)*2.2,
              R = 420 + Math.random()*900;
        const x = cx + Math.cos(a)*Math.cos(el)*R,
              y = cy + Math.sin(a)*Math.cos(el)*R*0.7,
              z = PLANE_Z + Math.sin(el)*R*0.8;
        this.p.push({
          x, y, z, px:x, py:y, pz:z,
          vx:(Math.random()-.5)*120, vy:(Math.random()-.5)*120, vz:(Math.random()-.5)*120,
          tx: cx + (Math.random()-.5)*b.w,
          ty: cy + (Math.random()-.5)*b.h,
          tz: PLANE_Z + (Math.random()-.5)*BRICK_D,
          life:-1, max:1, sz: 3.2 + Math.random()*4.4,
          col: b.solid ? C.solid : C.brick[Math.min(3, b.max-1)],
          s: Math.random()
        });
      }
    }
  },

  step(dt){
    this.t += dt;
    const g = this.gather, drift = 1 - g;
    const damp = Math.pow(PF.DAMP - 0.14*g, dt*60);
    const c = this._c, tt = this.t;
    for(let i=this.p.length-1;i>=0;i--){
      const o = this.p[i];
      o.px = o.x; o.py = o.y; o.pz = o.z;
      if(drift > 0.02){
        curl3(o.x, o.y, o.z, tt, c);
        const k = Math.min(1, PF.RELAX * drift * dt);
        o.vx += (c[0]*PF.FLOW*1000 - o.vx)*k;
        o.vy += (c[1]*PF.FLOW*1000 - o.vy)*k;
        o.vz += (c[2]*PF.FLOW*1000 - o.vz)*k;
      }
      if(g > 0.02 && o.tx !== null){
        const sp = PF.SPRING * g;
        o.vx += (o.tx - o.x)*sp*dt; o.vy += (o.ty - o.y)*sp*dt; o.vz += (o.tz - o.z)*sp*dt;
      }
      if(o.life > 0) o.vy -= 210*dt;          // 破片にはわずかな重さ。上に溜まらせない
      o.vx *= damp; o.vy *= damp; o.vz *= damp;
      o.x += o.vx*dt; o.y += o.vy*dt; o.z += o.vz*dt;
      if(o.life > 0){ o.life -= dt; if(o.life <= 0) this.p.splice(i,1); }
    }
  },

  drawBehind(){ this._draw(z => z >= PLANE_Z, ctx); },
  drawFront(){  this._draw(z => z <  PLANE_Z, ctx); },
  draw(){ this._draw(null, ctx); },
  /* 残像レイヤーへ。ここに描いた分が尾を引いて光る */
  drawFX(g, k){
    g.save(); g.scale(k,k);
    this._draw(null, g);
    g.restore();
  },
  _draw(filter, ctx){
    if(!this.p.length) return;
    const o2 = this._o, p2 = [0,0];
    const nCore = this.p.length < 900;      // 芯を描くか
    /* 加算合成なので奥行き順の並べ替えは不要（旧：毎回 sort していた） */
    for(const o of this.p){
      if(filter && !filter(o.z)) continue;
      const sc = CAM.proj(o.x, o.y, o.z, o2);
      if(sc <= 0) continue;
      const fade = o.life > 0 ? Math.min(1, o.life/o.max) : 1;
      const a = fade * CAM.fog(o.z) * (0.55 + o.s*0.45);
      if(a < 0.01) continue;
      const r = Math.max(0.6, o.sz * sc);
      // 動きの筋（前フレームからの線）＝速さが見える
      const ps = CAM.proj(o.px, o.py, o.pz, p2);
      /* 粒が多い場面では尾の線を省く（線は1本ずつ 2D で引くので数千本になると重い） */
      if(!Quality.low && this.p.length < 2500 && ps > 0 && (Math.abs(p2[0]-o2[0]) + Math.abs(p2[1]-o2[1])) > 1.5){
        Batch.line(o.col, a*0.5, p2[0], p2[1], o2[0], o2[1], r*0.9);
      }
      Batch.dot(o.col, a, o2[0], o2[1], r);
      /* ★芯は数が少ない時だけ（2026-09-21）。
         粒1個につき2つ描いていたので、2600粒なら5200回。
         数千粒が飛んでいる場面では芯は見えない（重なって潰れる）ので、そこでは省く。 */
      if(nCore) Batch.dot(C.ink, a*0.85, o2[0], o2[1], r*0.42);   // 芯（小さく。巨大グローは禁）
    }
    Batch.flush(ctx);
  }
};

/* ══════════════════════════════════════════════════════════════
   1d. エフェクト層
   ① 残像（fade canvas）── 毎フレーム消さずに黒を薄く重ねる。
      粒子が勝手に光の尾を引く（teamlab-cg-blender.md の実践更新）
   ② 衝撃波リング ── ブロックが砕けた位置から3Dで広がる輪
   ③ ブルーム ── 残像層を一度ぼかして加算で重ねる
   ══════════════════════════════════════════════════════════════ */
const FX = {
  cv:null, g:null, bl:null, bg:null, mix:null, mg:null, rings:[], SCALE:0.5,
  /* ★2026-09-21 坂田「（残像＋ぼかし）なくすか ゲームから。仕方ねえ」
     残像とぼかしは **1920×1080 への加算合成**で、どう詰めても毎コマ数ミリ秒かかる。
     ゲーム中（BREAK / GATE）は切って、**粒子は本体のキャンバスに直に描く**。
     **CRASH だけは残す。**ロゴが粒になる所・ROAR の渦は残像が絵の本体で、
     しかもあそこは演出なので60fpsを張る必要がない。
     切り替えは `G.act` を見て自動（`on()`）。手で触る所は無い。 */
  /* 残像とぼかしは CRASH だけ。段2は「色をはっきり」であって「にじませる」ではない
     （2026-09-22 坂田「滲みなどはなしで」）。 */
  on(){ return G && G.act === 'crash'; },

  init(){
    /* ★キャンバスは1回だけ作る（2026-09-21）。
       ここは setMode のたびに呼ばれるので、毎回 createElement していると
       **モード切替の1コマ目が重くなる**（坂田「ブロック崩しの一発目 重すぎる」）。
       2回目からは中身を消すだけ。 */
    if(this.cv){
      this.g.setTransform(1,0,0,1,0,0); this.g.globalAlpha = 1;
      this.g.globalCompositeOperation = 'source-over';
      this.g.clearRect(0,0,this.cv.width,this.cv.height);
      this.bg.setTransform(1,0,0,1,0,0); this.bg.globalAlpha = 1;
      this.bg.globalCompositeOperation = 'source-over';
      this.bg.clearRect(0,0,this.bl.width,this.bl.height);
      this.rings.length = 0; this.extra = null; this.fade = 0.22;
      return;
    }
    this.cv = document.createElement('canvas');
    this.cv.width = Math.round(W*this.SCALE); this.cv.height = Math.round(H*this.SCALE);
    this.g = this.cv.getContext('2d');
    this.bl = document.createElement('canvas');
    /* ブルームはさらに半分（480×270）でぼかす。ぼかす画なので解像度は要らず、blur の負荷が1/4になる */
    this.bl.width = Math.round(this.cv.width/2); this.bl.height = Math.round(this.cv.height/2);
    this.bg = this.bl.getContext('2d');
    /* 残像とぼかしを混ぜる場所。全画面へ持ち上げる回数を1回に減らすために要る */
    this.mix = document.createElement('canvas');
    this.mix.width = this.cv.width; this.mix.height = this.cv.height;
    this.mg = this.mix.getContext('2d');
    this.rings.length = 0;
  },

  ring(b, col){
    if(this.rings.length > 26) return;
    this.rings.push({
      x: fwx(b.x + b.w/2), y: fwy(b.y + b.h/2), z: PLANE_Z,
      r: 6, v: 620 + Math.random()*260, life: 0.52, max: 0.52, col
    });
  },

  step(dt){
    for(let i=this.rings.length-1;i>=0;i--){
      const o = this.rings[i];
      o.r += o.v*dt; o.v *= Math.pow(0.30, dt); o.life -= dt;
      if(o.life <= 0) this.rings.splice(i,1);
    }
  },

  extra:null,     // 年号など、その場面だけ残像層に乗せたいもの
  fade:0.22,      // 残像の消え方。小さいほど尾が長く残る（HARIBOWが粒になる所で下げる）
  /* 粒子とリングを縮小キャンバスに描き、残像を残す。
     ★切っている間（ゲーム中）は、粒子とリングを**本体のキャンバスへ直に**描いて終わり */
  render(){
    if(!this.on()){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      Particles.drawFX(ctx, 1);              // 縮小しないので等倍
      if(this.extra) this.extra(ctx, 1);
      this.drawRings(ctx, 1);
      ctx.restore(); ctx.globalAlpha = 1;
      return;
    }
    return this._render();
  },
  _render(){
    const g = this.g, k = this.SCALE;
    // 消さずに黒を薄く重ねる＝残像
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = `rgba(7,8,10,${this.fade})`;
    g.fillRect(0,0,this.cv.width,this.cv.height);

    // 粒子を残像レイヤーへ。消さない層なので勝手に尾を引く
    g.globalCompositeOperation = 'lighter';
    Particles.drawFX(g, k);
    if(this.extra) this.extra(g, k);

    this.drawRings(g, k);
  },

  /* 衝撃波リング。残像層にも本体にも同じものを描くので切り出してある */
  drawRings(g, k){
    if(!this.rings.length) return;
    g.save();
    g.scale(k,k);
    g.globalCompositeOperation = 'lighter';
    const o2=[0,0];
    for(const o of this.rings){
      const sc = CAM.proj(o.x, o.y, o.z, o2);
      if(sc <= 0) continue;
      const a = Math.pow(o.life/o.max, 1.6) * 0.40;
      g.globalAlpha = a;
      g.strokeStyle = o.col; g.lineWidth = Math.max(1, 5*sc*(o.life/o.max));
      g.beginPath(); g.ellipse(o2[0], o2[1], o.r*sc, o.r*sc*0.42, 0, 0, 7); g.stroke();
    }
    g.restore();
    g.globalAlpha = 1;
  },

  /* ぼかして加算＝ブルーム。元の層もそのまま重ねる */
  /* ★2026-09-21：**全画面への加算を毎コマ2回やっていた**（残像＋ぼかし）。
     1回あたり約9ms（1920×1080の加算合成）＝合わせて18ms。予算16.7msを単独で超えていた。
     ぼかしは**縮小したまま残像に混ぜて**、全画面へ持ち上げるのは**1回だけ**にする。
     見た目（芯＋にじみ）は変わらない。混ぜるのは 960×540 なので4分の1の面積で済む。 */
  composite(){
    if(!this.on()) return;                   // ★切っている間は全画面への加算をしない
    try{
      // ぼかし（さらに半分に縮めると、その縮小自体がぼかしになる）
      this.bg.clearRect(0,0,this.bl.width,this.bl.height);
      this.bg.globalCompositeOperation = 'source-over'; this.bg.globalAlpha = 1;
      this.bg.drawImage(this.cv, 0, 0, this.bl.width, this.bl.height);
      // 残像のコピーにぼかしを足す（低い解像度のまま）
      const m = this.mix, mg = this.mg;
      mg.globalCompositeOperation = 'source-over'; mg.globalAlpha = 1;
      mg.clearRect(0,0,m.width,m.height);
      mg.drawImage(this.cv, 0, 0, m.width, m.height);
      if(!Quality.low){
        mg.globalCompositeOperation = 'lighter'; mg.globalAlpha = 1.0;
        mg.drawImage(this.bl, 0, 0, m.width, m.height);
        mg.globalCompositeOperation = 'source-over'; mg.globalAlpha = 1;
      }
      // ★全画面への加算はここ1回だけ
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Quality.low ? 0.55 : 0.52;
      ctx.drawImage(m, 0, 0, W, H);
      ctx.restore(); ctx.globalAlpha = 1;
    }catch(e){}
  }
};

/* ══ ヒットストップ ═══════════════════════════════════════════
   衝撃の瞬間に世界を数フレーム止める。Vlambeer「The art of screenshake」で
   最初に挙がる技で、実装1つで一番効く。
   止めすぎると「固まった」と気づかれるので、気づかれない上限（約90ms）を守る。
   止まっている間も描画は続ける＝画が消えない。 */
const HitStop = {
  t:0, cd:0,
  /* ★止めは連鎖させない（実測：25%が0.35秒以内に次が来て、最大3連続。
     これが「操作が重い」の正体だった。性能ではない ── 描画は60fps予算の13%しか使っていない） */
  hit(sec){
    if(this.cd > 0) return;
    this.t = Math.max(this.t, Math.min(0.090, sec));
    this.cd = 0.16;
  },
  /* 実時間 dt を受け取り、ゲームに流していい dt を返す */
  consume(dt){
    if(this.cd > 0) this.cd -= dt;
    if(this.t <= 0) return dt;
    this.t -= dt;
    return 0;
  }
};

/* ══════════════════════════════════════════════════════════════
   2. 入力 ─ キーボード / マウス / ゲームパッド(DualShock 4)
   ══════════════════════════════════════════════════════════════ */
const Input = {
  keys:new Set(), mouseX:null, usedMouse:false,
  padIndex:null, padName:'—', axis:0, actionHeld:false, actionEdge:false,
  _prevAction:false, _prevPause:false, pauseEdge:false, _latch:false, _jLatch:false, padBlocked:false,
  judgeEdge:false, axisY:0, _prevJudge:false, padMapping:'—', padSeen:false,

  init(){
    addEventListener('keydown', e=>{
      if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(e.code)) e.preventDefault();
      this.keys.add(e.code);
      /* ★ラッチを立てるのは「押す＝動かす」キーだけにする（2026-09-22）。
         坂田「左右ボタン押したら連動して落下ボタンも押されてないか？」→ その通りだった。
         以前は**どのキーでも** this._latch=true にしていたので、
         poll() の中の `if(this._latch){ act = true; }` によって
         **←→↑↓ を押しただけで「落とす／打つ」が発火**していた。
         しかもキーリピートで押しっぱなしの間ずっと発火する（実測：5コマで5回）。
         ラッチ自体は「1コマ未満のクリックを取りこぼさない」ために要るので、
         対象を決定キーだけに絞る。 */
      if(e.code === 'Space') this._latch = true;
      // 判定キーも同じラッチが要る。本番の判定者は速く叩くので、
      // 押して離すまでが1フレーム未満だと poll() の合間に消えてしまう
      if(e.code === 'KeyX' || e.code === 'Enter' || e.code === 'NumpadEnter') this._jLatch = true;
    });
    addEventListener('keyup', e=>this.keys.delete(e.code));
    addEventListener('blur', ()=>this.keys.clear());
    const cv = document.getElementById('cv');
    cv.addEventListener('mousemove', e=>{
      if(SHOW) return;
      const r = cv.getBoundingClientRect();
      this.mouseX = (e.clientX - r.left) / r.width * W;
      this.usedMouse = true;
    });
    cv.addEventListener('pointerdown', ()=>{ cv.focus?.(); if(SHOW) return; this.keys.add('Space'); this._latch = true; });
    cv.addEventListener('pointerup',   ()=>{ this.keys.delete('Space'); });
    cv.addEventListener('pointercancel',()=>{ this.keys.delete('Space'); });
    addEventListener('gamepadconnected', e=>{ this.padIndex = e.gamepad.index; this.padName = e.gamepad.id; });
    addEventListener('gamepaddisconnected', ()=>{ this.padIndex = null; this.padName = '—'; });
  },

  poll(){
    // ─ ゲームパッド
    let ax = 0, ayv = 0, act = false, pause = false;
    let gp = null;
    // ★ 埋め込みビューア(iframe)では permissions policy で getGamepads() が
    //   SecurityError を投げる。素で呼ぶとループごと落ちて黒画面になる（実際になった）。
    if(!this.padBlocked){
      try{
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        for(const p of pads){ if(p && p.connected){ gp = p; break; } }
      }catch(err){
        this.padBlocked = true;
        this.padName = 'BLOCKED by permissions policy';
        console.warn('[BREAK BEYOND] gamepad unavailable:', err && err.message);
      }
    }
    if(gp){
      this.padIndex = gp.index; this.padName = gp.id; this.padSeen = true;
      const raw = gp.axes[0] || 0;
      ax = Math.abs(raw) > 0.14 ? (raw - Math.sign(raw)*0.14) / 0.86 : 0;   // デッドゾーン＋再正規化
      const rawY = gp.axes[1] || 0;                                          // 縦＝バーの型を選ぶ
      ayv = Math.abs(rawY) > 0.14 ? (rawY - Math.sign(rawY)*0.14) / 0.86 : 0;
      this.padMapping = gp.mapping || 'non-standard';
      const b = gp.buttons;
      const down = i => b[i] && b[i].pressed;
      if(down(14)) ax = -1;            // D-pad 左
      if(down(15)) ax =  1;            // D-pad 右
      if(down(12)) ayv = -1;           // D-pad 上
      if(down(13)) ayv =  1;           // D-pad 下
      /* ★右側のボタンは何でも「落とす」（坂田 2026-09-21「右側のボタン なんでもOK で落とす」）。
         本番で客が持つのは初めて触るパッド。**どれを押しても動く**方が事故が少ない。
         0〜3＝右手の4つ（✕○△□）、4〜7＝L1 R1 L2 R2。左スティック押し込み(10/11)は誤爆するので入れない。 */
      act   = down(0) || down(1) || down(2) || down(3) || down(4) || down(5) || down(6) || down(7);
      pause = down(9);                          // OPTIONS
      /* ★標準マッピングが当たらないパッドでは番号がズレる。
         本番で無反応になるより誤爆する方がマシなので、その場合はどのボタンでも動かす。
         ★2026-09-22：ただし**十字キー（12〜15）は除く**。
         客は左右をずっと押す。そこが「落とす」を兼ねていたら、狙う前に落ちる
         （坂田「左右ボタンだけは他のボタンと連動で動かなくしたい」）。
         どのボタンが何番かは I キーの診断で見られる。 */
      if(gp.mapping !== 'standard' && !act){
        for(let i=0;i<b.length;i++){
          if(i === 9 || (i >= 12 && i <= 15)) continue;      // OPTIONS と十字キーは除く
          if(b[i] && b[i].pressed){ act = true; break; }
        }
      }
    } else if(!this.padBlocked){ this.padName = '—'; }

    // ─ キーボード
    let kx = 0, ky = 0;
    if(this.keys.has('ArrowLeft')  || this.keys.has('KeyA')) kx -= 1;
    if(this.keys.has('ArrowRight') || this.keys.has('KeyD')) kx += 1;
    if(this.keys.has('ArrowUp')    || this.keys.has('KeyW')) ky -= 1;
    if(this.keys.has('ArrowDown')  || this.keys.has('KeyS')) ky += 1;
    if(kx !== 0){ ax = kx; this.usedMouse = false; }
    if(ky !== 0) ayv = ky;
    if(this.keys.has('Space')) act = true;
    if(this.keys.has('KeyP')) pause = true;

    // 押してから離すまでが1フレーム未満のクリック/タップを取りこぼさないためのラッチ。
    // これが無いと速いクリックが poll() の合間に消える（実際にこれで起動しなかった）
    if(this._latch){ act = true; this._prevAction = false; this._latch = false; }

    // 判定キー（袖の人が押す）。押す＝接触。押さない＝クリア
    let j = this.keys.has('KeyX') || this.keys.has('Enter') || this.keys.has('NumpadEnter');
    if(this._jLatch){ j = true; this._prevJudge = false; this._jLatch = false; }
    this.judgeEdge = j && !this._prevJudge; this._prevJudge = j;

    this.axis  = Math.max(-1, Math.min(1, ax));
    this.axisY = Math.max(-1, Math.min(1, ayv));   // 型の選択（GATE）
    this.actionEdge = act && !this._prevAction; this._prevAction = act; this.actionHeld = act;
    this.pauseEdge  = pause && !this._prevPause; this._prevPause = pause;
  }
};

/* ══════════════════════════════════════════════════════════════
   3. ステージ ─ 記事の archetype（Wall / Columns / Cavern / Mesh /
      Central Mass / Split / Cascade / Boss）に沿った8面。
      '.'=空 / '1'..'4'=耐久 / '#'=破壊不能
   ══════════════════════════════════════════════════════════════ */
/* 5×7 のドット字形。ブロック1個＝1ドット。
   join('.') で文字間に1列の空きを入れる（HARIBOW＝5×7 + 6 = 41列） */
const GLYPHS = {
  H:['X...X','X...X','X...X','XXXXX','X...X','X...X','X...X'],
  A:['.XXX.','X...X','X...X','XXXXX','X...X','X...X','X...X'],
  R:['XXXX.','X...X','X...X','XXXX.','X..X.','X...X','X...X'],
  I:['XXXXX','..X..','..X..','..X..','..X..','..X..','XXXXX'],
  B:['XXXX.','X...X','X...X','XXXX.','X...X','X...X','XXXX.'],
  O:['.XXX.','X...X','X...X','X...X','X...X','X...X','.XXX.'],
  W:['X...X','X...X','X...X','X.X.X','X.X.X','XX.XX','X...X']
};
/* ch は1文字でも、行ごとの配列でもよい。
   下の行ほど硬くすると、序盤に手応えが出て確変がすぐには来ない（坂田指示 2026-08-28） */
function wordRows(word, ch){
  const g = [...word].map(c => GLYPHS[c]);
  const out = [];
  for(let r=0;r<7;r++){
    const c = Array.isArray(ch) ? ch[r] : ch;
    out.push(g.map(x => x[r]).join('.').split('X').join(c));
  }
  return out;
}

let G = null;
