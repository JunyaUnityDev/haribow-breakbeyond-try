function setMode(m){
  G.mode = m;
  Music.stop(); G.combo = 0; G.comboTier = 0; Music.tier = 0;
  G.balls = []; G.powerups = []; G.lasers = []; Particles.init(); FX.init();
  if(m === 'gate'){ newGate(); G.state = 'play'; }
  else { G.gate = null; G.stage = 0; loadStage(0); }
}

function loadStage(i){
  const s = STAGES[i % STAGES.length];
  const loop = Math.floor(i / STAGES.length);
  const cols = Math.max(...s.rows.map(r => r.length));
  const gap = (s.gap != null) ? s.gap : 8;
  const bw  = (W - WALL*2 - gap*(cols-1)) / cols;
  const bh  = (s.bh  != null) ? s.bh  : 46;
  const top = (s.top != null) ? s.top : FIELD_TOP + 92;
  G.bricks = [];
  s.rows.forEach((row, r)=>{
    for(let c=0;c<cols;c++){
      const ch = row[c] || '.';
      if(ch === '.') continue;
      const solid = ch === '#';
      let hp = solid ? Infinity : Math.min(4, parseInt(ch,10) + loop);   // 上限4。ステージ定義の数字をそのまま使う
      G.bricks.push({
        x: WALL + c*(bw+gap), y: top + r*(bh+gap),
        w: bw, h: bh, hp, max:hp, solid,
        hit:0, seed: Math.random()
      });
    }
  });
  // ── コア。必要回数はルーレットで決まる（絶望要塞2024の仕様）
  if(s.core){
    /* コアは最初から出す（坂田指示 2026-08-28）。
       露出待ちに80秒かかると、コアに当たる瞬間が少なすぎて間が持たない。
       文字と被らないよう、生成時に半径 EXPOSE_R の穴を開けておく。
       中央は「I」なので縦棒が抜け、上下の横棒だけが残って位置を示す */
    for(const b of G.bricks){
      if(Math.hypot(b.x + b.w/2 - CORE_X, b.y + b.h/2 - CORE_Y) < EXPOSE_R){
        b.dead = true; b.hp = 0; b.carved = true;
      }
    }
    /* 必要回数は**最初の1発を当てるまで決まらない**（絶望要塞2024の仕様）。
       ドーパミンは報酬そのものより「不確実な予期」で出る。
       1,200人が同時に数字の行方を見る瞬間を作るために、ここで回す */
    G.core = { x:CORE_X, y:CORE_Y, r:CORE_R, gAng:0, pulse:0, flash:0,
               parts:[{ang:0, cool:0, flash:0}], stage:0, spin:0,
               exposed:true, hits:0, roll:null, rollT:0, needFixed:false,
               need: NEED_ROULETTE[Math.floor(Math.random()*NEED_ROULETTE.length)],
               cool:0 };
  } else G.core = null;

  // ── リンクブロック：対で光の線が繋がる。片方壊すともう片方も落ちる
  if(s.links){
    const pool = G.bricks.filter(b => !b.solid &&
      Math.hypot(b.x + b.w/2 - CORE_X, b.y + b.h/2 - CORE_Y) > EXPOSE_R);
    for(let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
    for(let i=0; i+1 < Math.min(pool.length, s.links*2); i+=2){
      pool[i].link = pool[i+1]; pool[i+1].link = pool[i];
    }
  }

  G.stageName = s.name;
  G.stageT = 0;
  G.powerups = []; G.lasers = [];
  G.paddle.targetW = PADDLE_W;
  G.timers = { expand:0, narrow:0, slow:0, fast:0, reverse:0, tiny:0, laser:0, catch:0 };
  resetBall();
  G.banner = s.name; G.bannerT = s.noBanner ? 0 : 2.0;
}

function baseSpeed(){
  const i = G.stage % STAGES.length;
  const loop = Math.floor(G.stage / STAGES.length);
  const mul = STAGES[i].speed || 1;
  return Math.min(BALL_SPEED_MAX, (BALL_SPEED_0 + i*26 + loop*110) * mul);
}

function resetBall(){
  G.balls = [{
    x:G.paddle.x, y:PADDLE_Y - BALL_R - 2,
    vx:0, vy:0, r:BALL_R, speed:baseSpeed(),
    stuck:true, flatT:0, trail:[]
  }];
  G.state = 'serve';
  G.combo = 0;
}

/* 放つ角度はプレイヤーが決める。乱数で決めない。
   ここはプレイヤーが完全に主導権を持つ唯一の瞬間で、しかも全員が見ている。
   照準線が出ているので、客席には「どこを狙ったか」が事前に分かる。
   ＝入れば「おおー」、外せば「あー」になる（狙いの意図が可視化される） */
/* 低域の床の開き具合。段（コンボ）と、残り時間の切迫で決まる */
function floorLevel(){
  const tier = Math.min(4, G.comboTier) / 4;
  const urgency = G.clock > 0 ? Math.pow(1 - Math.min(1, G.clock / CLOCK_SEC), 1.6) : 1;
  return Math.min(1, 0.30 + 0.45*tier + 0.35*urgency);
}

function launchBall(b){
  const first = !G.launched;
  /* ★ここでは読まない（2026-09-21）。launchBall は**客が✕を押した瞬間**。
     呼び出し自体は1msでも、**解凍はそのあと本体に降ってくる**ので、打ち始めがガタつく。
     読むのはタイトルで待っている間（下の暖機）に移した。 */
  G.launched = true;                 // 最初の一投から時計が動く
  Music.start();                     // ★音楽はサーブした瞬間から
  if(first){ G.lastCoreAt = G.elapsed; React.say('b1_start', 2); }
  const a = G.aim;
  b.vx = Math.cos(a)*b.speed; b.vy = Math.sin(a)*b.speed;
  b.stuck = false;
  G.aimHeldT = 0;
}

/* ══════════════════════════════════════════════════════════════
   6. 更新
   ══════════════════════════════════════════════════════════════ */
/* ヒットストップ中に、パドルと照準だけ動かす。
   世界が止まっている間も手は効く＝「操作が重い」を作らない。
   ボールは止まったままなので、止めの効き（衝撃を噛みしめる間）は残る */
function movePaddleOnly(dt){
  if(!G || G.state === 'result' || G.mode === 'gate') return;
  const P = G.paddle;
  let ax = Input.axis;
  if(G.timers.reverse > 0) ax = -ax;
  const aiming = G.balls.length > 0 && G.balls.every(b => b.stuck);
  if(aiming){
    G.aim = Math.max(-Math.PI/2 - MAX_BOUNCE_ANGLE,
             Math.min(-Math.PI/2 + MAX_BOUNCE_ANGLE, G.aim + ax * AIM_SPEED * dt));
    for(const b of G.balls){ b.x = P.x; b.y = PADDLE_Y - b.r - 2; }
    return;
  }
  if(Input.usedMouse && Input.mouseX !== null && Math.abs(ax) < .01){
    P.x += (Input.mouseX - P.x) * Math.min(1, dt*55);
  } else {
    P.x += ax * PADDLE_SPEED * dt;
  }
  P.x = Math.max(WALL + P.w/2, Math.min(W - WALL - P.w/2, P.x));
}

function update(dt){
  G.elapsed += dt;
  G.stageT  += dt;
  /* ★生きているブロックの数。ここで1回だけ数える（2026-09-21）。
     配列は作らない＝ゴミが出ない。壊した所ごとに足し引きする手もあるが、
     壊す場所が7か所あって数え忘れると静かにズレるので、毎ステップ数え直す方を取った。
     200個のループは実測0.01ms未満で、GC が走るコストの方がずっと高い。 */
  {
    let n = 0;
    for(const b of G.bricks) if(!b.dead && !b.solid) n++;
    G.aliveBricks = n;
    /* ★壁が全部落ちて、残りがコアだけ（2026-09-25 坂田
       「残りがコアだけになった時 確変みたいな曲にしたいな」）。
       ここからは**コアを叩くだけ**の時間になるので、曲を確変に上げて落とさない。 */
    if(n === 0 && G.core && !G.cleared && G.state === 'play' && !G.tierFloor){
      setTierFloor(4, '\u30b3\u30a2\u3060\u3051\u306b\u306a\u3063\u305f');
      React.say('b3_expose', 3);
    }
  }
  if(G.bannerT > 0) G.bannerT -= dt;
  if(G.msgT > 0)    G.msgT -= dt;

  // FX 減衰
  G.fx.shake = Math.max(0, G.fx.shake - dt*4.2);
  G.fx.flash = Math.max(0, G.fx.flash - dt*3.4);
  G.fx.comboBreak = Math.max(0, G.fx.comboBreak - dt*2.6);

  // 拍の位相。音が鳴らせない環境でも画だけは脈打たせる
  if(G.comboTier > 0){
    G.beatPhase += dt * (Music.bpm()/60);
    G.beatPulse = Math.pow(1 - (G.beatPhase % 1), 2.2);
  } else { G.beatPulse = 0; }

  Prof.k('数え');
  CAM.update(dt);
  Particles.step(dt);  Prof.k('粒進め');
  FX.step(dt);         Prof.k('FX進め');
  if(G.act === 'crash'){ updateCrash(dt); Prof.k('CRASH'); return; }
  if(G.mode === 'gate'){ updateGate(dt); Prof.k('GATE進め'); return; }

  if(G.penaltyT > 0) G.penaltyT -= dt;

  /* 低域の床。0.5秒に1回だけ動かす（毎フレーム触るとランプが詰まる） */
  G.floorT = (G.floorT || 0) + dt;
  if(G.floorT > 0.5){
    G.floorT = 0;
    if(G.state === 'play' || G.state === 'serve'){ Audio_.floorOn(); Audio_.floorSet(floorLevel(), 0.8); }
  }
  /* スコアは跳ばさず転がす。数字が動いている時間そのものが快になる
     （数字が一瞬で切り替わると、増えたことに気づかれない） */
  if(G.scoreShown !== G.score){
    const d = G.score - G.scoreShown;
    const step = Math.max(1, Math.ceil(Math.abs(d) * Math.min(1, dt*7)));
    G.scoreShown += Math.sign(d) * Math.min(Math.abs(d), step);
    G.scorePop = Math.min(1, G.scorePop + dt*6);
  } else if(G.scorePop > 0) G.scorePop = Math.max(0, G.scorePop - dt*2.6);

  // ── 結果表示中：玉は動かさず、崩れる演出だけ進める
  if(G.state === 'result'){
    G.resultT += dt;
    if(G.shatterQueue && G.shatterQueue.length && Particles.p.length < PF.MAX*0.72){
      for(let i=0;i<3 && G.shatterQueue.length;i++){
        const br = G.shatterQueue.shift();
        br.dead = true; br.hp = 0; br.killOrder = G.killCount++;
        shatterBrick(br, 0, -1);
        Audio_.shatter(br.x + br.w/2);
      }
    }
    return;
  }

  // ── 制限時間。ここでプレイ時間が決まる。
  // 構え（serve）中も進める。止めると狙いに時間をかけた分だけ尺が伸びてしまう
  if(G.launched && (G.state === 'play' || G.state === 'serve')){
    G.clock -= dt;
    if(G.clock <= 60 && !G.clock60){ G.clock60 = true; React.say('b11_60', 2);
      Audio_.buzzer(1); }                 // ★残り1分でもブザー（坂田 2026-09-21）
    if(G.clock <= 30 && !G.clock30){ G.clock30 = true; Audio_.preroll(0.7); React.say('b11_30', 2); }
    if(G.clock <= 10 && !G.clock10){ G.clock10 = true; React.say('b11_10', 3); }
    /* コアが出ているのに20秒当たっていない＝手が止まっている。急かさず、落ち着かせる */
    if(G.core && G.core.exposed && G.elapsed - (G.lastCoreAt || 0) > 20){
      G.lastCoreAt = G.elapsed; React.say('b12_stuck', 1);
    }
    if(G.clock <= 0 && G.act !== 'crash'){ G.clock = 0; finishRun('timeup'); return; }
  }

  // ── 回転ガード（10秒で1回転）
  if(G.core){
    G.core.gAng += (Math.PI*2 / GUARD_ROT) * dt;
    G.core.pulse = (G.core.pulse + dt*2.2) % 1;
    if(G.core.cool > 0) G.core.cool -= dt;
    // ルーレットが回っている間：候補を高速で切り替え、だんだん遅くして着地させる
    if(G.core.roll != null){
      const c0 = G.core;
      c0.rollT += dt;
      const P = Math.min(1, c0.rollT / ROLL_T);
      const ease = 1 - Math.pow(1-P, 3);                 // 減速
      const rate = 22 * (1 - ease) + 1.2;                // 1秒あたりの切替回数
      c0.rollPhase = (c0.rollPhase || 0) + rate*dt;
      if(Math.floor(c0.rollPhase) !== c0.rollShown){
        c0.rollShown = Math.floor(c0.rollPhase);
        c0.roll = NEED_ROULETTE[c0.rollShown % NEED_ROULETTE.length];
        Audio_.rollTick(1 - ease);
      }
      if(P >= 1){
        c0.need = c0.roll; c0.roll = null; c0.needFixed = true;
        Audio_.rollLand(); Audio_.duckBefore(0.2, 0.45, 0.6); HitStop.hit(0.09);
        CAM.shake = 1; G.fx.flash = Math.max(G.fx.flash, .30);
        toast('\u3042\u3068 ' + c0.need + ' \u56de');
        React.say('b2_roll', 2);
      }
    }
    // 分身の回転と、進行度に応じた分裂
    G.core.spin += CORE_SPIN * dt;
    const prog = G.core.hits / Math.max(1, G.core.need);
    let want = 0;
    for(let i=0;i<CORE_SPLIT.length;i++) if(prog >= CORE_SPLIT[i].at) want = i;
    if(want > G.core.stage){
      G.core.stage = want;
      const n = CORE_SPLIT[want].n;
      G.core.parts = [];
      for(let i=0;i<n;i++) G.core.parts.push({ang: i*(Math.PI*2/n), cool:0, flash:1});
      G.core.flash = 1; CAM.shake = Math.max(CAM.shake, .7);
      G.fx.flash = Math.max(G.fx.flash, .22);
      Audio_.riser(Math.min(4, 2+want));
      toast(n + ' つに割れた');
      React.say(n >= 4 ? 'b5_split4' : n === 3 ? 'b5_split3' : 'b5_split2', 2);
    }
    for(const pt of G.core.parts){
      if(pt.cool > 0) pt.cool -= dt;
      if(pt.flash > 0) pt.flash = Math.max(0, pt.flash - dt*2.2);
    }
    // コアの身じろぎ（ニアミスの反動）
    G.core.wobX = (G.core.wobX||0) * Math.pow(0.02, dt);
    G.core.wobY = (G.core.wobY||0) * Math.pow(0.02, dt);
    if(G.core.exposed){
      for(const b of G.balls){
        if(b.stuck) continue;
        const d = Math.hypot(b.x-G.core.x, b.y-G.core.y) - G.core.r - b.r;
        const pd = (b._coreD == null) ? d : b._coreD;
        // 圏内に入ったら1回だけ構える。遠ざかったら再装填する
        if(d >= NEAR_MISS*1.6) b._nmArmed = true;
        // 遠ざかりに転じた瞬間＝最接近を通過した。ここで1回だけ鳴らす
        if(b._nmArmed && d > pd && pd > 2 && pd < NEAR_MISS && G.core.cool <= 0){
          b._nmArmed = false;
          const nx=(b.x-G.core.x), ny=(b.y-G.core.y), L=Math.hypot(nx,ny)||1;
          const k = (1 - pd/NEAR_MISS);              // 近いほど大きく揺れる
          G.core.wobX = -nx/L * 22 * k; G.core.wobY = -ny/L * 22 * k;
          G.core.nearT = 0.42; G.core.nearK = k;
          Audio_.nearMiss(b.x, k);
        }
        b._coreD = d;
      }
    }
    if(G.core.nearT > 0) G.core.nearT -= dt;
    /* ★あと1回。予期のピークをここに作る。
       ドーパミンは報酬でなく「不確実な予期」で出る＝残り1つの間が一番効く */
    const left1 = G.core.needFixed && (G.core.need - G.core.hits) === 1 && !G.cleared;
    if(left1 !== !!G.core.last1){
      G.core.last1 = left1;
      if(left1){ Audio_.lastOneOn(); Audio_.preroll(0.9); Audio_.duckBefore(0.25, 0.5, 0.7);
                 G.core.last1T = 0; CAM.shake = Math.max(CAM.shake,.4); }
      else Audio_.lastOneOff();
    }
    if(G.core.last1) G.core.last1T += dt;
    // 露出判定はもう使わない（最初から出している）。壊れた時のための保険として残す
    if(!G.core.exposed){
      const inner = G.bricks.filter(b => !b.dead &&
        Math.hypot(b.x + b.w/2 - CORE_X, b.y + b.h/2 - CORE_Y) < EXPOSE_R);
      let near = inner.length > 0;
      // 安全弁：規定時間までに開かなければ内側を自壊させる。
      // 本番は一度きりで、コアが一度も出ないまま終わるのが最悪。絵としては「ロゴが内側から割れる」
      if(near && G.stageT >= EXPOSE_DEADLINE){
        for(const b of inner){ b.dead = true; b.hp = 0; b.killOrder = G.killCount++;
                               shatterBrick(b, 0, -1); }
        Audio_.shatter(CORE_X); near = false;
      }
      if(!near){
        G.core.exposed = true; G.core.flash = 1;
        Audio_.riser(4); G.fx.flash = Math.max(G.fx.flash, .30); CAM.shake = 1;
        toast('CORE 露出　残り ' + G.core.need + ' 回');
        React.say('b3_expose', 3);
      }
    }
    if(G.core.flash > 0) G.core.flash = Math.max(0, G.core.flash - dt*1.6);
  }

  Prof.k('コア進め');
  // タイマー
  for(const k in G.timers) if(G.timers[k] > 0) G.timers[k] = Math.max(0, G.timers[k]-dt);
  if(G.laserCd > 0) G.laserCd -= dt;

  const P = G.paddle;

  // ── パドル
  P.targetW = PADDLE_W * (G.timers.expand>0 ? 1.55 : 1) * (G.timers.narrow>0 ? 0.58 : 1);
  P.w += (P.targetW - P.w) * Math.min(1, dt*9);

  let ax = Input.axis;
  if(G.timers.reverse > 0) ax = -ax;

  // ── 構え：球を持っている間はスティックで狙う（パドルは止まる）
  const aiming = G.balls.length > 0 && G.balls.every(b => b.stuck);
  if(aiming){
    G.aimHeldT += dt;
    G.aim = Math.max(-Math.PI/2 - MAX_BOUNCE_ANGLE,
             Math.min(-Math.PI/2 + MAX_BOUNCE_ANGLE, G.aim + ax * AIM_SPEED * dt));
    for(const b of G.balls){ b.x = P.x; b.y = PADDLE_Y - b.r - 2; b.trail.length = 0; }
  } else {
    G.aim = -Math.PI/2;
  }

  let want;
  if(aiming){ P.vx = 0; }
  else if(Input.usedMouse && Input.mouseX !== null && Math.abs(ax) < .01){
    want = Input.mouseX;
    const dx = want - P.x;
    P.vx = dx / Math.max(dt, 1/240);
    P.x += dx * Math.min(1, dt*55);   // 26だと2フレーム(33ms)遅れて重く感じる
  } else {
    P.vx = ax * PADDLE_SPEED;
    P.x += P.vx * dt;
  }
  P.x = Math.max(WALL + P.w/2, Math.min(W - WALL - P.w/2, P.x));

  // ── バンプ（パドルの突き上げ）: 記事の中核メカニクス。返球待ちに「やること」を作る
  if(P.bump > 0) P.bump -= dt;
  if(P.saveT > 0) P.saveT -= dt;
  if(P.bumpCd > 0) P.bumpCd -= dt;
  if(Input.actionEdge){
    if(G.state === 'serve'){
      G.state = 'play';
      G.balls.forEach(launchBall);
      Audio_.paddle();
    } else if(G.balls.some(b=>b.stuck)){
      G.balls.forEach(b=>{ if(b.stuck) launchBall(b); });
      Audio_.paddle();
    } else if(P.bumpCd <= 0){
      P.bump = BUMP_DUR; P.bumpCd = BUMP_CD; Audio_.bump();
    }
  }
  const bumpP = P.bump > 0 ? Math.sin((1 - P.bump/BUMP_DUR) * Math.PI) : 0;
  // 球を返した反動で沈む。返した手応えが体で分かる
  if(P.recoil > 0) P.recoil = Math.max(0, P.recoil - dt*9);
  P.yOff = -bumpP * BUMP_RISE + (P.recoil||0) * 6;   // 沈みは浅く。深いと返しが鈍く見える

  Prof.k('板');
  // ── レーザー
  if(G.timers.laser > 0 && Input.actionHeld && G.laserCd <= 0 && G.state === 'play'){
    G.laserCd = 0.16;
    for(const s of [-1,1]) G.lasers.push({ x:P.x + s*(P.w/2 - 12), y:PADDLE_Y + P.yOff, vy:-1500 });
    Audio_.laser(P.x);
  }
  for(const l of G.lasers) l.y += l.vy * dt;
  G.lasers = G.lasers.filter(l => l.y > FIELD_TOP - 20);

  // レーザー命中
  for(const l of G.lasers){
    for(const b of G.bricks){
      if(b.dead) continue;
      if(l.x > b.x && l.x < b.x+b.w && l.y < b.y+b.h && l.y > b.y){
        damageBrick(b, 1, l.x, l.y, 0, -1); l.dead = true; break;
      }
    }
  }
  G.lasers = G.lasers.filter(l => !l.dead);

  Prof.k('レーザー');
  // ── ボール
  const speedMul = (G.timers.slow>0 ? .70 : 1) * (G.timers.fast>0 ? 1.34 : 1);
  const radius   = BALL_R * (G.timers.tiny>0 ? .58 : 1);

  for(const b of G.balls){
    b.r = radius;
    if(b.stuck){
      b.x = P.x; b.y = PADDLE_Y + P.yOff - b.r - 2;
      b.trail.length = 0;
      continue;
    }

    const vlen = Math.hypot(b.vx, b.vy) || 1;
    const target = b.speed * speedMul;
    b.vx = b.vx/vlen*target; b.vy = b.vy/vlen*target;

    // ラスト2個の「消化試合」対策 ─ ごく弱いステアリングで詰みを防ぐ
    /* ★2026-09-21：ここは「玉1個 × 物理1ステップ」ごとに走っていた。
       球5個 × 120Hz ＝ **毎秒600回、200個のブロックを走査して配列を作り直す**。
       作られた配列は即ゴミになるので、GC がときどき走って画がカクつく（坂田「ブロック崩しがかくついた」）。
       数はブロックが壊れた時に減らして持ち歩く（aliveBricks）。
       走査するのは「残り2個」になった時だけ＝終盤の数秒だけ。 */
    if(G.aliveBricks <= 2 && G.aliveBricks > 0 && b.vy < 0){
      let near = null, nd = Infinity;
      for(const t of G.bricks){
        if(t.dead || t.solid) continue;
        const d = Math.hypot(t.x+t.w/2-b.x, t.y+t.h/2-b.y);
        if(d < nd){ nd = d; near = t; }
      }
      if(near){
        const want = Math.atan2(near.y+near.h/2-b.y, near.x+near.w/2-b.x);
        const cur  = Math.atan2(b.vy, b.vx);
        let d = ((want-cur+Math.PI*3)%(Math.PI*2))-Math.PI;
        const max = 0.45*dt;
        const na = cur + Math.max(-max, Math.min(max, d));
        b.vx = Math.cos(na)*target; b.vy = Math.sin(na)*target;
      }
    }

    // 高速時の抜けを防ぐサブステップ
    const steps = Math.max(1, Math.ceil(target*dt / (b.r*0.8)));
    const sdt = dt/steps;
    for(let s=0;s<steps;s++) moveBall(b, sdt, P);

    // 水平にへばりつくのを検出して起こす（記事：ボールを速やかにプレイヤーへ返す）
    if(Math.abs(b.vy) < target*0.20){ b.flatT += dt; } else { b.flatT = 0; }
    if(b.flatT > 1.1){
      const sign = b.vy >= 0 ? 1 : -1;
      const a = Math.atan2(sign*target*0.42, b.vx);
      b.vx = Math.cos(a)*target; b.vy = Math.sin(a)*target;
      b.flatT = 0;
    }

    if(b.squash > 0) b.squash = Math.max(0, b.squash - dt*7.5);
    /* ★尾の点は使い回す（2026-09-21）。
       毎回 {x,y} を作ると 120Hz×球の数だけゴミが出る（球5個で毎秒600個）。
       いっぱいになったら、いちばん古い点を先頭から外して**中身を書き換えて**末尾へ回す。 */
    {
      const cap = 16 + G.comboTier*9;
      if(b.trail.length >= cap){ const o = b.trail.shift(); o.x = b.x; o.y = b.y; b.trail.push(o); }
      else b.trail.push({x:b.x, y:b.y});
    }
  }

  Prof.k('玉進め');
  // 落球
  const before = G.balls.length;
  G.balls = G.balls.filter(b => b.y - b.r < H + 40);
  // 予備球を1つ落としただけでは切らない。まだ球は生きている＝失敗していない。
  // ここで切ると数秒ごとに曲が行き来して音楽として壊れる（実測3.5回/プレイ）
  if(G.balls.length < before && G.balls.length > 0){ /* コンボは維持 */ }
  if(G.balls.length === 0 && G.state === 'play'){
    if(G.guard > 0){
      G.guard--;
      G.balls = [{ x:P.x, y:PADDLE_Y-40, vx:0, vy:0, r:radius, speed:baseSpeed(), stuck:false, flatT:0, trail:[] }];
      const a = -Math.PI/2 + (Math.random()-.5)*0.5;
      G.balls[0].vx = Math.cos(a)*G.balls[0].speed; G.balls[0].vy = Math.sin(a)*G.balls[0].speed;
      G.fx.flash = .35; Audio_.good(); toast('GUARD 発動'); React.say('b8_guard', 3);
    } else {
      G.lives--; breakCombo();
      HitStop.hit(0.085);                   // 落球＝失敗。ここは長く止める
      CAM.shake = 1; Audio_.die();
      G.timers = { expand:0, narrow:0, slow:0, fast:0, reverse:0, tiny:0, laser:0, catch:0 };
      /* ★2026-09-21 改訂：残機0で終わる。
         旧仕様は「0になっても続き、落とすたびに時間が8秒減る」だった。
         理由は「止めると CRASH が早まり、紗幕の裏で Roar の5人が配置につく前に幕が上がる」。
         **その心配は 2026-09-20 に坂田が「大丈夫」と決着済み**（ADR 追記27）。
         残ったのは「0なのに続く」という、客席から見て意味の分からない状態だけだった
         （坂田「ざんき0 になっても続くのダメしょ」）。
         そのぶん残機を 3→5 に増やしてある。下振れは尺が短くなる形で受ける。 */
      if(G.lives <= 0){
        G.lives = 0;
        finishRun('over');
        return;
      }
      React.say(G.lives === 1 ? 'b7_life1' : 'b7_life2', 3);
      /* ★残り2と残り1でブザー。落球の音と重ならないよう少し置いてから */
      if(G.lives <= 2){ const lv = G.lives === 1 ? 2 : 1; setTimeout(()=>Audio_.buzzer(lv), 450); }
      resetBall();
    }
  }

  Prof.k('落球');
  // ── パワーアップ落下
  for(const p of G.powerups){
    p.y += p.vy * dt; p.t += dt;
    const good = POWERS[p.k].good;
    if(p.y > PADDLE_Y + P.yOff - 26 && p.y < PADDLE_Y + P.yOff + 34 &&
       Math.abs(p.x - P.x) < P.w/2 + 26){
      p.dead = true; applyPower(p.k);
    }
  }
  G.powerups = G.powerups.filter(p => !p.dead && p.y < H + 40);
  Prof.k('アイテム');


  // ── ステージクリア
  // コアのあるステージでは「ブロック全壊」は勝利条件ではない。
  // 壁が無くなってもコアを規定回数叩くまで続く（時計も止めない）
  if(G.state === 'play' && !G.core && G.bricks.every(b => b.dead || b.solid)){
    G.state = 'clear';
    G.fx.flash = REDUCED ? .2 : .45;      // 全画面は飛ばさない。中心の淡い滲みだけ（照明キューは卓側で出す）
    Audio_.clear();
    setTimeout(()=>{
      if(!G) return;
      G.score += 1000 + G.lives*500;
      if(G.act === 'break'){ G.msg = 'READY \u2014 N \u3067 GATE \u3078'; G.msgT = 999; }
      else { G.stage++; loadStage(G.stage); }
    }, 1500);
  }
}

function moveBall(b, dt, P){
  b.x += b.vx*dt; b.y += b.vy*dt;

  // 壁
  if(b.x - b.r < WALL){ b.x = WALL + b.r; b.vx = Math.abs(b.vx); Audio_.wall(b.x); sparkAt(b.x,b.y,C.dim); }
  if(b.x + b.r > W-WALL){ b.x = W-WALL-b.r; b.vx = -Math.abs(b.vx); Audio_.wall(b.x); sparkAt(b.x,b.y,C.dim); }
  if(b.y - b.r < FIELD_TOP){ b.y = FIELD_TOP + b.r; b.vy = Math.abs(b.vy); Audio_.wall(b.x); sparkAt(b.x,b.y,C.dim); }

  // パドル
  const py = PADDLE_Y + (P.yOff||0);
  if(b.vy > 0 && b.y + b.r >= py && b.y - b.r <= py + PADDLE_H &&
     b.x >= P.x - P.w/2 - b.r && b.x <= P.x + P.w/2 + b.r){
    b.y = py - b.r;
    // 接触点で角度が決まる（記事：端ほど浅い＝フラット）
    let off = (b.x - P.x) / (P.w/2);
    off = Math.max(-1, Math.min(1, off));
    /* ★きわどい救出。端で拾うほど「落ちる寸前だった」＝客席が沸く。
       ニアミスは実際の勝ちと同じ報酬回路を発火させる（スロットの研究）ので、
       拾えた側にもこれを置く */
    const edge = Math.abs(off);
    if(edge > 0.72){
      const k = (edge - 0.72) / 0.28;
      P.saveT = 0.5; P.saveK = k; P.saveX = b.x;
      Audio_.paddleSave(b.x, k);
      HitStop.hit(0.020 + 0.040*k);
      CAM.shake = Math.max(CAM.shake, 0.20 + 0.35*k);
      G.score += Math.round(200 * (1 + k));
      for(let i=0;i<10+Math.round(14*k);i++) sparkAt(b.x, py, C.ink, 1);
    }
    let a = -Math.PI/2 + off * MAX_BOUNCE_ANGLE;
    const bumping = (P.bump||0) > 0;
    if(bumping){ b.speed = Math.min(BALL_SPEED_MAX, b.speed * BUMP_BOOST); a *= 0.82; }
    // パドルの横移動をボールに乗せる（フリクション）
    const sp = b.speed;
    b.vx = Math.cos(a)*sp + (P.vx||0)*0.16;
    b.vy = Math.sin(a)*sp;
    const l = Math.hypot(b.vx,b.vy)||1; b.vx = b.vx/l*sp; b.vy = b.vy/l*sp;
    if(b.vy > -sp*0.24) b.vy = -sp*0.24;
    /* ★パドルに当たってもコンボは切らない（坂田指示 2026-08-28）。
       切っていた頃は確変が全体の9%しか鳴らなかった＝別曲を用意した意味が出ない。
       音楽が消えるのは「球を落としたとき」だけ、という規則の方が客席にも一瞬で伝わる */
    b.squash = 1; P.recoil = 1;                    // 潰れる／パドルが沈む
    if(G.timers.catch > 0){ b.stuck = true; }
    bumping ? Audio_.bump(b.x) : Audio_.paddle(b.x);
    sparkAt(b.x, py, C.teal, 7);
    G.fx.shake = Math.max(G.fx.shake, bumping ? .35 : .12);
    return;
  }

  // ── 回転ガードとコア（露出後のみ）
  if(G.core && G.core.exposed && hitCore(b)) return;

  // ブロック
  for(const br of G.bricks){
    if(br.dead) continue;
    if(b.x + b.r < br.x || b.x - b.r > br.x+br.w || b.y + b.r < br.y || b.y - b.r > br.y+br.h) continue;

    // めり込みが浅い軸で跳ね返す
    const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
    const oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
    let nx = 0, ny = 0;
    if(ox < oy){ nx = (b.x < br.x + br.w/2) ? -1 : 1; b.x += nx*ox; b.vx = Math.abs(b.vx)*nx; }
    else       { ny = (b.y < br.y + br.h/2) ? -1 : 1; b.y += ny*oy; b.vy = Math.abs(b.vy)*ny; }

    b.squash = 0.85;                               // ブロックで潰れる
    damageBrick(br, 1, b.x, b.y, nx, ny);
    break;
  }
}

/* 分身の中心座標。判定と描画で同じ式を使う（別々に書くとズレる） */
function corePartPos(c, i, out){
  const sp = CORE_SPLIT[c.stage];
  const a = c.parts[i].ang + c.spin;
  out[0] = c.x + Math.cos(a)*sp.orbit;
  out[1] = c.y + Math.sin(a)*sp.orbit;
  return sp.r;
}

/* 回転ガード＝コアから対向に伸びる2本の腕。線分と円の判定で弾く。
   ガードに当たると弾かれるだけでコアには届かない＝隙間を狙う必要がある */
function hitCore(b){
  const C0 = G.core;
  const cx = C0.x, cy = C0.y;

  for(let i=0;i<GUARD_ARMS;i++){
    const a = C0.gAng + i*(Math.PI*2/GUARD_ARMS);
    const ux = Math.cos(a), uy = Math.sin(a);
    const x0 = cx + ux*GUARD_R0, y0 = cy + uy*GUARD_R0;
    const x1 = cx + ux*(GUARD_R0+GUARD_LEN), y1 = cy + uy*(GUARD_R0+GUARD_LEN);
    // 球の中心から線分への最近点
    const dx = x1-x0, dy = y1-y0, L2 = dx*dx+dy*dy;
    let t = ((b.x-x0)*dx + (b.y-y0)*dy) / L2;
    t = Math.max(0, Math.min(1, t));
    const px = x0+dx*t, py = y0+dy*t;
    const ddx = b.x-px, ddy = b.y-py, d = Math.hypot(ddx,ddy);
    if(d < b.r + GUARD_W/2){
      const nxg = (ddx/(d||1)), nyg = (ddy/(d||1));
      const push = (b.r + GUARD_W/2) - d + 0.5;
      b.x += nxg*push; b.y += nyg*push;
      const dot = b.vx*nxg + b.vy*nyg;
      b.vx -= 2*dot*nxg; b.vy -= 2*dot*nyg;
      Audio_.wall(b.x); sparkAt(b.x, b.y, C.solid, 6);
      FX.ring({x:b.x-14,y:b.y-14,w:28,h:28}, C.dim);
      G.fx.shake = Math.max(G.fx.shake, .10);
      return true;
    }
  }

  // コア（分身ぶん回す。1回の侵入で複数に当たれる＝連鎖する）
  const pp = [0,0];
  for(let i=0;i<C0.parts.length;i++){
    const pr = corePartPos(C0, i, pp);
    const px = pp[0], py = pp[1];
    const ddx = b.x-px, ddy = b.y-py, d = Math.hypot(ddx,ddy);
    if(d >= b.r + pr) continue;
    const nxg = ddx/(d||1), nyg = ddy/(d||1);
    b.x = px + nxg*(pr + b.r + 0.5); b.y = py + nyg*(pr + b.r + 0.5);
    const dot = b.vx*nxg + b.vy*nyg;
    b.vx -= 2*dot*nxg; b.vy -= 2*dot*nyg;
    const pt = C0.parts[i];
    if(pt.cool <= 0){
      // 分身ごとの待ち時間は短くする。同じ侵入で隣にも当たってほしい
      pt.cool = 0.12; pt.flash = 1;
      C0.hits++; C0.flash = 1;
      G.lastCoreAt = G.elapsed;              // 手が止まった時の声かけ（b12）の起点
      HitStop.hit(0.075);                    // コア命中＝この試合で一番重い一撃
      /* フリッキーのひとこと。残り回数で言うことが変わる＝辻褄が合う */
      /* b4a_first は声が違うので落とした（2026-09-21）。無ければふつうの相づちに落とす */
      if(C0.hits === 1){ if(!React.say('b4a_first', 2)) React.say('b4b_hit', 2); }
      else {
        const rest = Math.max(0, C0.need - C0.hits);
        if(rest === 1) React.say('b4d_last', 3);
        else if(rest <= 5) React.say('b4c_five', 2);
        else React.say('b4b_hit', 0);
      }
      // ★最初の1発でルーレットが回り出す
      if(!C0.needFixed && C0.roll == null){
        C0.roll = NEED_ROULETTE[0]; C0.rollT = 0; C0.rollPhase = 0; C0.rollShown = -1;
        Audio_.riser(2);
      }

      b.squash = 1;                          // コアで潰れる
      b._nmArmed = false;                    // 当たった球でニアミスを鳴らさない
      bumpCombo();
      G.score += 1000;
      Audio_.brick(G.combo, b.x); Audio_.shatter(b.x);
      CAM.shake = Math.max(CAM.shake, .45);
      G.fx.flash = Math.max(G.fx.flash, .14);
      for(let k=0;k<22;k++) sparkAt(px, py, TIER_COL[Math.min(4,G.comboTier)], 1);
      FX.ring({x:px-pr,y:py-pr,w:pr*2,h:pr*2}, C.ink);
      // ルーレットが止まるまでは決着しない（回っている間の need は仮の値）
      if(C0.needFixed && C0.hits >= C0.need && !G.cleared){
        finishRun('clear');
      }
    }
    return true;
  }
  return false;
}

function damageBrick(br, dmg, hx, hy, nx, ny){
  if(br.solid){
    br.hit = .18; Audio_.wall(hx); sparkAt(hx, hy, C.solid, 5);
    return;
  }
  br.hp -= dmg; br.hit = .18;
  bumpCombo();
  const mult = Math.min(8, 1 + Math.floor(G.combo/3));
  Audio_.brick(G.combo, hx);

  if(br.hp <= 0){
    br.dead = true; br.killOrder = G.killCount++;   // ★巻き戻しで逆順に復活させる
    // リンク：対の相方も同時に落ちる（連鎖の快。コンボの燃料）
    const lk = br.link;
    if(lk && !lk.dead){
      lk.dead = true; lk.hp = 0; lk.killOrder = G.killCount++;
      G.score += 100; bumpCombo();
      Audio_.shatter(lk.x + lk.w/2);
      shatterBrick(lk, 0, -1);
    }
    G.score += 100 * mult;
    Audio_.shatter(br.x + br.w/2);
    shatterBrick(br, nx, ny);
    G.fx.shake = Math.max(G.fx.shake, .18);
    maybeDropPower(br);
  } else {
    sparkAt(hx, hy, C.brick[Math.min(3, br.hp-1)], 6);
  }
}

function shatterBrick(br, nx, ny){
  /* ブロック1個の破壊では止めない。0.3秒に1回起きるものを止めると操作が重くなる。
     止めは「重い一撃」だけに取っておく（コア命中・落球・GATE被弾・きわどい救出） */
  // ★ブロックそのものが砕けて粒子になる
  FX.ring(br, br.solid ? C.solid : C.brick[Math.min(3, br.max-1)]);
  Particles.shatter(br, nx, ny, 0.9 + G.comboTier*0.22,
                    br.solid ? C.solid : C.brick[Math.min(3, br.max-1)]);
  CAM.shake = Math.max(CAM.shake, 0.18 + G.comboTier*0.05);
}

function sparkAt(x, y, col, n=5){
  const wx = fwx(x), wy = fwy(y);
  for(let i=0;i<n && Particles.p.length<PF.MAX;i++){
    const a=Math.random()*6.283, el=(Math.random()-.5)*1.6, sp=90+Math.random()*220;
    Particles.p.push({
      x:wx, y:wy, z:PLANE_Z-BRICK_D*0.5, px:wx, py:wy, pz:PLANE_Z-BRICK_D*0.5,
      vx:Math.cos(a)*Math.cos(el)*sp, vy:Math.sin(a)*Math.cos(el)*sp, vz:Math.sin(el)*sp-40,
      tx:null, ty:null, tz:null,
      life:0.24+Math.random()*0.26, max:0.5,
      sz:1.8+Math.random()*2.4, col, s:Math.random()
    });
  }
}

function maybeDropPower(br){
  // 記事：良い報酬は深い位置に置いて誘い込む。悪い効果は明確に見分けられるように
  const depth = (br.y - FIELD_TOP) / (PADDLE_Y - FIELD_TOP);   // 0=上 1=下
  const roll = Math.random();
  if(roll > 0.22) return;
  const wantBad = Math.random() < 0.30;
  const keys = wantBad ? BAD_KEYS : GOOD_KEYS;
  let k = keys[Math.floor(Math.random()*keys.length)];
  if(k === 'P' && Math.random() < 0.7) k = 'E';          // 残機は希少に
  if(!wantBad && depth < 0.42 && Math.random() < 0.5) k = Math.random()<.5 ? 'M' : 'L';  // 深い＝強い
  G.powerups.push({ k, x:br.x+br.w/2, y:br.y+br.h/2, vy: wantBad ? 300 : 235, t:0 });
}

function applyPower(k){
  const p = POWERS[k];
  p.good ? Audio_.good(G.paddle.x) : Audio_.bad(G.paddle.x);
  G.fx.flash = Math.max(G.fx.flash, p.good ? .22 : .30);
  switch(k){
    case 'E': G.timers.expand = 14; G.timers.narrow = 0; break;
    case 'N': G.timers.narrow = 11; G.timers.expand = 0; break;
    case 'S': G.timers.slow = 11; G.timers.fast = 0; break;
    case 'F': G.timers.fast = 9;  G.timers.slow = 0; break;
    case 'T': G.timers.tiny = 10; break;
    case 'R': G.timers.reverse = 8; break;
    case 'C': G.timers.catch = 14; break;
    case 'L': G.timers.laser = 12; break;
    case 'P': G.lives = Math.min(9, G.lives+1); break;
    case 'G': G.guard = Math.min(3, G.guard+1); break;
    case 'M': {
      const src = G.balls.filter(b=>!b.stuck)[0] || G.balls[0];
      if(src){
        for(let i=0;i<2;i++){
          const a = Math.atan2(src.vy, src.vx) + (i===0 ? .48 : -.48);
          G.balls.push({ x:src.x, y:src.y, vx:Math.cos(a)*src.speed, vy:Math.sin(a)*src.speed,
                         r:src.r, speed:src.speed, stuck:false, flatT:0, trail:[] });
        }
      }
      break;
    }
  }
  toast(p.label + '  ' + p.desc);
  /* ★いいアイテムは「揃った時」だけ喋る（坂田 2026-09-21）。
     合成した短い単発（「あ、伸びた。」等）は声が違って聞こえたので全部落とした。
     代わりに**採用済みの本編から切り出した感嘆**（b9_wow）を、良い効果が2つ以上
     重なった時だけ鳴らす。1個取るたびに言わないので、重なった瞬間が立つ。
     悪いアイテムは今までどおり（種類別→共通句）。 */
  if(p.good){
    const on = (G.timers.expand > 0) + (G.timers.slow > 0) + (G.timers.catch > 0)
             + (G.timers.laser > 0) + (G.guard > 0) + (G.balls.length >= 3);
    if(on >= 2) React.say('b9_wow', 2);
  } else {
    if(!React.say('b10_' + k, 1)) React.say('b10_bad', 1);
  }
}

function toast(t){ G.msg = t; G.msgT = 1.9; }

/* コンボが切れた瞬間 ─ 確変曲が落ちてBASEに戻る。この落差が罰になる（引き算） */
/* 落球はコンボを0に戻さず6割に落とす。
   0だと確変まで45秒かけて登り直しで「一度入ったらとんとん拍子」が壊れる（実測：戻るのに133秒）。
   6割にすると罰の重さが深さで変わる：
     浅い所（コンボ80）で落とす → 48 → 確変から落ちる
     深い所（コンボ150）で落とす → 90 → 段が1つ下がるだけで確変は続く
   潜るほど強くなる。とんとん拍子を壊さずに罰は伝わる */
function breakCombo(){
  const had = G.comboTier > 0;
  G.combo = Math.floor(G.combo * 0.60); G.comboTier = comboTier(G.combo);
  if(had){
    musicTier(G.comboTier); Audio_.powerDown();       // 曲は止めない。段が落ちるだけ（下限は割らない）
    G.fx.comboBreak = 1;
    G.fx.shake = Math.max(G.fx.shake, .30);
  } else Music.tier = 0;
  G.beatPhase = 0; G.beatPulse = 0;
}

/* 段が上がったら層とテンポが増える */
function bumpCombo(){
  G.combo++;
  G.best = Math.max(G.best, G.combo);
  const t = comboTier(G.combo);
  if(t !== G.comboTier){
    musicTier(t);
    if(t > 0){
      React.say('b6_tier' + t, 2);
      Audio_.riser(t);
      G.fx.flash = Math.max(G.fx.flash, .10 + t*.05);
      G.fx.shake = Math.max(G.fx.shake, .10 + t*.08);
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   7. 描画
   ══════════════════════════════════════════════════════════════ */
/* ★導入中は「中身が変わった時だけ」描く（2026-09-21）。
   ここが**エディタ単体との決定的な違い**だった。
   導入の画はフリッキー（別レイヤーの iframe）が本体で、ゲームのキャンバスは
   **真っ黒に塗るだけ**。それなのに毎コマ 1920×1080 を塗り直していた＝
   合成器に**毎秒60回、8MB のキャンバスを送り直させていた**。
   エディタ単体にはこの2枚目のキャンバスが無い。だから単体だけ滑らかだった。
   → 段・字幕・メッセージ・準備の進み具合が変わった時だけ描く。
     それ以外のコマは**一切触らない**ので、合成器はフリッキーの層だけ更新すればよくなる。 */
/* ══════════════════════════════════════════════════════════════
   Prof ── コマが落ちた瞬間に「何をしていたか」を残す（坂田案 2026-09-21）
   「こまおちした瞬間と秒数とかログを出せるようにすれば原因が特定できるんじゃない？」

   測るのではなく**記録する**。実際に落ちた時の中身だけ残るので、
   こちらの計測の癖（GPU待ちを含む/含まない）に振り回されない。
   ・自前の処理は名前ごとに積む（frameBody の中の内訳）
   ・**longtask**（50ms以上ブラウザが詰まった事象）も拾う。**どこが詰めたか**まで出る
     （iframe なら container の種類が入る＝フリッキーが犯人かどうか分かる）
   ・GC の目安としてヒープの増減も残す
   U キーで画面に出す。紗幕には出ない（オペHUDと同じ扱い）
   ══════════════════════════════════════════════════════════════ */
const Prof = {
  cur:{}, last:{}, t0:0, log:[], tasks:[], show:false, heap0:0, obs:null, loaf:[], loafObs:null,
  /* ★関所（2026-09-22）。コマの中に印を打っておいて、落ちた時に
     「どの印とどの印の間で時間が飛んだか」を出す。
     物理や描画がまるごと 500ms に化ける現象の、実際の切れ目を掴むため。
     配列は作り直さない（ゴミを出すと、それ自体が原因になる）。 */
  kn: new Array(64), kt: new Float64Array(64), ki: 0,
  ln: new Array(64), lt: new Float64Array(64), li: 0,
  k(name){ if(this.ki < 64){ this.kn[this.ki] = name; this.kt[this.ki] = performance.now(); this.ki++; } },
  gaps(){
    const out = [];
    for(let i=1;i<this.li;i++){
      const d = this.lt[i] - this.lt[i-1];
      if(d > 1.5) out.push({ a: this.ln[i-1], b: this.ln[i], d });
    }
    out.sort((x,y)=> y.d - x.d);
    return out.slice(0,3).map(g => g.a + '→' + g.b + ' ' + g.d.toFixed(1)).join('  ');
  },
  work(){ let n = 0; for(const k in this.cur) if(k !== '_kb') n += this.cur[k]; return n; },
  begin(){ this.cur = {}; this.ki = 0; this.heap0 = (performance.memory ? performance.memory.usedJSHeapSize : 0); },
  t(name){ const a = performance.now(); return ()=>{ this.cur[name] = (this.cur[name]||0) + (performance.now()-a); }; },
  end(){
    if(performance.memory) this.cur._kb = Math.round((performance.memory.usedJSHeapSize - this.heap0)/1024);
    this.last = this.cur;
    /* 印を「直前のコマ」側へ移す。次のコマの頭で落ちたと分かるので */
    const n = this.ki; this.li = n;
    for(let i=0;i<n;i++){ this.ln[i] = this.kn[i]; this.lt[i] = this.kt[i]; }
  },
  /* コマが落ちた。直前のコマの中身を残す */
  drop(now, raw){
    const b = this.last, parts = [];
    for(const k in b) if(k !== '_kb' && b[k] > 0.4) parts.push(k + ' ' + b[k].toFixed(1));
    parts.sort((x,y)=> parseFloat(y.split(' ')[1]) - parseFloat(x.split(' ')[1]));
    /* ★まだ配達されていない longtask を、ここで自分から取りに行く（2026-09-22）。
       Observer の通知は**次のコマまで来ない**ので、以前は落ちた当のコマが
       いつも「記録なし」になっていた（151件中67件）。 */
    try{ if(this.obs){ const pend = this.obs.takeRecords(); if(pend && pend.length) this._push(pend); } }catch(e){}
    const tk = this.tasks.filter(t => t.at + t.ms > now - raw - 60 && t.at < now + 1);

    this.log.push({
      s: +(now/1000).toFixed(2),
      ms: Math.round(raw),
      act: G ? (G.act + (G.act==='intro' ? '/'+Intro.phase : (G.gate&&G.gate.freeze?'/停止':''))) : '-',
      mine: parts.slice(0,4).join('  ') || '(自前は軽い)',
      gap: this.gaps(),
      brk: '',              // ★あとから _pushLoaf が埋める（通知が遅れて届くため）
      kb: b._kb || 0,
      p: Particles.count(),
      task: tk.length ? tk.map(t=>t.name+' '+Math.round(t.ms)+'ms'+(t.from?'('+t.from+')':'')).join(' / ') : ''
    });
    if(this.log.length > 40) this.log.shift();
    this.queue.push(this.log[this.log.length-1]);
    this.flushSoon();
  },
  /* ★記録をサーバへ送って `_droplog.jsonl` に溜める（坂田 2026-09-21
     「スクショじゃなくてどっかにデータ溜まるようにしなよ」）。
     まとめて2秒おきに送る。落ちている最中に送ると、送る処理自体がさらに落とす。
     サーバが古い（POST を受けない）時は静かに諦める＝本番の邪魔をしない。 */
  /* 記録の送信は手元（localhost）でだけ。配った先には受け口が無いので最初から切る */
  queue:[], _timer:0,
  sendOK: /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname),
  flushSoon(){
    if(this._timer || !this.sendOK) return;
    this._timer = setTimeout(()=>{ this._timer = 0; this.flush(); }, 3500);
  },
  flush(){
    if(!this.queue.length || !this.sendOK) return;
    const rows = this.queue.splice(0, this.queue.length);
    rows.forEach(r => { r.mode = SHOW ? 'show' : 'rehearsal'; });
    try{
      fetch('droplog', { method:'POST', body: JSON.stringify(rows), keepalive:true })
        .then(r => { if(!r.ok) this.sendOK = false; })
        .catch(()=>{ this.sendOK = false; });
    }catch(e){ this.sendOK = false; }
  },
  /* ★コマの内訳。**通知は落ちたコマより遅れて届く**（取りに行っても、まだ無い）。
     ので、届いた時点で**さかのぼって**記録に書き込む。送り出しは2秒後なので間に合う。
     いちばん効く数字は「**JS以外**」＝ ぜんぶの時間 − 自分のスクリプトの時間。
     ここが大きければ、原因は自分の書いたコードの外（合成・描き出し・待ち）。 */
  _pushLoaf(entries){
    for(const e of entries){
      let js = 0, top = '', topMs = 0;
      try{ for(const x of (e.scripts||[])){
             js += x.duration;
             if(x.duration > topMs){ topMs = x.duration; top = x.invoker || x.name || x.sourceURL || ''; } } }catch(err){}
      const f = {
        at: e.startTime, ms: e.duration,
        js: Math.round(js),
        out: Math.round(e.duration - js),                 // ★JS以外
        layout: Math.round(e.styleAndLayoutStart ? (e.startTime + e.duration - e.styleAndLayoutStart) : 0),
        top: String(top).slice(-24)
      };
      this.loaf.push(f);
      if(this.loaf.length > 40) this.loaf.shift();
      /* さかのぼって、重なる記録に書き込む */
      const txt = '全' + Math.round(f.ms) + ' JS' + f.js + ' JS以外' + f.out
                + ' レイアウト' + f.layout + (f.top ? ' <' + f.top + '>' : '');
      for(const d of this.log){
        if(d.brk) continue;
        const end = d.s * 1000, start = end - d.ms;
        if(f.at < end + 40 && f.at + f.ms > start - 40) d.brk = txt;
      }
    }
  },
  _push(entries){
    for(const e of entries){
      let from = '';
      try{ const a = e.attribution && e.attribution[0];
           if(a) from = (a.containerType||'') + (a.containerId? ':'+a.containerId : '') + (a.containerName? ':'+a.containerName:''); }catch(err){}
      /* ★at は「届いた時刻」ではなく**始まった時刻**（e.startTime）。
         届いた時刻で持つと、落ちたコマ自身をいつも取り逃がす。 */
      this.tasks.push({at: e.startTime, name: e.name, ms: e.duration, from});
      if(this.tasks.length > 60) this.tasks.shift();
    }
  },
  /* ★「いま動いているのは最新の版か」を自分で確かめる（2026-09-22）。
     サーバがキャッシュを禁じていなかったので、**直したのに古い写しが動く**ことがあり得た。
     取り直した版と、いま走っている版の更新時刻を比べる。ずれていたら画面と op に出す。
     ついでに、どんな環境で動いているか（窓の大きさ・倍率・画面の速さ・パッド）も記録に残す。
     「こちらでは再現しない」を終わらせるため。 */
  stale:false, arch:'',
  /* いま動いている Chrome が arm64 か x86（Rosetta 翻訳）かを自分で確かめる */
  checkArch(){
    try{
      if(!navigator.userAgentData || !navigator.userAgentData.getHighEntropyValues) return;
      navigator.userAgentData.getHighEntropyValues(['architecture','bitness']).then(v=>{
        this.arch = (v.architecture || '?') + (v.bitness ? '/' + v.bitness : '');
        if(/x86/i.test(v.architecture || '')){
          OpLink.error('Chrome が Intel 版で動いています（Rosetta 翻訳）。アプリから起動し直してください');
        }
      }).catch(()=>{});
    }catch(e){}
  },
  checkBuild(){
    try{
      const mine = new Date(document.lastModified).getTime();
      fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store', method:'HEAD'})
        .then(r=>{
          const lm = r.headers.get('Last-Modified');
          if(!lm) return;
          if(new Date(lm).getTime() - mine > 2000){
            this.stale = true;
            OpLink.error('古い版で動いています。⌘⇧R で読み直してください');
          }
        }).catch(()=>{});
    }catch(e){}
  },
  env(){
    let pads = [];
    try{ for(const p of (navigator.getGamepads ? navigator.getGamepads() : [])) if(p && p.connected) pads.push(p.id); }catch(e){}
    return {
      act:'env', s:0, ms:0, mine:'', gap:'', brk:'', kb:0, p:0, task:'',
      絵の段: Quality.name(),
      /* ★これが本命だった（2026-09-22）。M1 の上で x86 版の Chrome が
         Rosetta 翻訳されながら走っていると、**初めて通る所だけ**が重くなる
         （坂田「何かが出現する瞬間は遅くなる」）。'x86' と出たら本物ではない。 */
      CPU: Prof.arch || '(調査中)',
      GPU: (()=>{ try{
             const c = document.createElement('canvas').getContext('webgl');
             const d = c && c.getExtension('WEBGL_debug_renderer_info');
             return d ? c.getParameter(d.UNMASKED_RENDERER_WEBGL) : (c ? '(型番は伏せられている)' : 'WebGL無し');
           }catch(e){ return 'エラー'; } })(),
      窓: innerWidth + 'x' + innerHeight, 倍率: devicePixelRatio,
      画面: screen.width + 'x' + screen.height,
      画面の速さ: this.hz || 0,
      パッド: pads.join(' / ') || 'なし',
      版: document.lastModified, 古い版: this.stale,
      Chrome: (navigator.userAgentData && navigator.userAgentData.brands || [])
              .map(b=>b.brand + ' ' + b.version).join(',') || navigator.appVersion.slice(0,40)
    };
  },
  /* 画面の速さ（60Hz か 120Hz か）を測る。同じ60msでも意味が変わる */
  measureHz(){
    let n = 0, t0 = 0;
    const tick = t => { if(!t0) t0 = t; if(++n < 60) requestAnimationFrame(tick);
                        else this.hz = Math.round(1000 / ((t - t0) / (n - 1))); };
    requestAnimationFrame(tick);
  },
  initTasks(){
    this.checkBuild(); this.measureHz(); this.checkArch();
    setTimeout(()=>{ this.queue.push(this.env()); this.flushSoon(); }, 6000);
    try{
      this.obs = new PerformanceObserver(list=>{ this._push(list.getEntries()); });
      this.obs.observe({type:'longtask', buffered:true});
    }catch(e){}
    /* ★コマの内訳を Chrome 自身に吐かせる（long-animation-frame・2026-09-22）。
       longtask は「JSが長かった」しか言わない。これは1コマを
       **スクリプト / スタイル・レイアウト / 描き出し** に割って返す。
       ヘッドレス（GPU無し）では1コマ 0.05ms なのに実機で 300ms かかる＝
       時間は自前のJSの外にある。どこなのかを、推測ではなくブラウザに答えさせる。 */
    try{
      this.loafObs = new PerformanceObserver(list=>{ this._pushLoaf(list.getEntries()); });
      this.loafObs.observe({type:'long-animation-frame', buffered:true});
    }catch(e){ this.loafObs = null; }
  },
  text(){
    if(!this.log.length) return 'コマ落ちの記録：まだ無し（U で閉じる）';
    const L = ['コマ落ちの記録  新しい順  ' + this.log.length + '件   [U]閉じる', ''];
    for(let i=this.log.length-1;i>=0;i--){
      const d = this.log[i];
      L.push(d.s + 's  ' + String(d.ms).padStart(3) + 'ms  ' + d.act
             + '   粒' + d.p + '  ゴミ' + d.kb + 'KB');
      L.push('     自前: ' + d.mine);
      if(d.brk)  L.push('     内訳: ' + d.brk);
      if(d.gap)  L.push('     切れ目: ' + d.gap);
      if(d.task) L.push('     詰まり: ' + d.task);
    }
    return L.join('\n');
  }
};
